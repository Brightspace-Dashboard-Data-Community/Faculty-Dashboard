<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="D2L Faculty Dashboard - Discussions Analytics">
    <title>Discussions - D2L Faculty Dashboard</title>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
          crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- Universal Styles -->
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <!-- Skip to main content link for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <!-- Navigation Sidebar (loaded dynamically) -->
    <div id="nav-placeholder"></div>
    
    <!-- Main Content Area -->
    <main id="main-content" class="main-content" role="main">
        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="index.html">Home</a>
            <span class="breadcrumb-separator">/</span>
            <span>Discussions</span>
        </div>
        
        <!-- Page Header -->
        <div class="page-header">
            <div class="page-header-content">
                <div>
                    <h1 class="page-title">Discussions</h1>
                    <p class="page-subtitle">View and manage discussion topics and posts without replies</p>
                </div>
                <div class="page-header-right">
                    <span class="semester-label" data-fd-semester-banner="active"></span>
                </div>
            </div>
        </div>

        <div class="widget-container">
            <div class="info-card" style="margin-bottom: 1rem;">
                <div class="info-card-title">
                    <i class="fas fa-user-friends" aria-hidden="true"></i>
                    Related: 1-on-1 Discussion Activity
                </div>
                <div class="info-card-content">
                    <p>Monitor private instructor–student discussion boards (including those created by Private Student Conversations) on the <a href="one-on-one-discussions.html">1-on-1 Activity</a> page.</p>
                </div>
            </div>
        </div>
        
        <!-- Course Filter -->
        <div class="widget-container">
            <div class="course-filter-section">
                <div class="course-filter-container">
                    <label for="discussions-course-filter-select" class="course-filter-label">Filter by Course:</label>
                    <select id="discussions-course-filter-select" class="course-filter-select" aria-label="Select course">
                        <option value="all">All Courses</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- Discussions Widget -->
        <div class="widget-container">
            <div id="discussions-widget"></div>
        </div>
    </main>
    
    <!-- JavaScript -->
    <script src="js/semester-config.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/course-offerings.js"></script>
    <script src="js/discussions.js"></script>
</body>
</html>
