<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="D2L Faculty Dashboard - Students">
    <title>Students - D2L Faculty Dashboard</title>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
          crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- Universal Styles -->
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <!-- Skip to main content link for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <!-- Navigation Sidebar (loaded dynamically) -->
    <div id="nav-placeholder"></div>
    
    <!-- Main Content Area -->
    <main id="main-content" class="main-content" role="main">
        <!-- Page Header -->
        <div class="page-header">
            <div class="page-header-content">
                <div>
                    <h1 class="page-title">Students</h1>
                    <p class="page-subtitle">View and manage your students across all courses</p>
                    <p class="page-subtitle" style="margin-top: 12px; margin-bottom: 0;">
                        <a href="https://intranet.example.edu/student-support-system/faculty.html"
                           target="_blank"
                           rel="noopener noreferrer"
                           style="color: #0f5b46; font-weight: 700; text-decoration: none;">
                            Submit SSS Referral
                        </a>
                        <span style="color: #6b7280; font-weight: 400;"> — Student Support System (faculty)</span>
                    </p>
                </div>
                <div class="page-header-right">
                    <span class="semester-label" data-fd-semester-banner="active"></span>
                </div>
            </div>
        </div>
        
        <!-- Students Widget -->
        <div class="widget-container">
            <div id="students-widget"></div>
        </div>
    </main>
    
    <!-- Student Detail Modal -->
    <div id="student-detail-modal" class="student-detail-modal">
        <div class="student-detail-content">
            <div id="student-detail-content"></div>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script src="js/semester-config.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/students.js"></script>
</body>
</html>
