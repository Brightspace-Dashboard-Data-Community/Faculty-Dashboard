<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="D2L Faculty Dashboard - Course Merge Form">
    <title>Course Merge Form - D2L Faculty Dashboard</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="nav-placeholder"></div>

    <main id="main-content" class="main-content" role="main">
        <div class="page-header">
            <h1 class="page-title">Course Merge Form</h1>
            <p class="page-subtitle">Choose the form for the term you need.</p>
        </div>

        <div class="sandbox-main-content">
            <section class="sandbox-section">
                <div class="sandbox-section-header">
                    <h2 class="sandbox-section-title">Available Forms</h2>
                    <div class="sandbox-section-separator"></div>
                </div>

                <p class="sandbox-description">
                    Open the course merge request tool to select your primary and merge courses, then complete the prefilled Zoho form.
                </p>

                <div style="display: grid; gap: 16px; max-width: 720px;">
                    <a class="launch-tool-btn"
                       href="ZohoCourseMergewithAPIs/zohoform/27WI-Course-Merge.html"
                       target="_blank"
                       rel="noopener noreferrer"
                       aria-label="Open Winter 2027 course merge request form">
                        <span>Winter 2027 Course Merge Request</span>
                        <i class="fas fa-external-link-alt" aria-hidden="true"></i>
                    </a>
                    <a class="launch-tool-btn"
                       href="ZohoCourseMergewithAPIs/zohoform/26FA-Course-Merge.html"
                       target="_blank"
                       rel="noopener noreferrer"
                       aria-label="Open Fall 2026 course merge request form">
                        <span>Fall 2026 Course Merge Request</span>
                        <i class="fas fa-external-link-alt" aria-hidden="true"></i>
                    </a>
                </div>
            </section>
        </div>
    </main>

    <script src="js/navigation.js"></script>
</body>
</html>
