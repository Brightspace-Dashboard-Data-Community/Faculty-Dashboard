<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="D2L Faculty Dashboard - Announcements">
    <title>Announcements - D2L Faculty Dashboard</title>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
          crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- Universal Styles -->
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <!-- Skip to main content link for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <!-- Navigation Sidebar (loaded dynamically) -->
    <div id="nav-placeholder"></div>
    
    <!-- Main Content Area -->
    <main id="main-content" class="main-content" role="main">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title">Announcements</h1>
            <p class="page-subtitle">Stay informed about D2L updates, announcements, and important information</p>
        </div>

        <!-- Summary Cards -->
        <div class="announcements-summary" id="announcements-summary">
            <!-- Summary cards will be loaded here dynamically -->
        </div>

        <!-- Filter Buttons -->
        <div class="announcements-filters" id="announcements-filters">
            <!-- Filter buttons will be loaded here dynamically -->
        </div>

        <!-- Pinned Announcements Section -->
        <div class="announcements-section">
            <div class="section-header">
                <i class="fas fa-thumbtack section-header-icon" aria-hidden="true"></i>
                <h2 class="section-header-title">Pinned Announcements</h2>
            </div>
            <div class="section-separator"></div>
            <div id="pinned-announcements">
                <!-- Pinned announcements will be loaded here dynamically -->
            </div>
        </div>

        <!-- Recent Announcements Section -->
        <div class="announcements-section">
            <div class="section-header">
                <i class="fas fa-bars section-header-icon" aria-hidden="true"></i>
                <h2 class="section-header-title">Recent Announcements</h2>
            </div>
            <div class="section-separator"></div>
            <div id="recent-announcements">
                <!-- Recent announcements will be loaded here dynamically -->
            </div>
        </div>
    </main>
    
    <!-- JavaScript -->
    <script src="js/faculty-news-data.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/news-updates.js"></script>
</body>
</html>
