<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="D2L Faculty Dashboard - Assignments Analytics">
    <title>Assignments - D2L Faculty Dashboard</title>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
          crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- Universal Styles -->
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <!-- Skip to main content link for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <!-- Navigation Sidebar (loaded dynamically) -->
    <div id="nav-placeholder"></div>
    
    <!-- Main Content Area -->
    <main id="main-content" class="main-content" role="main">
        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="index.html">Home</a>
            <span class="breadcrumb-separator">/</span>
            <span>Assignments</span>
        </div>
        
        <!-- Page Header -->
        <div class="page-header">
            <div class="page-header-content">
                <div>
                    <h1 class="page-title">Assignments</h1>
                    <p class="page-subtitle">View and manage assignment submissions across your courses</p>
                </div>
                <div class="page-header-right">
                    <span class="semester-label" data-fd-semester-banner="active"></span>
                </div>
            </div>
        </div>
        
        <!-- Course Filter -->
        <div class="widget-container">
            <div class="course-filter-section">
                <div class="course-filter-container">
                    <label for="assignments-course-filter-select" class="course-filter-label">Filter by Course:</label>
                    <select id="assignments-course-filter-select" class="course-filter-select" aria-label="Select course">
                        <option value="all">All Courses</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- Assignments Widget -->
        <div class="widget-container">
            <div id="assignments-widget"></div>
        </div>
    </main>
    
    <!-- JavaScript -->
    <script src="js/semester-config.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/assignments.js"></script>
    <script>
        // Populate course filter dropdown
        (function() {
            var courseSelect = document.getElementById("assignments-course-filter-select");
            if (!courseSelect) return;
            
            var coursesData = localStorage.getItem("dashboardCourses");
            if (coursesData) {
                try {
                    var courses = JSON.parse(coursesData);
                    var courseId = new URLSearchParams(window.location.search).get('courseId') || "all";
                    
                    // Clear existing options except "All Courses"
                    courseSelect.innerHTML = '<option value="all">All Courses</option>';
                    
                    // Add each course as an option
                    for (var i = 0; i < courses.length; i++) {
                        var course = courses[i];
                        var courseName = course.OrgUnit.Name || "Unknown Course";
                        var courseCode = course.OrgUnit.Code || "";
                        var orgUnitId = course.OrgUnit.Id;
                        var option = document.createElement("option");
                        option.value = orgUnitId;
                        option.textContent = courseName + (courseCode ? " (" + courseCode + ")" : "");
                        if (orgUnitId.toString() === courseId.toString()) {
                            option.selected = true;
                        }
                        courseSelect.appendChild(option);
                    }
                    
                    // Add change listener to update URL
                    courseSelect.addEventListener("change", function() {
                        var selectedCourseId = courseSelect.value;
                        var urlParams = new URLSearchParams(window.location.search);
                        urlParams.set('courseId', selectedCourseId);
                        window.location.search = urlParams.toString();
                    });
                } catch (e) {
                    console.error("Error populating course filter:", e);
                }
            }
        })();
    </script>
</body>
</html>
