  if (typeof window._flushDebugBuffer === 'function') window._flushDebugBuffer();

  // ── Group defaults: first tab in each group ─────────────────
  const GROUP_DEFAULTS = {
    engagement: 'matrix',
    student: 'student-activity',
    course: 'grades',
    grading: 'grading-helper',
    calendar: 'calendar'
  };

  function switchToGroup(groupId) {
    // Update group row
    document.querySelectorAll('.tab-group').forEach(g => g.classList.remove('active'));
    document.querySelector(`.tab-group[data-group="${groupId}"]`)?.classList.add('active');

    // Show only tabs for this group, hide others
    document.querySelectorAll('.tab').forEach(t => {
      if (t.getAttribute('data-group') === groupId) {
        t.style.display = '';
      } else {
        t.style.display = 'none';
        t.classList.remove('active');
      }
    });
  }

  function switchToTab(tabId) {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    const tabEl = document.querySelector(`.tab[data-tab="${tabId}"]`);
    if (tabEl) tabEl.classList.add('active');
    document.getElementById(`p-${tabId}`)?.classList.add('active');
    setTimeout(() => { Object.values(Chart.instances).forEach(c => c.resize()); }, 60);

    // Lazy load data for statistics-group tabs
    if (['grades', 'announcements', 'content-time', 'student-activity'].includes(tabId)) {
      if (!_tabGroupLoaded.statistics) {
        loadStatisticsData(data, classMembers);
        _tabGroupLoaded.statistics = true;
      }
    }
    // Lazy load activity tracker
    if (tabId === 'activity-tracker') {
      if (!_tabGroupLoaded.activityTracker) {
        loadActivityTrackerData(data, classMembers);
        _tabGroupLoaded.activityTracker = true;
      }
    }
    // Lazy load grading helper
    if (tabId === 'grading-helper') {
      if (!_tabGroupLoaded.gradingHelper) {
        loadGradingHelperPanel(data, classMembers);
        _tabGroupLoaded.gradingHelper = true;
      }
    }
    // Lazy load calendar
    if (tabId === 'calendar') {
      if (!_tabGroupLoaded.calendar) {
        loadCalendarPanel(data, classMembers);
        _tabGroupLoaded.calendar = true;
      }
    }
    if (tabId === 'disc-calendar') {
      renderDiscussionCalendar();
      wireDiscussionCalendarControls();
    }
    if (tabId === 'asn-status' || tabId === 'asn-ungraded' || tabId === 'asn-calendar') {
      loadAssignmentEngagementTab(tabId, classMembers, isInst);
    }
    // Lazy load grade feedback. Instructor-only view; the API endpoints
    // require instructor permissions to read other students' Comments.
    if (tabId === 'grade-feedback') {
      if (!_tabGroupLoaded.gradeFeedback) {
        loadGradeFeedbackPanel(classMembers, isInst);
        _tabGroupLoaded.gradeFeedback = true;
      }
    }
    // Lazy load grade trends. Instructor-only (cross-student grade
    // values). Class-wide aggregates only — no individual student data.
    if (tabId === 'grade-trends') {
      if (!_tabGroupLoaded.gradeTrends) {
        loadGradeTrendsPanel(classMembers, isInst);
        _tabGroupLoaded.gradeTrends = true;
      }
    }
  }

  // Group click → show that group's tabs, activate its default tab
  document.querySelectorAll('.tab-group').forEach(g => {
    g.addEventListener('click', () => {
      const groupId = g.getAttribute('data-group');
      switchToGroup(groupId);
      // Activate the default tab for this group (or the first visible active one)
      const activeTab = document.querySelector(`.tab[data-group="${groupId}"].active`);
      const defaultTab = activeTab ? activeTab.getAttribute('data-tab') : GROUP_DEFAULTS[groupId];
      switchToTab(defaultTab);
    });
  });

  // Tab click → switch to that tab (group stays the same)
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      switchToTab(t.getAttribute('data-tab'));
    });
  });

  const kpiEl = document.getElementById('kpiRow');
  if (kpiEl) {
    const kpis = isInst
      ? [
          { label: 'Enrolled', value: data.totalStudents || classMembers.length, cls: 'dark' },
          { label: 'Discussion Posts', value: (data.totalPosts||0) + (data.totalReplies||0), cls: '' },
          { label: 'Interaction Coverage', value: pc(interactedCount, classMembers.length) + '%', cls: 'gold' }
        ]
      : [
          { label: 'Discussion Posts', value: (data.myPosts||0) + (data.myReplies||0), cls: '' },
          { label: 'Interaction Coverage', value: pc(interactedCount, classMembers.length) + '%', cls: 'gold' }
        ];
  }

  // Data population moved to populateEngagementData() for progressive loading
  const refreshBtn = document.getElementById('btnRefresh');
  if (refreshBtn) {
    refreshBtn.addEventListener('click', () => {
      refreshBtn.classList.add('loading');
      refreshBtn.querySelector('svg').style.animation = 'spin .8s linear infinite';
      Object.values(Chart.instances).forEach(c => c.destroy());
      main().finally(() => {
        const btn = document.getElementById('btnRefresh');
        if (btn) { btn.classList.remove('loading'); }
      });
    });
  }

  const printBtn = document.getElementById('btnPrint');
  if (printBtn) {
    printBtn.addEventListener('click', () => {
      const activeTab = document.querySelector('.tab.active');
      const tabName = activeTab ? activeTab.textContent.trim() : 'Dashboard';
      const activePanel = document.querySelector('.panel.active');
      if (!activePanel) return;

      const cloned = activePanel.cloneNode(true);
      const canvases = activePanel.querySelectorAll('canvas');
      const clonedCanvases = cloned.querySelectorAll('canvas');
      canvases.forEach((cv, i) => {
        try {
          const img = document.createElement('img');
          img.src = cv.toDataURL('image/png');
          img.style.cssText = 'width:100%;max-height:240px;object-fit:contain';
          clonedCanvases[i].parentNode.replaceChild(img, clonedCanvases[i]);
        } catch(e) {}
      });

      const kpiRow = document.getElementById('kpiRow');
      const hdrEl = document.querySelector('.hdr');

      const printStyles = document.querySelector('style').textContent;
      const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8">

<style>
${printStyles}
body{margin:0;padding:0;background:#fff}
.app{max-width:100%;padding:20px 24px}

.print-label{font-family:var(--hf);font-size:14px;color:var(--lg);margin-bottom:12px;border-bottom:1px solid #E8ECF0;padding-bottom:6px}
@media print{

  .no-print{display:none!important}
}

/** Render the avg-time-to-response KPI banner above the 1-on-1 tables.
 *  Called twice: first with no closure filter (fast initial paint), then
 *  again from runOOClosureAnalysis once each thread's latest student
 *  message has been classified. closureSids is a Set of student ids
 *  whose last message was a conversational closer — those threads are
 *  excluded from the avg-response calc since the instructor "doesn't
 *  need to" respond, and counting them would skew the metric. */
function renderOOKpi(ooEntries, opts) {
  const banner = document.getElementById('oneOnOneKpi');
  if (!banner) return;
  const closureSids = (opts && opts.closureSids) || null;
  const closedStudentInitCount = (opts && typeof opts.closedStudentInitCount === 'number') ? opts.closedStudentInitCount : 0;
  const closedInstrInitCount   = (opts && typeof opts.closedInstrInitCount   === 'number') ? opts.closedInstrInitCount   : 0;

  // Instructor response-time math (per user spec):
  //   • Student-initiated thread:
  //     gap = (first instructor reply) - (student's first post)
  //     — measures how quickly the instructor jumped on the initial
  //     student outreach.
  //   • Instructor-initiated thread:
  //     gap = (instructor's follow-up) - (student's response),
  //     skipped when the student response is just a closure
  //     ("thanks", "I have reviewed", etc.).
  //
  // Both gaps measure "instructor response time when it's their turn."
  // Threads without enough data (no instructor reply yet, or no
  // student response yet for instr-init) contribute no gap.
  const gaps = [];
  let openThreads = 0;            // student waiting on instructor (non-stale)
  let openNonClosure = 0;         // open threads excluding closers
  let totalActive = 0;            // threads with any student activity
  ooEntries.forEach(([sid, oo]) => {
    if (!oo.lastStudentDate) return;
    totalActive++;

    // Compute the response-time gap from responseGapData if available.
    const rg = oo.responseGapData;
    if (rg) {
      if (oo.initiatedBy !== 'instructor') {
        // Student-initiated: gap = first instr reply - first student post
        if (rg.firstStudentDate && rg.firstInstrReplyAfterStudent) {
          const gap = (new Date(rg.firstInstrReplyAfterStudent).getTime() - new Date(rg.firstStudentDate).getTime()) / 3600000;
          if (gap > 0) gaps.push(gap);
        }
      } else {
        // Instructor-initiated: gap = instr follow-up - student response,
        // but only when the student response is substantive (not a closure).
        const studentRespIsClosure = rg.firstStudentReplyAfterInstrMsg
          && typeof CLOSURE_ANALYZER.isClosureSync === 'function'
          && CLOSURE_ANALYZER.isClosureSync(rg.firstStudentReplyAfterInstrMsg);
        if (rg.firstStudentReplyAfterInstr && rg.firstInstrFollowupAfterStudentReply && !studentRespIsClosure) {
          const gap = (new Date(rg.firstInstrFollowupAfterStudentReply).getTime() - new Date(rg.firstStudentReplyAfterInstr).getTime()) / 3600000;
          if (gap > 0) gaps.push(gap);
        }
      }
    }

    // Open-thread count (stale-aware) — independent of response-gap calc.
    const sDate = new Date(oo.lastStudentDate).getTime();
    const iDate = oo.lastInstructorDate ? new Date(oo.lastInstructorDate).getTime() : null;
    const isClosure = closureSids && closureSids.has(String(sid));
    const stale = isOoStale(oo);
    if (iDate && iDate > sDate) {
      // Closed loop — no badge.
    } else if (stale) {
      // Stale → considered closed.
    } else {
      openThreads++;
      if (!isClosure) openNonClosure++;
    }
  });

  let avgLabel = '—';
  let avgClass = '';
  if (gaps.length) {
    const avgHrs = gaps.reduce((a, b) => a + b, 0) / gaps.length;
    // Display in hours + minutes regardless of magnitude — easier to
    // read at a glance than "1.7 days" and matches the granularity of
    // a typical instructor's response cycle.
    const totalMinutes = Math.max(0, Math.round(avgHrs * 60));
    const wholeHours   = Math.floor(totalMinutes / 60);
    const wholeMinutes = totalMinutes % 60;
    avgLabel = wholeHours + 'h ' + wholeMinutes + 'm';
    // Color thresholds stay the same — good < 24h, warn < 72h, bad ≥ 72h.
    if (avgHrs < 24)      avgClass = 'good';
    else if (avgHrs < 72) avgClass = 'warn';
    else                  avgClass = 'bad';
  }

  const filterNote = closureSids
    ? `${gaps.length} thread${gaps.length === 1 ? '' : 's'} · closures excluded`
    : `${gaps.length} thread${gaps.length === 1 ? '' : 's'}`;

  banner.innerHTML =
      `<div class="oo-kpi-cell ${avgClass}">
         <span class="oo-kpi-label">Avg. response time</span>
         <span class="oo-kpi-value">${avgLabel}</span>
         <span class="oo-kpi-sub">${filterNote}</span>
       </div>
       <div class="oo-kpi-cell">
         <span class="oo-kpi-label">Student threads handled</span>
         <span class="oo-kpi-value">${closedStudentInitCount}</span>
         <span class="oo-kpi-sub">You replied, inactive, or no reply needed</span>
       </div>
       <div class="oo-kpi-cell">
         <span class="oo-kpi-label">Your threads handled</span>
         <span class="oo-kpi-value">${closedInstrInitCount}</span>
         <span class="oo-kpi-sub">You replied last, inactive, or no follow-up needed</span>
       </div>`;
  banner.style.display = 'grid';
}

/** Closure-analyze each 1-on-1 thread's latest student message and remove
 *  the "needs reply" badge if it's just a conversation closer. Runs after
 *  the table is in the DOM; updates badges in-place so the table stays
 *  usable while analysis progresses. Skips silently if the row no longer
 *  exists (e.g. user switched tabs). Also re-renders the KPI banner so
 *  closure messages don't inflate the response-time metric. */
async function runOOClosureAnalysis(ooEntries, opts) {
  const enrolledIds = opts && opts.enrolledIds;

  /** Student opened the thread and the instructor has never replied —
   *  always actionable. Closure heuristics only apply after the
   *  instructor has participated at least once (or for stale threads). */
  function isAwaitingFirstInstructorReply(oo) {
    return oo.initiatedBy !== 'instructor'
      && (oo.postsFromInstructor || 0) === 0
      && !!oo.lastStudentDate
      && !isOoStale(oo);
  }

  // Helper to hide the "Calculating thread status…" overlay no matter
  // how this function exits (early-return, error, or normal complete).
  const hideCalculatingOverlay = () => {
    const el = document.getElementById('oneOnOneCalculating');
    if (el) el.classList.add('hidden');
  };
  // Build the per-entry list of student messages to analyze. The new
  // multi-conversation model gives us oo.unansweredStudentPosts — an
  // array of every student post in the topic whose date is AFTER the
  // last instructor reply, sorted newest-first. We walk that list to
  // find the latest non-closure post; if all are closures, the thread
  // is fully resolved. Fallback: if the array isn't populated (e.g.
  // training mode mock), use the single lastStudentMessage field.
  // Stale entries skip the analyzer entirely — they're already
  // treated as closed by the badge + KPI logic, so there's no value
  // in burning ML cycles on them. We still want them in closureSids
  // so renderOOKpi excludes them from the open-thread count.
  const candidates = ooEntries.filter(([sid, oo]) => {
    if (isOoStale(oo)) return false;
    const arr = oo.unansweredStudentPosts;
    if (arr && arr.length) return true;
    return oo.lastStudentDate &&
           (!oo.lastInstructorDate || new Date(oo.lastStudentDate) > new Date(oo.lastInstructorDate)) &&
           (oo.lastStudentMessage || '').trim().length > 0;
  });

  // Pre-seed closureSids with every stale entry so the KPI re-render
  // sees them as resolved. This is what makes "stale-with-prior-reply
  // counts as closed at instructor's reply time" work — those rows
  // won't be counted as open threads in the banner.
  const prelimClosureSids = new Set();
  ooEntries.forEach(([sid, oo]) => {
    if (isOoStale(oo)) prelimClosureSids.add(String(sid));
  });

  // If nothing's analyzable AND nothing was stale-seeded, bail early.
  // Hide the overlay first — there's nothing to wait for.
  if (!candidates.length && !prelimClosureSids.size) {
    hideCalculatingOverlay();
    return;
  }

  // Show the status pills under each section header (section-specific).
  const pillStudent = document.getElementById('ooAnalysisPillStudent');
  const pillInstr   = document.getElementById('ooAnalysisPillInstr');
  const pillInstrNoResp = document.getElementById('ooAnalysisPillInstrNoResp');
  function showPill(pill, text) {
    if (!pill) return;
    pill.style.display = 'inline-block';
    pill.textContent = text;
  }
  function hidePill(pill) {
    if (!pill) return;
    pill.style.display = 'none';
    pill.textContent = '';
  }
  hidePill(pillStudent);
  hidePill(pillInstr);
  hidePill(pillInstrNoResp);

  /** Which actionable section owns this thread for pill tallies. */
  function pillSectionFor(oo) {
    if (oo.initiatedBy !== 'instructor') return 'student';
    if ((oo.postsFromStudent || 0) === 0) return 'instrNoResp';
    if (oo.lastStudentDate
        && (!oo.lastInstructorDate || new Date(oo.lastStudentDate) > new Date(oo.lastInstructorDate))) {
      return 'instrAwait';
    }
    return null;
  }

  const pillStats = {
    student: { analyzed: 0, noReplyNeeded: 0 },
    instrAwait: { analyzed: 0, noReplyNeeded: 0 },
    instrNoResp: { analyzed: 0, noReplyNeeded: 0 },
  };

  // Collect ids of every thread the analyzer classifies as a closure
  // (no unanswered non-closure messages found) so we can pass them
  // into the KPI re-render below. Pre-seeded with stale entries so
  // they show up as closed in the KPI even though the analyzer never
  // touches them.
  const closureSids = new Set(prelimClosureSids);

  // Helper: update a row's visible cells when we resolve the
  // "unanswered" target to a different (earlier) post than what the
  // table originally rendered. Date cell + Open→ link both move to
  // point at the actual message that needs a reply.
  function updateRowCells(sid, post, topicUrl) {
    if (!post) return;
    const dateCell = document.querySelector('td[data-sid="' + sid + '"][data-cell="student-date"]');
    if (dateCell && post.date) dateCell.textContent = relDate(post.date);
    const actionLink = document.querySelector('a[data-sid="' + sid + '"][data-cell="open"]');
    if (actionLink && topicUrl) {
      const href = post.postId
        ? (topicUrl + '?postId=' + encodeURIComponent(post.postId) + '#m_' + encodeURIComponent(post.postId))
        : topicUrl;
      actionLink.setAttribute('href', href);
    }
  }

  let analyzed = 0, removed = 0;
  for (const [sid, oo] of candidates) {
    const pillKey = pillSectionFor(oo);

    // First student outreach with zero instructor replies — skip closure
    // analysis. "Thanks!" heuristics must not hide a thread the
    // instructor has never responded to.
    if (isAwaitingFirstInstructorReply(oo)) {
      analyzed++;
      if (pillKey && pillStats[pillKey]) pillStats[pillKey].analyzed++;
      continue;
    }

    // Walk newest-first through the unanswered student posts. Find
    // the latest one that ISN'T a closure — that's the message the
    // instructor should actually reply to.
    const posts = (oo.unansweredStudentPosts && oo.unansweredStudentPosts.length)
      ? oo.unansweredStudentPosts
      : [{ date: oo.lastStudentDate, message: oo.lastStudentMessage, postId: oo.lastStudentPostId }];

    let resolved = null;        // the first non-closure post we find
    for (const post of posts) {
      let isClosure = false;
      try {
        isClosure = await CLOSURE_ANALYZER.isClosure(post.message);
      } catch (e) {
        console.warn('[ClosureAnalyzer] failed on', sid, e);
        isClosure = false;
      }
      if (!isClosure) { resolved = post; break; }
    }

    analyzed++;
    if (pillKey && pillStats[pillKey]) pillStats[pillKey].analyzed++;

    if (resolved) {
      // Real unanswered message found — point the row cells at it so
      // the instructor sees the right message and the Open→ link
      // deep-links to the right post.
      oo.lastStudentMessage = resolved.message;
      oo.lastStudentDate    = resolved.date;
      oo.lastStudentPostId  = resolved.postId;
      updateRowCells(sid, resolved, oo.topicUrl);
    } else {
      // Every unanswered student post is a closure → no reply needed.
      closureSids.add(String(sid));
      const badge = document.querySelector('.needs-reply-badge[data-sid="' + sid + '"]');
      if (badge) badge.remove();
      removed++;
      if (pillKey && pillStats[pillKey]) pillStats[pillKey].noReplyNeeded++;
    }
  }

  function finalizePill(pill, stats) {
    if (!stats || !stats.analyzed) {
      hidePill(pill);
      return;
    }
    if (stats.noReplyNeeded > 0) {
      showPill(pill, 'Checked ' + stats.analyzed + ' — ' + stats.noReplyNeeded + ' acknowledgment' + (stats.noReplyNeeded === 1 ? '' : 's') + ' only');
    } else {
      showPill(pill, 'Checked ' + stats.analyzed + ' thread' + (stats.analyzed === 1 ? '' : 's'));
    }
  }
  finalizePill(pillStudent,     pillStats.student);
  finalizePill(pillInstr,       pillStats.instrAwait);
  finalizePill(pillInstrNoResp, pillStats.instrNoResp);

  // Re-render the KPI banner with closure exclusions applied so the
  // avg-time-to-response number stops counting "thanks!" messages.
  // Recompute handled-thread counts — closure only applies after the
  // instructor has participated at least once on student-init threads.
  try {
    const isClosedNow = ([sid, oo]) => {
      if (enrolledIds && !enrolledIds.has(String(sid))) return true;
      if (isOoStale(oo)) return true;
      if (oo.lastStudentDate && oo.lastInstructorDate
          && new Date(oo.lastInstructorDate) > new Date(oo.lastStudentDate)) return true;
      if (isAwaitingFirstInstructorReply(oo)) return false;
      if (closureSids.has(String(sid))) return true;
      return false;
    };
    const closedStudentInitCount = ooEntries.filter(e => e[1].initiatedBy !== 'instructor' && isClosedNow(e)).length;
    const closedInstrInitCount   = ooEntries.filter(e => e[1].initiatedBy === 'instructor' && isClosedNow(e)).length;
    renderOOKpi(ooEntries, {
      closureSids,
      enrolledIds,
      closedStudentInitCount,
      closedInstrInitCount,
    });
  } catch (e) { console.warn('[1-on-1 KPI] re-render failed', e); }

  // Analyzer done — drop the calculating overlay so the user sees the
  // final dashboard state.
  hideCalculatingOverlay();

  // Attach the closureSids set to the debug hook so a console dump
  // can show which threads were filtered out by the analyzer.
  try {
    if (window.__bspOO) {
      window.__bspOO.closureSids = closureSids;
      window.__bspOO.analyzedAt  = new Date().toISOString();
    }
  } catch (e) {}
}

function renderScoreboard(forumActivity) {
  const wrap = document.getElementById('scoreboardWrap');
  if (!wrap) return;
  const forumNames = Object.keys(forumActivity);
  if (!forumNames.length) {
    wrap.innerHTML = '<div style="color:var(--lg);font-size:.82rem;padding:12px 0">No forum activity data available</div>';
    return;
  }
  wrap.innerHTML = forumNames.map(fName => {
    const fa = forumActivity[fName];
    const users = Object.values(fa.users).sort((a,b) => b.total - a.total);
    const top5 = users.slice(0, 5);
    const maxTotal = top5.length ? top5[0].total : 1;
    const forumUrl = fa.forumId && OU_ID ? `/d2l/le/${OU_ID}/discussions/forums/${fa.forumId}/View` : null;
    const hdrName = forumUrl
      ? `<a href="${forumUrl}" target="_blank" rel="noopener">${fName}</a>`
      : fName;

    const rows = top5.map((u, i) => {
      const rankClass = i===0?'r1':i===1?'r2':i===2?'r3':'rn';
      const barPct = Math.round((u.total / maxTotal) * 100);
      const barColor = i===0?'#1B8C5A':i<3?'#3CB4E5':'var(--lg)';
      const nameHtml = u.latestUrl
        ? `<a href="${u.latestUrl}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${u.name}</a>`
        : u.name;
      return `<div class="sb-row">
        <div class="sb-rank ${rankClass}">${i+1}</div>
        <div class="sb-name">${nameHtml}</div>
        <div class="sb-bar-wrap"><div class="sb-bar" style="width:${barPct}%;background:${barColor}"></div></div>
        <div class="sb-total">${u.total}</div>
      </div>`;
    }).join('');

    return `<div class="sb-forum">
      <div class="sb-forum-hdr">${hdrName}<span class="sb-count">${users.length} participants</span></div>
      ${rows || '<div class="sb-row" style="color:var(--lg)">No posts yet</div>'}
    </div>`;
  }).join('');
}

function renderInteractionGrid(members, filtered) {
  const list = filtered || members;
  const grid = document.getElementById('itGrid');
  if (!grid) return;
  const tierLabel = {high:'High',mid:'Moderate',low:'Low',none:'None'};
  const tierIcon = {high:'▲',mid:'●',low:'▼',none:'✗'};
  grid.innerHTML = list.map(m => {
    const nameHtml = m.latestPostUrl
      ? `<a href="${m.latestPostUrl}" target="_blank" rel="noopener" class="it-name" style="text-decoration:none;color:var(--db)">${m.name}</a>`
      : `<div class="it-name">${m.name}</div>`;
    const detailText = m.total > 0
      ? `${m.total} total · ${(m.detail?.replies||0)} sent · ${(m.detail?.received||0)} received`
      : 'No discussion interaction yet';
    return `
    <div class="it-card tier-${m.tier}">
      <div class="it-av">${ini(m.name)}</div>
      <div>
        ${nameHtml}
        <div class="it-detail">${detailText}</div>
      </div>
      <div class="it-status s-${m.tier}">${tierIcon[m.tier]} ${tierLabel[m.tier]}</div>
    </div>`;
  }).join('');
  const cnt = document.getElementById('itCount');
  if (cnt) cnt.textContent = String(list.length);
}

function filterInteractions(members) {
  const q = (document.getElementById('itSearch').value||'').toLowerCase();
  const f = document.getElementById('itFilter').value;
  let list = members;
  if (q) list = list.filter(m => m.name.toLowerCase().includes(q));
  if (f !== 'all') list = list.filter(m => m.tier === f);
  renderInteractionGrid(members, list);
}

function buildForumMatrix(classList, forumStudentReplies, currentUserId, forumOrder, forumActivity, forumReplyMeta) {
  const students = classList
    .filter(s => String(s.Identifier) !== String(currentUserId))
    .map(s => ({
      id: String(s.Identifier),
      name: `${s.LastName||''}, ${s.FirstName||''}`.trim(),
      firstName: s.FirstName,
      lastName: s.LastName
    }))
    .sort((a, b) => {
      const lastCmp = (a.lastName||'').localeCompare(b.lastName||'');
      return lastCmp !== 0 ? lastCmp : (a.firstName||'').localeCompare(b.firstName||'');
    });

  const forums = (forumOrder && forumOrder.length) ? forumOrder : Object.keys(forumStudentReplies || {});

  const matrix = {
    students,
    forums,
    data: {},
    studentActivity: {},
    replyMeta: forumReplyMeta || {}
  };

  forums.forEach(forum => {
    matrix.data[forum] = forumStudentReplies[forum] || {};
    const users = (forumActivity && forumActivity[forum] && forumActivity[forum].users) || {};
    matrix.studentActivity[forum] = {};
    Object.keys(users).forEach(sid => {
      matrix.studentActivity[forum][sid] = {
        total: users[sid].total || 0,
        url: users[sid].latestUrl || null
      };
    });
  });

  return matrix;
}

function renderForumMatrix(matrix) {
  const matrixEl = document.getElementById('matrixTable');
  if (!matrixEl) return;

  const { students, forums, data, studentActivity, replyMeta } = matrix;

  const facultyTotals = {};
  const studentTotals = {};
  students.forEach(student => {
    let fac = 0;
    let stu = 0;
    forums.forEach(forum => {
      fac += (data[forum]?.[student.id] || 0);
      stu += (studentActivity?.[forum]?.[student.id]?.total || 0);
    });
    facultyTotals[student.id] = fac;
    studentTotals[student.id] = stu;
  });

  function statusDot(has, kind) {
    if (has) {
      return `<span class="fm-icon fm-go" title="${kind === 'fac' ? 'You have replied to this student' : 'Student has posted in these forums'}">🟢</span>`;
    }
    return `<span class="fm-icon fm-stop" title="${kind === 'fac' ? 'No instructor reply yet' : 'Student has not posted in these forums'}">🔴</span>`;
  }

  let html = '<div class="fm-wrap"><table class="fm-table"><thead><tr>'
    + '<th class="fm-th-icon fm-th-fac" title="Faculty reply status">Fac</th>'
    + '<th class="fm-th-icon fm-th-stu" title="Student post status">Stu</th>'
    + '<th class="fm-th-name">Student</th>';

  forums.forEach(f => {
    const abbr = abbreviateForumName(f);
    html += `<th title="${String(f).replace(/"/g, '&quot;')}">${abbr}</th>`;
  });
  html += '<th>Total</th></tr></thead><tbody>';

  students.forEach(student => {
    const facTotal = facultyTotals[student.id];
    const stuTotal = studentTotals[student.id];
    html += `<tr>`
      + `<td class="fm-cell-icon fm-fac">${statusDot(facTotal > 0, 'fac')}</td>`
      + `<td class="fm-cell-icon fm-stu">${statusDot(stuTotal > 0, 'stu')}</td>`
      + `<td class="fm-cell-name">${student.name}</td>`;
    forums.forEach(forum => {
      const facCount = data[forum]?.[student.id] || 0;
      const stuCount = studentActivity?.[forum]?.[student.id]?.total || 0;
      const facUrl = replyMeta?.[forum]?.[student.id]?.url || null;
      const stuUrl = studentActivity?.[forum]?.[student.id]?.url || null;
      if (!facCount && !stuCount) {
        html += `<td></td>`;
        return;
      }
      const facHtml = facCount
        ? (facUrl
            ? `<a class="fm-fac-n" href="${facUrl}" target="_blank" rel="noopener" title="Open your reply in Brightspace">${facCount}</a>`
            : `<span class="fm-fac-n" title="Instructor replies">${facCount}</span>`)
        : '';
      const stuHtml = stuCount
        ? (stuUrl
            ? `<a class="fm-stu-n" href="${stuUrl}" target="_blank" rel="noopener" title="Open student activity in Brightspace">${stuCount}</a>`
            : `<span class="fm-stu-n" title="Student posts + replies">${stuCount}</span>`)
        : '';
      html += `<td class="fm-cell-num fm-cell-dual">${facHtml}${facHtml && stuHtml ? ' · ' : ''}${stuHtml}</td>`;
    });
    html += `<td class="fm-cell-num fm-cell-dual"><span class="fm-fac-n" title="Instructor replies">${facTotal}</span>`
      + ` · <span class="fm-stu-n" title="Student posts + replies">${stuTotal}</span></td></tr>`;
  });

  html += '<tr class="fm-pct-row"><td></td><td></td><td>% Faculty replied</td>';
  forums.forEach(forum => {
    const forumData = data[forum] || {};
    const interactedCount = students.filter(s => (forumData[s.id] || 0) > 0).length;
    const pct = students.length > 0 ? Math.round(interactedCount / students.length * 100) : 0;
    let pctClass = 'fm-pct-mid';
    if (pct === 100) pctClass = 'fm-pct-100';
    else if (pct === 0) pctClass = 'fm-pct-0';
    html += `<td class="fm-cell-pct"><span class="fm-pct ${pctClass}">${pct}%</span></td>`;
  });

  const overallInteracted = Object.values(facultyTotals).filter(v => v > 0).length;
  const overallPct = students.length > 0 ? Math.round(overallInteracted / students.length * 100) : 0;
  let overallPctClass = 'fm-pct-mid';
  if (overallPct === 100) overallPctClass = 'fm-pct-100';
  else if (overallPct === 0) overallPctClass = 'fm-pct-0';
  html += `<td class="fm-cell-pct"><span class="fm-pct ${overallPctClass}">${overallPct}%</span></td></tr>`;

  html += '</tbody></table></div>';
  matrixEl.innerHTML = html;
  // Stash for XLSX export (structured Fac/Stu dual counts)
  window._forumMatrixData = matrix;
}

/* ═══════════════════════════════════════════════════════════════
   DISCUSSION INTERACTION CALENDAR
   ═══════════════════════════════════════════════════════════════ */
function getDiscussionCalendarEvents() {
  const showInstr = document.getElementById('dcShowInstr')?.checked !== false;
  const showPeer = document.getElementById('dcShowPeer')?.checked !== false;
  return (window._discussionEvents || []).filter(e => {
    if (e.type === 'instructor-reply') return showInstr;
    if (e.type === 'peer-reply') return showPeer;
    return false;
  });
}

function renderDiscussionCalendarDayDetail(dateStr) {
  const detail = document.getElementById('discCalendarDayDetail');
  if (!detail) return;
  const events = getDiscussionCalendarEvents()
    .filter(e => e.date === dateStr)
    .sort((a, b) => (a.type === b.type ? 0 : a.type === 'instructor-reply' ? -1 : 1));

  if (!events.length) {
    detail.style.display = 'none';
    detail.innerHTML = '';
    return;
  }

  const label = new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
  });
  detail.style.display = 'block';
  detail.innerHTML = `<h4>${label} — ${events.length} interaction${events.length === 1 ? '' : 's'}</h4>` +
    events.map(e => {
      const badge = e.type === 'instructor-reply'
        ? '<span class="dc-badge instr">Instructor</span>'
        : '<span class="dc-badge peer">Peer</span>';
      const who = e.type === 'instructor-reply'
        ? `You replied to <strong>${esc(e.targetName || 'student')}</strong>`
        : `<strong>${esc(e.author || 'Student')}</strong> replied to <strong>${esc(e.targetName || 'classmate')}</strong>`;
      const link = e.url
        ? `<a href="${e.url}" target="_blank" rel="noopener">${esc(e.subject || 'Open topic')}</a>`
        : esc(e.subject || 'Discussion reply');
      return `<div class="dc-item">${badge}<div>${who}<div class="dc-meta">${esc(e.forumFull || e.forum || '')} · ${link}</div></div></div>`;
    }).join('');
}

function renderDiscussionCalendar() {
  const gridEl = document.getElementById('discCalendarGrid');
  const labelEl = document.getElementById('dcPeriodLabel');
  if (!gridEl) return;

  if (!window._discCalMonth) window._discCalMonth = new Date();
  const monthDate = new Date(window._discCalMonth.getFullYear(), window._discCalMonth.getMonth(), 1);
  if (labelEl) {
    labelEl.textContent = monthDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  }

  const events = getDiscussionCalendarEvents();
  const byDate = {};
  events.forEach(e => {
    if (!byDate[e.date]) byDate[e.date] = { instr: 0, peer: 0 };
    if (e.type === 'instructor-reply') byDate[e.date].instr++;
    else if (e.type === 'peer-reply') byDate[e.date].peer++;
  });

  const year = monthDate.getFullYear();
  const month = monthDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const startDate = new Date(firstDay);
  startDate.setDate(startDate.getDate() - firstDay.getDay());

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  let html = '<div class="cal-grid">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
    html += `<div class="cal-dow">${d}</div>`;
  });

  let current = new Date(startDate);
  for (let i = 0; i < 42; i++) {
    const dateStr = current.toISOString().split('T')[0];
    const other = current.getMonth() !== month ? ' other' : '';
    const isToday = current.getTime() === today.getTime() ? ' today' : '';
    const counts = byDate[dateStr];
    const has = counts && (counts.instr || counts.peer);
    const classes = `cal-day${other}${isToday}${has ? ' has-dc' : ''}`;
    let pills = '';
    if (counts?.instr) pills += `<span class="cal-pill dc-instr">${counts.instr} instructor</span>`;
    if (counts?.peer) pills += `<span class="cal-pill dc-peer">${counts.peer} peer</span>`;
    html += `<div class="${classes}" data-dc-date="${dateStr}">`
      + `<div class="day-num">${current.getDate()}</div>`
      + `<div class="pills">${pills}</div></div>`;
    current.setDate(current.getDate() + 1);
  }
  html += '</div>';
  gridEl.innerHTML = html;

  gridEl.querySelectorAll('.cal-day.has-dc').forEach(cell => {
    cell.addEventListener('click', () => {
      renderDiscussionCalendarDayDetail(cell.getAttribute('data-dc-date'));
    });
  });
}

function wireDiscussionCalendarControls() {
  const prev = document.getElementById('dcPrev');
  const next = document.getElementById('dcNext');
  const showInstr = document.getElementById('dcShowInstr');
  const showPeer = document.getElementById('dcShowPeer');
  if (prev && !prev._dcBound) {
    prev._dcBound = true;
    prev.addEventListener('click', () => {
      if (!window._discCalMonth) window._discCalMonth = new Date();
      window._discCalMonth.setMonth(window._discCalMonth.getMonth() - 1);
      renderDiscussionCalendar();
      const detail = document.getElementById('discCalendarDayDetail');
      if (detail) { detail.style.display = 'none'; detail.innerHTML = ''; }
    });
  }
  if (next && !next._dcBound) {
    next._dcBound = true;
    next.addEventListener('click', () => {
      if (!window._discCalMonth) window._discCalMonth = new Date();
      window._discCalMonth.setMonth(window._discCalMonth.getMonth() + 1);
      renderDiscussionCalendar();
      const detail = document.getElementById('discCalendarDayDetail');
      if (detail) { detail.style.display = 'none'; detail.innerHTML = ''; }
    });
  }
  const onFilter = () => {
    renderDiscussionCalendar();
    const detail = document.getElementById('discCalendarDayDetail');
    if (detail) { detail.style.display = 'none'; detail.innerHTML = ''; }
  };
  if (showInstr && !showInstr._dcBound) {
    showInstr._dcBound = true;
    showInstr.addEventListener('change', onFilter);
  }
  if (showPeer && !showPeer._dcBound) {
    showPeer._dcBound = true;
    showPeer.addEventListener('change', onFilter);
  }
}

/* ═══════════════════════════════════════════════════════════════
   FORUM HELPERS — shared by analyzeInteractions & analyzePostingDays
   ═══════════════════════════════════════════════════════════════ */
function isStudentLounge(name) {
  return /student\s*lounge/i.test(name || '');
}
function isOneOnOneForum(name) {
  const n = (name || '').toLowerCase();
  if (/1[\s-]*on[\s-]*1/i.test(n)) return true;
  if (/one[\s-]*on[\s-]*one/i.test(n)) return true;
  if (/private\s*(discussion|forum|board|conversation)/i.test(n)) return true;
  if (/student\s*private\s*conversation/i.test(n)) return true;
  if (/individual\s*(discussion|forum|board)/i.test(n)) return true;
  return false;
}
function isExcludedForum(name) {
  return isStudentLounge(name) || isOneOnOneForum(name);
}

/* ═══════════════════════════════════════════════════════════════
   INTERACTION ANALYSIS
   ═══════════════════════════════════════════════════════════════ */
async function analyzeInteractions(userId, classList) {
  console.log('[Interactions] Starting analyzeInteractions for user', userId, '| classList size:', classList?.length);
  const interactedIds = new Set();
  const interactionDetails = {};
  const forumActivity = {};
  const forumStudentReplies = {};
  const forumReplyMeta = {};
  const forumOrder = [];
  const discoveredUsers = {};
  const discussionEvents = [];

  let gradedForumNames = null;
  try {
    const gi = await gradeItems();
    const items = Array.isArray(gi) ? gi : (gi?.Objects || gi?.Items || []);
    gradedForumNames = new Set(items.map(g => (g.Name || '').trim().toLowerCase()));
    console.log('[Interactions] Grade items loaded:', items.length);
  } catch(e) { console.warn('[Interactions] Grade items fetch failed, showing all forums:', e); }

  const oneOnOneData = {};

  try {
    const allForums = await forums();
    if (!Array.isArray(allForums)) {
      console.warn('[1-on-1] forums() did not return array');
      return { interactedIds, interactionDetails, forumActivity, discoveredUsers, forumStudentReplies, forumReplyMeta, forumOrder, oneOnOneData, discussionEvents };
    }

    console.log('[1-on-1] Scanning', allForums.length, 'forums. Names:', allForums.map(f => f.Name || '?').join(' | '));

    for (const forum of allForums) {
      const fName = (forum.Name || 'Forum').substring(0, 20);

      if (isStudentLounge(forum.Name)) { console.log('[1-on-1] Skipping student lounge:', forum.Name); continue; }

      if (isOneOnOneForum(forum.Name)) {
        console.log('[1-on-1] Found 1-on-1 forum:', forum.Name, '(ForumId:', forum.ForumId, ')');
        let ooTopics = [];
        try { ooTopics = await forumTopics(forum.ForumId); } catch(e) { console.warn('[1-on-1] Failed to fetch topics for forum', forum.ForumId, ':', e.message || e); continue; }
        if (!Array.isArray(ooTopics)) { console.warn('[1-on-1] Topics not an array for forum', forum.ForumId, typeof ooTopics); continue; }
        console.log('[1-on-1] Forum "' + forum.Name + '" has', ooTopics.length, 'topics');

        for (const topic of ooTopics) {
          let ooPosts = [];
          try { ooPosts = await topicPosts(forum.ForumId, topic.TopicId); } catch(e) { console.warn('[1-on-1] Failed to fetch posts for topic', topic.TopicId, ':', e.message || e); continue; }
          if (!Array.isArray(ooPosts)) { console.warn('[1-on-1] Posts not an array for topic', topic.TopicId, typeof ooPosts); continue; }
          console.log('[1-on-1] Topic "' + (topic.Name || topic.TopicId) + '": ' + ooPosts.length + ' posts');

          // Build a post index for reply-chain analysis
          const postById = {};
          ooPosts.forEach(p => { postById[String(p.PostId || p.Id || '')] = p; });

          // Phase 1: Build per-student data — collect post counts and dates
          // Also track each student's earliest post and whether it was a reply to the instructor
          const studentFirstPost = {}; // studentId → { date, parentAuthor }
          const topicUrl = `/d2l/le/${OU_ID}/discussions/topics/${topic.TopicId}/View`;

          for (const post of ooPosts) {
            const authorId = String(post.PostingUserId || post.UserId || '');
            const isMe = String(userId) === authorId;
            const postDate = post.DatePosted || post.LastEditedDate;
            const authorName = post.PostingUserDisplayName || post.UserDisplayName || 'Unknown';

            if (!isMe && authorId) {
              // Student post — create entry if needed, count posts, track dates
              if (!oneOnOneData[authorId]) {
                oneOnOneData[authorId] = { name: authorName, forumName: fName, forumId: forum.ForumId, postsFromStudent: 0, postsFromInstructor: 0, lastStudentDate: null, lastInstructorDate: null, lastStudentMessage: '', lastInstructorMessage: '', topicUrl, initiatedBy: 'unknown' };
              }
              oneOnOneData[authorId].postsFromStudent++;
              if (postDate && (!oneOnOneData[authorId].lastStudentDate || new Date(postDate) > new Date(oneOnOneData[authorId].lastStudentDate))) {
                oneOnOneData[authorId].lastStudentDate = postDate;
                // Capture message body for closure analysis — try a few field
                // shapes Brightspace returns across LE versions.
                oneOnOneData[authorId].lastStudentMessage =
                  (post.Message && (post.Message.Text || post.Message.Html)) ||
                  post.MessageText || post.Subject || '';
                // Capture the post ID so the "Open" link can deep-link to
                // this specific message via Brightspace's postId anchor.
                oneOnOneData[authorId].lastStudentPostId = post.PostId || post.Id || null;
              }

              // Track the student's earliest post for initiator analysis
              const dt = postDate ? new Date(postDate).getTime() : Infinity;
              if (!studentFirstPost[authorId] || dt < studentFirstPost[authorId].date) {
                // Check if this post is a reply to an instructor post
                const parentId = String(post.ParentPostId || '');
                const parentPost = parentId ? postById[parentId] : null;
                const parentAuthorId = parentPost ? String(parentPost.PostingUserId || parentPost.UserId || '') : '';
                studentFirstPost[authorId] = {
                  date: dt,
                  isReplyToInstructor: parentAuthorId === String(userId),
                  isTopLevel: !parentId || parentId === '0' || parentId === 'null' || parentId === 'undefined' || !parentPost
                };
              }
            }

            if (isMe) {
              // Instructor post — associate with student(s) in the reply chain
              // First: ensure any students in this topic have entries
              for (const otherPost of ooPosts) {
                const otherId = String(otherPost.PostingUserId || otherPost.UserId || '');
                if (otherId && otherId !== String(userId)) {
                  const otherName = otherPost.PostingUserDisplayName || otherPost.UserDisplayName || 'Unknown';
                  if (!oneOnOneData[otherId]) {
                    oneOnOneData[otherId] = { name: otherName, forumName: fName, forumId: forum.ForumId, postsFromStudent: 0, postsFromInstructor: 0, lastStudentDate: null, lastInstructorDate: null, lastStudentMessage: '', lastInstructorMessage: '', topicUrl, initiatedBy: 'unknown' };
                  }
                  break;
                }
              }

              // Pull the body text once so both attribution paths can store it.
              const instrMsgText = (post.Message && (post.Message.Text || post.Message.Html)) ||
                                    post.MessageText || post.Subject || '';

              // Check if this instructor post is a reply to a specific student
              const parentId = String(post.ParentPostId || '');
              const parentPost = parentId ? postById[parentId] : null;
              const parentAuthorId = parentPost ? String(parentPost.PostingUserId || parentPost.UserId || '') : '';

              if (parentAuthorId && parentAuthorId !== String(userId) && oneOnOneData[parentAuthorId]) {
                // Direct reply to a specific student
                oneOnOneData[parentAuthorId].postsFromInstructor++;
                if (postDate && (!oneOnOneData[parentAuthorId].lastInstructorDate || new Date(postDate) > new Date(oneOnOneData[parentAuthorId].lastInstructorDate))) {
                  oneOnOneData[parentAuthorId].lastInstructorDate = postDate;
                  oneOnOneData[parentAuthorId].lastInstructorMessage = instrMsgText;
                }
              } else {
                // Top-level instructor post or reply to self — attribute to any student in the thread
                for (const otherId of Object.keys(oneOnOneData)) {
                  if (oneOnOneData[otherId].forumId === forum.ForumId) {
                    const studentInTopic = ooPosts.some(p => String(p.PostingUserId || p.UserId || '') === otherId);
                    if (studentInTopic) {
                      oneOnOneData[otherId].postsFromInstructor++;
                      if (postDate && (!oneOnOneData[otherId].lastInstructorDate || new Date(postDate) > new Date(oneOnOneData[otherId].lastInstructorDate))) {
                        oneOnOneData[otherId].lastInstructorDate = postDate;
                        oneOnOneData[otherId].lastInstructorMessage = instrMsgText;
                      }
                      break;
                    }
                  }
                }
              }
            }
          }

          // Phase 1.5: Collect "unanswered" student posts per student in
          // this topic. A 1-on-1 topic can hold multiple separate
          // conversations that aren't threaded together — a student
          // might ask a question, the instructor reply, then the
          // student start a new conversation. We can't trust "latest
          // student post" alone to detect a needed reply because the
          // latest post might be a closure on an old conversation while
          // an earlier (still-unanswered) message is the one that
          // matters.
          //
          // Definition of "unanswered" here: any student post in this
          // topic whose date is AFTER the latest instructor post in the
          // same topic. The closure analyzer walks this list
          // newest-first to find the latest non-closure message and
          // uses THAT as the row's "needs reply" target.
          const topicInstructorDates = ooPosts
            .filter(p => String(p.PostingUserId || p.UserId || '') === String(userId))
            .map(p => new Date(p.DatePosted || p.LastEditedDate || 0).getTime())
            .filter(t => t > 0);
          const topicLastInstrTs = topicInstructorDates.length ? Math.max(...topicInstructorDates) : 0;

          ooPosts.forEach(p => {
            const aId = String(p.PostingUserId || p.UserId || '');
            if (!aId || aId === String(userId)) return;       // skip instructor posts
            const pDate = p.DatePosted || p.LastEditedDate;
            if (!pDate) return;
            const pTs = new Date(pDate).getTime();
            if (!Number.isFinite(pTs)) return;
            if (pTs <= topicLastInstrTs) return;              // already answered by a later instructor post
            if (!oneOnOneData[aId]) return;                   // shouldn't happen but be defensive
            if (!oneOnOneData[aId].unansweredStudentPosts) {
              oneOnOneData[aId].unansweredStudentPosts = [];
            }
            oneOnOneData[aId].unansweredStudentPosts.push({
              date: pDate,
              message: (p.Message && (p.Message.Text || p.Message.Html)) || p.MessageText || p.Subject || '',
              postId: p.PostId || p.Id || null
            });
          });

          // Phase 1.6: Compute Instructor Avg Time to Response data
          // per student. The KPI math the user wants:
          //   • Student-initiated thread:
          //     gap = (first instr response date) - (first student post date)
          //   • Instructor-initiated thread:
          //     gap = (instr follow-up date) - (student response date),
          //     EXCEPT when the student response is a closure ("thanks",
          //     "ok", "I have reviewed", etc.) — those threads
          //     contribute no gap.
          // Both gaps represent "how long the instructor took to
          // respond once it was their turn." We compute the dates here
          // and let renderOOKpi pick the right pair based on initiatedBy.
          const sortedTopicPosts = ooPosts
            .map(p => ({ raw: p, t: new Date(p.DatePosted || p.LastEditedDate || 0).getTime(), aId: String(p.PostingUserId || p.UserId || '') }))
            .filter(x => Number.isFinite(x.t) && x.t > 0)
            .sort((a, b) => a.t - b.t);

          const topicFirstInstrPost = sortedTopicPosts.find(x => x.aId === String(userId));
          const studentsHereSeen = new Set();
          sortedTopicPosts.forEach(x => {
            if (x.aId && x.aId !== String(userId)) studentsHereSeen.add(x.aId);
          });

          studentsHereSeen.forEach(aId => {
            if (!oneOnOneData[aId]) return;
            // First topic wins — if a student somehow appears in
            // multiple topics, use the earliest computation.
            if (oneOnOneData[aId].responseGapData) return;

            const myPosts = sortedTopicPosts.filter(x => x.aId === aId);
            if (!myPosts.length) return;
            const firstStudent = myPosts[0];

            // First instructor post AFTER the student's first post
            // (used for student-initiated threads).
            let firstInstrAfterStudent = null;
            for (const x of sortedTopicPosts) {
              if (x.aId === String(userId) && x.t > firstStudent.t) {
                firstInstrAfterStudent = x;
                break;
              }
            }

            // Instructor-initiated case: instructor posted before the
            // student. Find student's first post after that (their
            // response) and then instructor's next post (the follow-up).
            let firstStudentRespAfterInstr = null;
            let firstInstrFollowupAfterResp = null;
            if (topicFirstInstrPost && topicFirstInstrPost.t < firstStudent.t) {
              // Student's first post IS the response to instructor's
              // outreach in 1-on-1 forums (each student gets a unique
              // topic so the first student post is by definition the
              // response).
              firstStudentRespAfterInstr = firstStudent;
              for (const x of sortedTopicPosts) {
                if (x.aId === String(userId) && x.t > firstStudentRespAfterInstr.t) {
                  firstInstrFollowupAfterResp = x;
                  break;
                }
              }
            }

            const msgOf = (post) => (post && post.raw && (
              (post.raw.Message && (post.raw.Message.Text || post.raw.Message.Html)) ||
              post.raw.MessageText || post.raw.Subject || ''
            )) || '';

            oneOnOneData[aId].responseGapData = {
              firstStudentDate: new Date(firstStudent.t).toISOString(),
              firstInstrReplyAfterStudent: firstInstrAfterStudent ? new Date(firstInstrAfterStudent.t).toISOString() : null,
              firstStudentReplyAfterInstr: firstStudentRespAfterInstr ? new Date(firstStudentRespAfterInstr.t).toISOString() : null,
              firstStudentReplyAfterInstrMsg: firstStudentRespAfterInstr ? msgOf(firstStudentRespAfterInstr) : '',
              firstInstrFollowupAfterStudentReply: firstInstrFollowupAfterResp ? new Date(firstInstrFollowupAfterResp.t).toISOString() : null,
            };
          });

          // Phase 2: Determine initiator per student based on their first post
          for (const [sid, firstInfo] of Object.entries(studentFirstPost)) {
            if (!oneOnOneData[sid]) continue;
            if (firstInfo.isReplyToInstructor) {
              // Student's first post was a reply to the instructor → instructor initiated
              oneOnOneData[sid].initiatedBy = 'instructor';
            } else if (firstInfo.isTopLevel) {
              // Student's first post was a top-level message → student initiated
              oneOnOneData[sid].initiatedBy = 'student';
            } else {
              // Student replied to another student or unknown — treat as student-initiated
              oneOnOneData[sid].initiatedBy = 'student';
            }
          }

          // Students with no posts but instructor sent them a message — mark instructor-initiated
          for (const sid of Object.keys(oneOnOneData)) {
            if (oneOnOneData[sid].initiatedBy === 'unknown') {
              oneOnOneData[sid].initiatedBy = oneOnOneData[sid].postsFromInstructor > 0 ? 'instructor' : 'student';
            }
          }
        }
        // Sort unanswered post arrays newest-first across all topics
        // so the closure analyzer can walk them in priority order.
        const ooKeys = Object.keys(oneOnOneData);
        ooKeys.forEach(sid => {
          const arr = oneOnOneData[sid].unansweredStudentPosts;
          if (arr && arr.length > 1) {
            arr.sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());
          }
        });
        const studentInit = ooKeys.filter(k => oneOnOneData[k].initiatedBy === 'student').length;
        const instrInit = ooKeys.filter(k => oneOnOneData[k].initiatedBy === 'instructor').length;
        console.log('[1-on-1] After forum "' + forum.Name + '": ' + ooKeys.length + ' total entries (' + studentInit + ' student-initiated, ' + instrInit + ' instructor-initiated)');
        continue;
      }

      if (!forumActivity[fName]) forumActivity[fName] = { forumId: forum.ForumId, users: {} };

      const isGraded = !gradedForumNames || gradedForumNames.has((forum.Name || '').trim().toLowerCase());
      if (isGraded) {
        if (!forumStudentReplies[fName]) { forumStudentReplies[fName] = {}; forumOrder.push(fName); }
        if (!forumReplyMeta[fName]) forumReplyMeta[fName] = {};
      }

      let allTopics = [];
      try { allTopics = await forumTopics(forum.ForumId); } catch { continue; }
      if (!Array.isArray(allTopics)) continue;

      for (const topic of allTopics) {
        let posts = [];
        try { posts = await topicPosts(forum.ForumId, topic.TopicId); } catch { continue; }
        if (!Array.isArray(posts)) continue;

        const postMap = {};
        posts.forEach(p => {
          const id = String(p.PostId ?? p.Id ?? '');
          if (id) postMap[id] = p;
        });

        for (const post of posts) {
          const postId = String(post.PostId ?? post.Id ?? '');
          const authorId = String(post.PostingUserId || post.UserId || '');
          const isMe = String(userId) === authorId;
          const postDate = post.DatePosted || post.LastEditedDate;
          const postUrl = topicViewUrl(topic.TopicId, postId);
          const authorName = post.PostingUserDisplayName || post.UserDisplayName || 'Unknown';
          const parentId = post.ParentPostId != null && post.ParentPostId !== '' ? String(post.ParentPostId) : '';

          if (!isMe && authorId) {
            if (!discoveredUsers[authorId]) {
              discoveredUsers[authorId] = { name: authorName, latestPostUrl: postUrl };
            }
            discoveredUsers[authorId].latestPostUrl = postUrl;
          }

          if (!interactionDetails[authorId]) {
            interactionDetails[authorId] = { replies: 0, received: 0, lastDate: null, latestPostUrl: postUrl };
          }

          if (postDate) {
            if (!interactionDetails[authorId].lastDate || new Date(postDate) > new Date(interactionDetails[authorId].lastDate)) {
              interactionDetails[authorId].lastDate = postDate;
              interactionDetails[authorId].latestPostUrl = postUrl;
            }
          }

          if (parentId) {
            interactionDetails[authorId].replies = (interactionDetails[authorId].replies || 0) + 1;
            const parentPost = postMap[parentId];
            if (parentPost) {
              const parentAuthorId = String(parentPost.PostingUserId || parentPost.UserId || '');
              if (!interactionDetails[parentAuthorId]) {
                interactionDetails[parentAuthorId] = { replies: 0, received: 0, lastDate: null, latestPostUrl: postUrl };
              }
              interactionDetails[parentAuthorId].received = (interactionDetails[parentAuthorId].received || 0) + 1;

              // Calendar: instructor replies to students, and student→student replies
              const dateKey = postDateKey(postDate);
              if (dateKey) {
                const parentName = parentPost.PostingUserDisplayName || parentPost.UserDisplayName || 'Student';
                if (isMe && parentAuthorId && parentAuthorId !== String(userId)) {
                  discussionEvents.push({
                    date: dateKey,
                    type: 'instructor-reply',
                    author: authorName,
                    authorId,
                    targetId: parentAuthorId,
                    targetName: parentName,
                    forum: fName,
                    forumFull: forum.Name || fName,
                    topicId: topic.TopicId,
                    postId,
                    url: postUrl,
                    subject: (post.Subject || parentPost.Subject || topic.Name || 'Reply').substring(0, 80)
                  });
                } else if (!isMe && parentAuthorId && parentAuthorId !== authorId && parentAuthorId !== String(userId)) {
                  discussionEvents.push({
                    date: dateKey,
                    type: 'peer-reply',
                    author: authorName,
                    authorId,
                    targetId: parentAuthorId,
                    targetName: parentName,
                    forum: fName,
                    forumFull: forum.Name || fName,
                    topicId: topic.TopicId,
                    postId,
                    url: postUrl,
                    subject: (post.Subject || parentPost.Subject || topic.Name || 'Reply').substring(0, 80)
                  });
                }
              }
            }
          }

          if (isMe && parentId) {
            const parentPost = postMap[parentId];
            if (parentPost) {
              const parentAuthorId = String(parentPost.PostingUserId || parentPost.UserId || '');
              if (parentAuthorId) interactedIds.add(parentAuthorId);
            }
          } else if (!isMe) {
            for (const reply of posts) {
              const replyAuthorId = String(reply.PostingUserId || reply.UserId || '');
              const isReplyFromMe = String(userId) === replyAuthorId;
              const replyParent = reply.ParentPostId != null && reply.ParentPostId !== '' ? String(reply.ParentPostId) : '';
              if (isReplyFromMe && replyParent === postId) {
                interactedIds.add(authorId);
                if (forumStudentReplies[fName]) {
                  if (!forumStudentReplies[fName][authorId]) forumStudentReplies[fName][authorId] = 0;
                  forumStudentReplies[fName][authorId]++;
                  const replyId = String(reply.PostId ?? reply.Id ?? '');
                  forumReplyMeta[fName][authorId] = {
                    topicId: topic.TopicId,
                    postId: replyId,
                    url: topicViewUrl(topic.TopicId, replyId)
                  };
                }
              }
            }
          }

          // Exclude the instructor from the scoreboard — these rankings are
          // for spotting top student participants, and the instructor's
          // post count would always dominate. The instructor's own activity
          // is surfaced separately (Forum Matrix, 1-on-1 tab, etc.).
          if (authorId !== String(userId)) {
            if (!forumActivity[fName].users[authorId]) {
              forumActivity[fName].users[authorId] = { name: authorName, posts: 0, replies: 0, total: 0, latestUrl: null, topicId: null };
            }
            if (parentId) {
              forumActivity[fName].users[authorId].replies++;
            } else {
              forumActivity[fName].users[authorId].posts++;
            }
            forumActivity[fName].users[authorId].total++;
            forumActivity[fName].users[authorId].latestUrl = postUrl;
            forumActivity[fName].users[authorId].topicId = topic.TopicId;
          }
        }
      }
    }
  } catch(e) {
    console.warn('Interaction analysis failed:', e);
  }

  return { interactedIds, interactionDetails, forumActivity, discoveredUsers, forumStudentReplies, forumReplyMeta, forumOrder, oneOnOneData, discussionEvents };
}

/* ═══════════════════════════════════════════════════════════════
   LIVE DATA ASSEMBLY
   ═══════════════════════════════════════════════════════════════ */
async function assembleLiveData(user, isInst, cl) {
  const d = {};
  const uid = user.Identifier || user.UserId;

  d.actLabels = [...Array(14)].map((_,i) => {
    const dt = new Date(); dt.setDate(dt.getDate()-13+i);
    return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  });
  d.actData = d.actLabels.map(() => Math.floor(Math.random()*40)+5);

  d.totalStudents = cl.length;

  let allForums = [];
  try { allForums = await forums(); if (!Array.isArray(allForums)) allForums = []; } catch{}

  d.discLabels = []; d.discPosts = []; d.discReplies = [];
  d.discForumPosts = []; d.discMyReplies = []; d.discResponseRate = [];
  d.totalPosts = 0; d.totalReplies = 0;
  d.myPosts = 0; d.myReplies = 0;
  d.recentPosts = [];

  for (const forum of allForums) {
    d.discLabels.push((forum.Name||'Forum').substring(0,12));
    let fTopics = [];
    try { fTopics = await forumTopics(forum.ForumId); if (!Array.isArray(fTopics)) fTopics = []; } catch{ continue; }

    let fp = 0, fr = 0, fMyReplies = 0;
    for (const t of fTopics) {
      let posts = [];
      try { posts = await topicPosts(forum.ForumId, t.TopicId); if (!Array.isArray(posts)) posts = []; } catch{ continue; }

      for (const p of posts) {
        const authorId = String(p.PostingUserId || p.UserId || '');
        const isMe = String(uid) === authorId;
        const authorName = p.PostingUserDisplayName || p.UserDisplayName || 'Unknown';

        if (p.ParentPostId) { fr++; d.totalReplies++; if (isMe) { d.myReplies++; fMyReplies++; } }
        else { fp++; d.totalPosts++; if (isMe) d.myPosts++; }

        d.recentPosts.push({
          author: authorName,
          subject: (p.Subject || p.Message?.Text?.substring(0,60) || t.Name || 'Post').substring(0,50),
          date: p.DatePosted || p.LastEditedDate,
          forum: (forum.Name||'').substring(0,20),
          forumId: forum.ForumId,
          topicId: t.TopicId,
          postId: p.PostId || p.Id || null,
          isReply: !!p.ParentPostId
        });
      }
    }
    d.discPosts.push(fp);
    d.discReplies.push(fr);
    d.discForumPosts.push(fp);
    d.discMyReplies.push(fMyReplies);
    d.discResponseRate.push(fp > 0 ? Math.round(fMyReplies / fp * 100) : 0);
  }

  d.recentPosts.sort((a,b) => new Date(b.date||0) - new Date(a.date||0));

  return d;
}

/* ═══════════════════════════════════════════════════════════════
   LAZY-LOADED: STATISTICS DATA

async function loadStatisticsData(data, classMembers) {
  // ── Grades Panel ─────────────────────────────────────────────
  const gradesPanel = document.getElementById('p-grades');
  if (gradesPanel) {
    gradesPanel.innerHTML = '<div class="cd"><h3>Grades</h3><div class="ldg"><div class="sp"></div><p>Fetching grade data from Brightspace…</p></div></div>';
    (async () => {
      try {
        const items = await gradeItems();
        let rawList = Array.isArray(items) ? items : (items?.Objects || items?.Items || []);

        // Flatten hierarchical grade categories into individual items
        function flattenGI(arr) {
          const result = [];
          if (!Array.isArray(arr)) return result;
          for (const item of arr) {
            if (item.GradeObjectTypeName === 'Category' || (Array.isArray(item.Objects) && item.Objects.length)) {
              result.push(...flattenGI(item.Objects || []));
            }
            if (item.GradeObjectTypeName === 'Numeric' || item.GradeObjectTypeName === 'PassFail' ||
                item.GradeObjectTypeName === 'SelectBox' || item.GradeObjectTypeName === 'Text' ||
                (item.MaxPoints !== undefined && item.Name && !Array.isArray(item.Objects))) {
              result.push(item);
            }
          }
          return result;
        }
        const gList = flattenGI(rawList);
        // Also skip system calculated/adjusted items
        const filteredList = gList.filter(g => {
          if (g.GradeObjectTypeName === 'Calculated' || g.GradeObjectTypeName === 'Formula') return false;
          if (/final\s*(calculated|adjusted)\s*grade/i.test(g.Name)) return false;
          return true;
        });

        // Preserve original API order as _apiIndex (Brightspace returns items in gradebook order)
        filteredList.forEach((g, i) => { g._apiIndex = i; });

        // Sort: due date first, then week number from name, then original API order as tiebreaker
        function extractWeekNum(name) {
          const m = (name || '').match(/week\s*(\d+)/i);
          return m ? parseInt(m[1], 10) : 0; // 0 = no week number (sorted before Week 2+)
        }
        filteredList.sort((a, b) => {
          const da = a.DueDate || a.EndDate || '';
          const db = b.DueDate || b.EndDate || '';
          // Both have dates — sort chronologically
          if (da && db) return new Date(da).getTime() - new Date(db).getTime();
          // One has a date and the other doesn't — dated item first
          if (da && !db) return -1;
          if (!da && db) return 1;
          // Neither has a date — sort by week number
          const wa = extractWeekNum(a.Name);
          const wb = extractWeekNum(b.Name);
          if (wa !== wb) return wa - wb;
          // Same week or both no-week — preserve original Brightspace gradebook order
          return (a._apiIndex || 0) - (b._apiIndex || 0);
        });

        console.log('[Grades] Raw items:', rawList.length, '| Flattened:', gList.length, '| Filtered:', filteredList.length);
        if (filteredList.length) console.log('[Grades] Column order (by due date):', filteredList.map(g => g.Name + ' (' + (g.DueDate || 'no date') + ')').join(', '));
        if (!filteredList.length) { gradesPanel.innerHTML = '<div class="cd"><h3>Grades</h3><p style="color:var(--lg);padding:14px 0">No grade items found in this course.</p></div>'; return; }

        // Try to fetch grade values per grade-item (instructor endpoint)

            gradeData.push({ name: gi.Name || gi.ShortName || 'Item', maxPoints: gi.MaxPoints || 100, dueDate: gi.DueDate || '', values: valArr });
            usedPerItem = true;

          } catch(e) {

          }
        }

        if (usedPerItem) {
          // Continue fetching remaining items with paged API

            try {
              const valArr = await pagedApi(`/d2l/api/le/${LE}/${OU_ID}/grades/${gi.Id || gi.GradeObjectId}/values/`);
              gradeData.push({ name: gi.Name || gi.ShortName || 'Item', maxPoints: gi.MaxPoints || 100, dueDate: gi.DueDate || '', values: valArr });
            } catch { gradeData.push({ name: gi.Name || gi.ShortName || 'Item', maxPoints: gi.MaxPoints || 100, dueDate: gi.DueDate || '', values: [] }); }
          }
        } else {
          // Fallback: fetch per student using myGrades

          const members = classMembers.length ? classMembers : [];
          const studentGradeMap = {}; // studentId → [{GradeObjectIdentifier, PointsNumerator, DisplayedGrade, ...}]
