    xml += '  <Style ss:ID="RowLabelHighest"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#1B8C5A"/></Style>\n';
    xml += '  <Style ss:ID="RowLabelMedian"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#1F5582"/></Style>\n';
    xml += '  <Style ss:ID="RowLabelAverage"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#7E60BF"/></Style>\n';
    xml += '  <Style ss:ID="RowLabelLowest"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#C8412A"/></Style>\n';
    xml += '  <Style ss:ID="RowLabelLowestNZ"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#A0522D"/></Style>\n';
    xml += '  <Style ss:ID="RowLabelVarHL"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#D27A1A"/></Style>\n';
    xml += '  <Style ss:ID="RowLabelVarHA"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#0F8FA9"/></Style>\n';
    xml += '  <Style ss:ID="RowLabelTrueVar"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#8B0000"/></Style>\n';
    xml += '  <Style ss:ID="Cell"><Font ss:FontName="Calibri" ss:Size="11"/><Alignment ss:Horizontal="Center"/></Style>\n';
    xml += '  <Style ss:ID="CellFlagged"><Font ss:FontName="Calibri" ss:Size="11"/><Alignment ss:Horizontal="Center"/><Interior ss:Color="#FDECEA" ss:Pattern="Solid"/></Style>\n';
    xml += '  <Style ss:ID="Pct"><Font ss:FontName="Calibri" ss:Size="11"/><Alignment ss:Horizontal="Center"/><NumberFormat ss:Format="0.0&quot;%&quot;"/></Style>\n';
    xml += '  <Style ss:ID="PctFlagged"><Font ss:FontName="Calibri" ss:Size="11"/><Alignment ss:Horizontal="Center"/><Interior ss:Color="#FDECEA" ss:Pattern="Solid"/><NumberFormat ss:Format="0.0&quot;%&quot;"/></Style>\n';
    xml += '</Styles>\n';

    xml += '<Worksheet ss:Name="Grade Trends">\n<Table>\n';

    // Title row
    xml += '<Row>\n  <Cell ss:StyleID="Title"><Data ss:Type="String">Grade Trends</Data></Cell>\n</Row>\n';
    xml += '<Row>\n  <Cell ss:StyleID="MetaCell"><Data ss:Type="String">Captured ' +
            escXml(data.capturedAt.toLocaleString()) + ' · ' + items.length + ' graded item' +
            (items.length === 1 ? '' : 's') + ' · ' + data.classSize + ' enrolled students' +
            '</Data></Cell>\n</Row>\n';
    xml += '<Row></Row>\n';

    // Outcome banner (single styled cell + lead paragraph + ratio note)
    if (outcome) {
      const styleId = outcome.tier === 'positive' ? 'OutcomePos'
                    : outcome.tier === 'neutral'  ? 'OutcomeNeu'
                                                  : 'OutcomeNeg';
      const headline = outcome.tier === 'positive' ? 'Healthy grade variance'
                     : outcome.tier === 'neutral'  ? 'Moderate grade variance'
                                                   : 'Low grade variance';
      const lead = outcome.tier === 'positive'
        ? 'Most of your scored items produced a meaningful spread in student grades — your assessments are differentiating performance.'
        : outcome.tier === 'neutral'
          ? 'A meaningful share of your scored items produced spread in grades, but a chunk did not. Some items may need a sharper rubric or harder ceiling.'
          : 'A majority of your scored items produced little or no spread in student grades. That often signals rubric thresholds set too low, assessments that are too easy, or grading shortcuts.';
      const pctLbl = (outcome.pct % 1 === 0 ? outcome.pct.toFixed(0) : outcome.pct.toFixed(1)) + '%';
      xml += '<Row>\n  <Cell ss:StyleID="' + styleId + '" ss:MergeAcross="' + items.length + '">' +
              '<Data ss:Type="String">' + escXml(headline + ' — ' + pctLbl + ' of scored items showed variance (' +
              outcome.variant + ' of ' + outcome.scored + ')') + '</Data></Cell>\n</Row>\n';
      xml += '<Row>\n  <Cell ss:StyleID="NoteCell" ss:MergeAcross="' + items.length + '"><Data ss:Type="String">' +
              escXml(lead) + '</Data></Cell>\n</Row>\n';
      xml += '<Row>\n  <Cell ss:StyleID="MetaCell" ss:MergeAcross="' + items.length + '"><Data ss:Type="String">' +
              escXml('Counted ' + outcome.variant + ' of ' + outcome.scored + ' scored item' +
                     (outcome.scored === 1 ? '' : 's') +
                     ' where the grade spread exceeded 1 percentage point. Items with zero scored students are excluded from both sides of the ratio.') +
              '</Data></Cell>\n</Row>\n';
      xml += '<Row></Row>\n';
    }

    // Inflation flag list (if any), with full lead paragraph
    if (flagged.length) {
      xml += '<Row>\n  <Cell ss:StyleID="InflationHead" ss:MergeAcross="' + items.length + '"><Data ss:Type="String">' +
              escXml('Possible grade inflation — ' + flagged.length + ' item' +
                     (flagged.length === 1 ? '' : 's') + ' with no grade variation') +
              '</Data></Cell>\n</Row>\n';
      xml += '<Row>\n  <Cell ss:StyleID="NoteCell" ss:MergeAcross="' + items.length + '"><Data ss:Type="String">' +
              escXml('On the items below, every graded student received essentially the same grade. ' +
                     'That can indicate a rubric that does not differentiate performance, a missing rubric, ' +
                     'an assessment that is too easy, a grading shortcut, or an assignment that should be ' +
                     'pass-fail, as completing it gets you full points. Worth a look:') +
              '</Data></Cell>\n</Row>\n';
      flagged.forEach(f => {
        const pctLbl = (f.meanPct % 1 === 0 ? f.meanPct.toFixed(0) : f.meanPct.toFixed(1));
        xml += '<Row>\n  <Cell ss:StyleID="InflationItem"><Data ss:Type="String">' +
                escXml('• ' + f.name + ' — everyone scored ' + pctLbl + '% (' + f.n + ' student' +
                       (f.n === 1 ? '' : 's') + ' graded)') +
                '</Data></Cell>\n</Row>\n';
      });
      xml += '<Row></Row>\n';
    }

    // On-screen lead paragraph above the table
    xml += '<Row>\n  <Cell ss:StyleID="SectionHead" ss:MergeAcross="' + items.length + '"><Data ss:Type="String">About this table</Data></Cell>\n</Row>\n';
    xml += '<Row>\n  <Cell ss:StyleID="NoteCell" ss:MergeAcross="' + items.length + '"><Data ss:Type="String">' +
            escXml('For each graded item (in gradebook order), the table shows the highest, median, average, ' +
                   'and lowest student grade. Median and Average display the class percentage. Highest and Lowest ' +
                   'show the actual displayed grade of the student who held that position on that item. The sparkline ' +
                   'traces the row’s percentage trend left-to-right across the term.') +
            '</Data></Cell>\n</Row>\n';
    xml += '<Row></Row>\n';

    // Header row — Statistic | each item
    xml += '<Row>\n';
    xml += '  <Cell ss:StyleID="Header"><Data ss:Type="String">Statistic</Data></Cell>\n';
    items.forEach((it, idx) => {
      const styleId = flaggedIdxSet.has(idx) ? 'FlagHeader' : 'Header';
      const nm = it.name + (flaggedIdxSet.has(idx) ? '  ⚑' : '');
      xml += '  <Cell ss:StyleID="' + styleId + '"><Data ss:Type="String">' + escXml(nm) + '</Data></Cell>\n';
    });
    xml += '</Row>\n';

    // Eight stat rows. Highest/Lowest/Lowest non-zero render the cell
    // string as-is (could be "A-" or "95%"); the other rows are numeric
    // percentages with the Pct number-format applied.
    const rowOrder = [
      { key: 'highest',      style: 'RowLabelHighest',  numeric: false },
      { key: 'median',       style: 'RowLabelMedian',   numeric: true  },
      { key: 'average',      style: 'RowLabelAverage',  numeric: true  },
      { key: 'lowest',       style: 'RowLabelLowest',   numeric: false },
      { key: 'lowestNZ',     style: 'RowLabelLowestNZ', numeric: false },
      { key: 'varHighLow',   style: 'RowLabelVarHL',    numeric: true  },
      { key: 'varHighAvg',   style: 'RowLabelVarHA',    numeric: true  },
      { key: 'trueVariance', style: 'RowLabelTrueVar',  numeric: true  },
    ];

    rowOrder.forEach(row => {
      const s = stats[row.key];
      xml += '<Row>\n';
      xml += '  <Cell ss:StyleID="' + row.style + '"><Data ss:Type="String">' + escXml(s.label) + '</Data></Cell>\n';
      s.cells.forEach((cellTxt, idx) => {
        const isFlagged = flaggedIdxSet.has(idx);
        if (cellTxt === '—' || cellTxt == null) {
          xml += '  <Cell ss:StyleID="' + (isFlagged ? 'CellFlagged' : 'Cell') + '"><Data ss:Type="String">' + escXml(cellTxt || '—') + '</Data></Cell>\n';
        } else if (row.numeric && s.pcts[idx] != null) {
          // Use the underlying pct so Excel can format the cell as a number.
          // We store as a percent value with the "0.0%" custom format applied.
          xml += '  <Cell ss:StyleID="' + (isFlagged ? 'PctFlagged' : 'Pct') + '">' +
                 '<Data ss:Type="Number">' + (s.pcts[idx] / 100) + '</Data></Cell>\n';
        } else {
          // Highest / Lowest / Lowest non-zero — keep the displayed string.
          xml += '  <Cell ss:StyleID="' + (isFlagged ? 'CellFlagged' : 'Cell') + '"><Data ss:Type="String">' + escXml(String(cellTxt)) + '</Data></Cell>\n';
        }
      });
      xml += '</Row>\n';
    });

    // Explanatory notes — same content as the on-screen footnote
    // paragraph, broken into one bullet per row so each note has a
    // tidy cell of its own when opened in Excel.
    xml += '<Row></Row>\n';
    xml += '<Row>\n  <Cell ss:StyleID="SectionHead" ss:MergeAcross="' + items.length + '"><Data ss:Type="String">Reading the table</Data></Cell>\n</Row>\n';
    const notes = [
      'Each statistic row has its sparkline directly above it on the dashboard; the sparkline x-axis aligns with the assignment columns below, so a peak in the curve sits over the same item in the data row.',
      'Highest and Lowest show the actual displayed grade of the top and bottom student on each item.',
      'Lowest non-zero ignores students who scored zero (missed submissions or true zeros) and reports the lowest grade among students who actually attempted the work.',
      'Median and Average are class-wide percentages.',
      'Variance High–Low and Variance High–Avg are calculated as (high − other) ÷ high, expressed as a percentage of the top grade. 0% means the other statistic matched the top performer; higher values mean greater spread.',
      'True variance uses Lowest non-zero in place of Lowest, so missing submissions don’t inflate the spread.',
      'Columns marked with ⚑ flag items where every graded student received the same grade. Those cells are also tinted in this spreadsheet.',
      'Note: This information is protected by FERPA. Keep confidential.',
    ];
    notes.forEach(n => {
      xml += '<Row>\n  <Cell ss:StyleID="NoteCell" ss:MergeAcross="' + items.length + '"><Data ss:Type="String">' +
              escXml('• ' + n) + '</Data></Cell>\n</Row>\n';
    });

    xml += '</Table>\n</Worksheet>\n</Workbook>';

    const blob = new Blob([xml], { type: 'application/vnd.ms-excel' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const courseName = document.querySelector('.hdr .sub')?.textContent?.trim() || 'Course';
    a.download = 'Grade_Trends_' + courseName.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 30) + '_' + new Date().toISOString().split('T')[0] + '.xls';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    console.log('[ENG] Grade Trends XLSX exported');
  } catch(e) {
    console.error('[ENG] Grade Trends export error:', e);
    alert('Excel export failed: ' + e.message);
  }
};

(function initTooltips(){
  let tip = null, timer = null;
  function show(e){
    const el = e.target.closest('[data-tip]');
    if (!el) return;
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (!tip){ tip = document.createElement('div'); tip.className = 'ccu-tip'; document.body.appendChild(tip); }
      tip.textContent = el.getAttribute('data-tip');
      tip.classList.remove('above','below','visible');
      tip.style.left = '0'; tip.style.top = '0';
      const r = el.getBoundingClientRect();
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      let left = r.left + r.width/2 - tw/2;
      left = Math.max(6, Math.min(left, window.innerWidth - tw - 6));
      if (r.top - th - 10 > 0){ tip.style.top = (r.top - th - 10) + 'px'; tip.classList.add('above'); }
      else { tip.style.top = (r.bottom + 10) + 'px'; tip.classList.add('below'); }
      tip.style.left = left + 'px';
      tip.classList.add('visible');
    }, 220);
  }
  function hide(){ clearTimeout(timer); if (tip) tip.classList.remove('visible'); }
  document.addEventListener('mouseover', show);
  document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) hide(); });
  document.addEventListener('scroll', hide, true);
})();
})();
</script>
</body>
