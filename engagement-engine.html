function generateCalendarSampleData() {
  const events = [];
  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonthNum = now.getMonth();
  const nextMonthNum = (currentMonthNum + 1) % 12;
  const nextYear = currentMonthNum === 11 ? currentYear + 1 : currentYear;

  const announcementTitles = [
    'Course Welcome & Syllabus Review','Module 1 Materials Released',
    'Midterm Exam Date Confirmation','Assignment Rubric Update',
    'Guest Speaker Session Scheduled','Late Submission Policy Reminder',
    'Final Project Guidelines Posted','Office Hours Availability'
  ];
  const assignmentTitles = [
    'Reading Assignment: Chapter 1-2','Discussion Forum Post Due',
    'Problem Set 1 Submission','Case Study Analysis',
    'Research Paper Outline','Quiz 1: Concepts & Definitions',
    'Group Project Presentation','Final Exam','Reflection Paper','Coding Assignment'
  ];
  const discussionTopics = [
    'What are your initial thoughts on this concept?',
    'How does this apply to real-world scenarios?',
    'Feedback on your peers\' approaches',
    'Clarification on assignment requirements',
    'Best practices for project management',
    'Common misconceptions addressed'
  ];
  const eventTitles = [
    'Synchronous Class Session','Office Hours','Guest Lecture','Review Session','Project Checkpoint'
  ];

  function rday(month, year) {
    return new Date(year, month, Math.floor(Math.random() * 28) + 1).toISOString().split('T')[0];
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function rmonth() { return Math.random() > 0.6 ? [nextMonthNum, nextYear] : [currentMonthNum, currentYear]; }

  const studentNames = ['Fredegar Bolger','Meriadoc Brandybuck','Everard Took','Hamfast Gamgee','Odo Proudfoot','Hugo Bracegirdle'];
  const tStr = new Date().toISOString().split('T')[0];

  // Announcements — mix of posted (past) and scheduled (future)
  for (let i = 0; i < 6; i++) {
    const [m,y] = rmonth();
    const d = rday(m,y);
    events.push({date:d,type:'announcement',title:pick(announcementTitles),url:`/d2l/le/${OU_ID}/news/1/View`,scheduled:d > tStr});
  }
  // Assignments — ensure some are explicitly future-dated (upcoming) and some past
  for (let i = 0; i < 5; i++) {
    const futureDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1 + Math.floor(Math.random() * 20));
    events.push({date:futureDate.toISOString().split('T')[0],type:'assignment',title:pick(assignmentTitles),url:`/d2l/le/${OU_ID}/grades/`});
  }
  for (let i = 0; i < 5; i++) {
    const pastDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1 - Math.floor(Math.random() * 20));
    events.push({date:pastDate.toISOString().split('T')[0],type:'assignment',title:pick(assignmentTitles),url:`/d2l/le/${OU_ID}/grades/`});
  }
  const forumNames = ['Week 1 Discussion','Week 2 Discussion','Midterm Reflection','Group Project Forum','General Q&A'];
  for (let i = 0; i < 15; i++) { const [m,y] = rmonth(); events.push({date:rday(m,y),type:'discussion',title:pick(discussionTopics),forumName:pick(forumNames),url:`/d2l/le/${OU_ID}/discussions/topics/1/View`}); }
  for (let i = 0; i < 5; i++) { const [m,y] = rmonth(); events.push({date:rday(m,y),type:'event',title:pick(eventTitles),url:'#'}); }
  // Graded items
  for (let i = 0; i < 20; i++) {
    const [m,y] = rmonth();
    events.push({date:rday(m,y),type:'graded',title:pick(assignmentTitles)+' — '+pick(studentNames),url:`/d2l/le/${OU_ID}/grades/`});
  }

  return events;
}

/* ═══════════════════════════════════════════════════════════════
   LIVE DATA ASSEMBLY — fetch from Brightspace APIs
   ═══════════════════════════════════════════════════════════════ */
async function assembleCalendarLiveData() {
  const events = [];

  try {
    // Announcements — response may be array or paged { Items: [] }
    const nowISO = new Date().toISOString();
    let news = await newsItems();
    if (news && !Array.isArray(news) && news.Items) news = news.Items;
    if (Array.isArray(news)) {
      for (const item of news) {
        const startDate = item.StartDate || item.CreatedDate;
        if (startDate) {
          const isScheduled = startDate > nowISO;
          events.push({
            date: startDate.split('T')[0],
            type: 'announcement',
            title: item.Title || item.Name || 'Announcement',
            url: `/d2l/le/${OU_ID}/news/${item.Id}/View`,
            id: item.Id,
            scheduled: isScheduled
          });
        }
        // Also track scheduled/end date if different
        if (item.EndDate && item.EndDate !== item.StartDate) {
          events.push({
            date: item.EndDate.split('T')[0],
            type: 'announcement',
            title: (item.Title || 'Announcement') + ' (ends)',
            url: `/d2l/le/${OU_ID}/news/${item.Id}/View`,
            id: item.Id + '-end'
          });
        }
      }
    }
  } catch(e) {
    console.warn('Failed to fetch announcements:', e.message);
  }

  try {
    // Assignments — try dropbox/folders first (actual assignment submissions with due dates)
    let assignmentFound = false;
    try {
      let folders = await dropboxFolders();
      if (folders && !Array.isArray(folders) && folders.Objects) folders = folders.Objects;
      if (folders && !Array.isArray(folders) && folders.Items) folders = folders.Items;
      if (Array.isArray(folders) && folders.length > 0) {
        assignmentFound = true;
        for (const item of folders) {
          const dueDate = item.DueDate || item.EndDate;
          if (dueDate) {
            events.push({
              date: dueDate.split('T')[0],
              type: 'assignment',
              title: item.Name || item.CategoryName || 'Assignment',
              url: `/d2l/le/${OU_ID}/dropbox/folders/${item.Id || item.FolderId}/submissions/`,
              id: item.Id || item.FolderId
            });
          }
        }
      }
    } catch(e) {
      console.warn('Dropbox folders failed, falling back to grade items:', e.message);
    }
    // Fallback: grade items with due dates (if dropbox returned nothing)
    if (!assignmentFound) {
      let grades = await gradeItems();
      if (grades && !Array.isArray(grades) && grades.Objects) grades = grades.Objects;
      if (grades && !Array.isArray(grades) && grades.Items) grades = grades.Items;
      if (!Array.isArray(grades)) grades = [];
      for (const item of grades) {
        const dueDate = item.DueDate || item.EndDate;
        if (dueDate) {
          events.push({
            date: dueDate.split('T')[0],
            type: 'assignment',
            title: item.Name || item.GradeObjectName || 'Assignment',
            url: `/d2l/le/${OU_ID}/grades/`,
            id: item.Id || item.GradeObjectId
          });
        }
      }
    }
  } catch(e) {
    console.warn('Failed to fetch assignments:', e.message);
  }

  try {
    // Discussion replies by instructor — track forum name + post count per day
    let allForums = await forums();
    if (!Array.isArray(allForums)) allForums = [];
    for (const forum of allForums) {
      const forumName = forum.Name || forum.Title || 'Discussion Forum';
      try {
        let fTopics = await forumTopics(forum.ForumId);
        if (!Array.isArray(fTopics)) fTopics = [];
        for (const topic of fTopics) {
          try {
            let posts = await topicPosts(forum.ForumId, topic.TopicId);
            if (!Array.isArray(posts)) posts = [];
            for (const post of posts) {
              const authorId = String(post.PostingUserId || post.UserId || '');
              if (authorId === String(USER_ID) && post.DatePosted) {
                events.push({
                  date: post.DatePosted.split('T')[0],
                  type: 'discussion',
                  title: post.Subject || topic.Name || 'Discussion Reply',
                  forumName: forumName,
                  url: `/d2l/le/${OU_ID}/discussions/topics/${topic.TopicId}/View`,
                  id: post.PostId
                });
              }
            }
          } catch(e) {
            console.warn(`Failed to fetch posts for topic ${topic.TopicId}:`, e.message);
          }
        }
      } catch(e) {
        console.warn(`Failed to fetch topics for forum ${forum.ForumId}:`, e.message);
      }
    }
  } catch(e) {
    console.warn('Failed to fetch forums:', e.message);
  }

  try {
    // Calendar events
    let calEvents;
    try {
      calEvents = await calendarEvents();
    } catch(e) {
      console.warn('Calendar/events endpoint failed, trying alternate endpoint:', e.message);
      calEvents = await getCalendarByOrg();
    }

    // Response may be array or paged
    if (calEvents && !Array.isArray(calEvents) && calEvents.Items) calEvents = calEvents.Items;
    if (Array.isArray(calEvents)) {
      for (const item of calEvents) {
        const startDate = item.StartDateTime || item.StartDate || item.EventDate;
        if (startDate) {
          events.push({
            date: startDate.split('T')[0],
            type: 'event',
            title: item.Title || item.Name || 'Event',
            url: item.Url || item.CalendarEventUrl || '#',
            id: item.CalendarEventId || item.Id
          });
        }
      }
    }
  } catch(e) {
    console.warn('Failed to fetch calendar events:', e.message);
  }

  try {
    // Grades posted — fetch each grade object's values to find graded dates
    let gItems = await gradeItems();
    if (gItems && !Array.isArray(gItems) && gItems.Objects) gItems = gItems.Objects;
    if (gItems && !Array.isArray(gItems) && gItems.Items) gItems = gItems.Items;
    if (!Array.isArray(gItems)) gItems = [];

    // Flatten nested categories — Brightspace may return categories containing sub-items
    const flatItems = [];
    function flattenGrades(items) {
      for (const g of items) {
        // Skip category/aggregate types — they don't have individual grade values
        const gType = (g.GradeType || g.GradeObjectType || '').toString();
        if (gType === 'Category' || gType === 'Calculated' || gType === 'Final Calculated Grade' || gType === 'Final Adjusted Grade') {
          // If category has sub-items, recurse
          if (Array.isArray(g.GradeObjects)) flattenGrades(g.GradeObjects);
          if (Array.isArray(g.Items)) flattenGrades(g.Items);
          continue;
        }
        flatItems.push(g);
      }
    }
    flattenGrades(gItems);

    // Include all grade items that could have values
    const gradeable = flatItems.filter(g => {
      const t = (g.GradeType || g.GradeObjectType || '').toString();
      return t === 'Numeric' || t === 'PassFail' || t === 'SelectBox' || t === 'Text'
        || g.MaxPoints != null || g.Id || g.GradeObjectId;
    });

    for (const go of gradeable) {
      try {
        const goId = go.Id || go.GradeObjectId;
        if (!goId) continue;
        let vals = await pagedApi(`/d2l/api/le/${LE}/${OU_ID}/grades/${goId}/values/`);
        if (!Array.isArray(vals)) vals = [];
        for (const v of vals) {
          // Handle nested GradeValue structure
          const gv = v.GradeValue || v;
          // Check multiple indicators that a grade has been posted
          const hasGrade = gv.PointsNumerator != null || gv.DisplayedGrade != null
            || v.GradeValue != null || gv.GradeObjectType != null;
          if (hasGrade) {
            // Use multiple possible date fields — Brightspace may use different names across versions
            const gradedDate = gv.LastModified || gv.LastModifiedDate || v.LastModified || v.LastModifiedDate
              || gv.GradedDate || v.GradedDate || gv.DateGraded || gv.DateLastModified
              || gv.ReleasedDate || gv.DateReleased;
            if (gradedDate) {
              const studentName = v.User?.DisplayName
                || (v.User?.FirstName && v.User?.LastName ? v.User.FirstName + ' ' + v.User.LastName : '')
                || v.User?.FirstName || 'Student';
              events.push({
                date: gradedDate.split('T')[0],
                type: 'graded',
                title: (go.Name || go.GradeObjectName || 'Grade') + ' \u2014 ' + studentName,
                url: `/d2l/lms/grades/admin/enter/grade_item_edit.d2l?objectId=${goId}&ou=${OU_ID}`,
                id: 'grade-' + goId + '-' + (v.User?.Identifier || '')
              });
            }
          }
        }
      } catch(e) {
        // gradeAllValues may fail if user lacks full gradebook access — that's OK
        console.warn('Grade values fetch failed for', go.Name, e.message);
      }
    }
  } catch(e) {
    console.warn('Failed to fetch grading data:', e.message);
  }

  // Backup: also check dropbox submissions for graded dates
  try {
    let folders = await dropboxFolders();
    if (folders && !Array.isArray(folders) && folders.Objects) folders = folders.Objects;
    if (folders && !Array.isArray(folders) && folders.Items) folders = folders.Items;
    if (Array.isArray(folders)) {
      for (const folder of folders) {
        const fId = folder.Id || folder.FolderId;
        if (!fId) continue;
        try {
          let subs = await api(`/d2l/api/le/${LE}/${OU_ID}/dropbox/folders/${fId}/submissions/`);
          if (subs && !Array.isArray(subs) && subs.Objects) subs = subs.Objects;
          if (subs && !Array.isArray(subs) && subs.Items) subs = subs.Items;
          if (!Array.isArray(subs)) subs = [];
          for (const sub of subs) {
            // Only include if feedback/grade has been provided
            const hasFeedback = sub.Feedback || sub.Score != null || sub.GradedDate;
            const feedbackDate = sub.GradedDate || sub.FeedbackDate || sub.CompletionDate || sub.LastModifiedDate;
            if (hasFeedback && feedbackDate) {
              const dStr = feedbackDate.split('T')[0];
              // Avoid duplicates: check if we already have a graded event for this folder+student+date
              const sName = sub.Entity?.DisplayName || sub.User?.DisplayName || 'Student';
              const dupKey = 'dbx-' + fId + '-' + (sub.Entity?.Identifier || sub.User?.Identifier || '') + '-' + dStr;
              if (!events.find(e => e.id === dupKey)) {
                events.push({
                  date: dStr,
                  type: 'graded',
                  title: (folder.Name || 'Assignment') + ' \u2014 ' + sName,
                  url: `/d2l/lms/dropbox/admin/mark/folder_submissions_users.d2l?db=${fId}&ou=${OU_ID}`,
                  id: dupKey
                });
              }
            }
          }
        } catch(e) {
          // submissions endpoint may not be available for all folder types
        }
      }
    }
  } catch(e) {
    console.warn('Dropbox graded submissions fetch failed:', e.message);
  }

  return events;
}

function renderMonth(monthDate) {
  const year = monthDate.getFullYear();
  const month = monthDate.getMonth();

  const section = document.createElement('div');
  section.className = 'month-section';

  const title = document.createElement('div');
  title.className = 'month-title';
  title.textContent = monthDate.toLocaleDateString('en-US', {month:'long', year:'numeric'});
  section.appendChild(title);

  const grid = document.createElement('div');
  grid.className = 'calendar-grid';

  // Day headers
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  for (const dayName of dayNames) {
    const header = document.createElement('div');
    header.className = 'day-header';
    header.textContent = dayName;
    grid.appendChild(header);
  }

  // Days
  const firstDay = new Date(year, month, 1);
  const startDate = new Date(firstDay);
  startDate.setDate(startDate.getDate() - firstDay.getDay());

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  let current = new Date(startDate);
  for (let i = 0; i < 42; i++) {
    const cell = document.createElement('div');
    cell.className = 'day-cell';

    if (current.getMonth() !== month) cell.classList.add('other-month');
    if (current.getTime() === today.getTime()) cell.classList.add('today');

    const dateStr = current.toISOString().split('T')[0];

    const dayNum = document.createElement('div');
    dayNum.className = 'day-number';
    dayNum.textContent = current.getDate();
    cell.appendChild(dayNum);

    // Events for this day — consolidate graded + discussion by forum, show others individually
    const dayEvents = _calLiveData.filter(e => e.date === dateStr);
    const gradedEvents = dayEvents.filter(e => e.type === 'graded');
    const discussionEvents = dayEvents.filter(e => e.type === 'discussion');
    const otherEvents = dayEvents.filter(e => e.type !== 'graded' && e.type !== 'discussion');
    if (dayEvents.length > 0) {
      const eventsList = document.createElement('div');
      eventsList.className = 'events-list';

      const todayISO = new Date().toISOString().split('T')[0];
      const baseIcons = {assignment:'\u{1F4DD}',event:'\u{1F4C5}'};
      let consolidatedPills = 0;

      // Show graded count pill if any grades were posted this day
      if (gradedEvents.length > 0) {
        const gPill = document.createElement('a');
        gPill.href = `/d2l/le/${OU_ID}/grades/`;
        gPill.className = 'event-pill event-graded';
        gPill.target = '_self';
        gPill.setAttribute('data-tip', 'Grade(s) posted on this date. Click to view details.');
        gPill.textContent = '\u2705 ' + gradedEvents.length + ' graded';
        gPill.title = gradedEvents.length + ' items graded';
        gPill.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          showCalModal(dateStr, gradedEvents);
        };
        eventsList.appendChild(gPill);
        consolidatedPills++;
      }

      // Show discussion pills grouped by forum name
      if (discussionEvents.length > 0) {
        const byForum = {};
        for (const de of discussionEvents) {
          const fn = de.forumName || 'Discussion Forum';
          if (!byForum[fn]) byForum[fn] = [];
          byForum[fn].push(de);
        }
        const forumKeys = Object.keys(byForum);
        const maxForumPills = Math.min(forumKeys.length, 2);
        for (let fi = 0; fi < maxForumPills; fi++) {
          const fn = forumKeys[fi];
          const forumPosts = byForum[fn];
          const dPill = document.createElement('a');
          dPill.href = forumPosts[0].url;
          dPill.className = 'event-pill event-discussion';
          dPill.target = '_self';
          dPill.setAttribute('data-tip', 'Discussion forum post(s) or reply(ies) on this date.');
          dPill.textContent = '\u{1F4E3} ' + forumPosts.length + ' — ' + fn;
          dPill.title = forumPosts.length + ' posts/replies in ' + fn;
          dPill.onclick = function(e) {
            e.preventDefault();
            e.stopPropagation();
            showCalModal(dateStr, forumPosts);
          };
          eventsList.appendChild(dPill);
          consolidatedPills++;
        }
        if (forumKeys.length > maxForumPills) {
          const remaining = forumKeys.slice(maxForumPills).reduce(function(sum, k){ return sum + byForum[k].length; }, 0);
          const moreForums = document.createElement('div');
          moreForums.className = 'more-link';
          moreForums.setAttribute('data-tip', 'Additional events not shown. Click to view all.');
          moreForums.textContent = '+' + remaining + ' more posts';
          moreForums.onclick = function(e) {
            e.preventDefault();
            e.stopPropagation();
            showCalModal(dateStr, discussionEvents);
          };
          eventsList.appendChild(moreForums);
        }
      }

      // Show other events individually (assignments, announcements, calendar events)
      const maxOther = Math.max(1, 3 - consolidatedPills);
      for (let j = 0; j < Math.min(maxOther, otherEvents.length); j++) {
        const ev = otherEvents[j];
        const pill = document.createElement('a');
        pill.href = ev.url;
        let pillClass, icon, titleAttr, tipText;
        if (ev.type === 'assignment' && ev.date < todayISO) {
          pillClass = 'event-assignment-past';
          icon = '\u{26A0}\u{FE0F}';
          titleAttr = 'PAST DUE: ' + ev.title;
          tipText = 'PAST DUE: This assignment due date has passed.';
        } else if (ev.type === 'announcement') {
          pillClass = 'event-announcement';
          icon = ev.scheduled ? '\u{1F552}' : '\u{1F4E3}';
          titleAttr = (ev.scheduled ? 'Scheduled: ' : 'Posted: ') + ev.title;
          tipText = 'Announcement posted or scheduled for this date.';
        } else if (ev.type === 'assignment') {
          pillClass = 'event-' + ev.type;
          icon = baseIcons[ev.type] || '';
          titleAttr = ev.title;
          tipText = 'Assignment due on this date. Click for details.';
        } else if (ev.type === 'event') {
          pillClass = 'event-' + ev.type;
          icon = baseIcons[ev.type] || '';
          titleAttr = ev.title;
          tipText = 'Calendar event scheduled for this date.';
        } else {
          pillClass = 'event-' + ev.type;
          icon = baseIcons[ev.type] || '';
          titleAttr = ev.title;
          tipText = ev.type + ' event on this date.';
        }
        pill.className = 'event-pill ' + pillClass;
        pill.target = '_self';
        pill.setAttribute('data-tip', tipText);
        pill.textContent = icon + ' ' + ev.title;
        pill.title = titleAttr;
        eventsList.appendChild(pill);
      }

      // "More" link for overflow
      if (otherEvents.length > maxOther) {
        const moreLink = document.createElement('div');
        moreLink.className = 'more-link';
        moreLink.setAttribute('data-tip', 'Additional events not shown. Click to view all.');
        moreLink.textContent = '+' + (otherEvents.length - maxOther) + ' more';
        moreLink.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          showCalModal(dateStr, dayEvents);
        };
        eventsList.appendChild(moreLink);
      }

      cell.appendChild(eventsList);
    }

    grid.appendChild(cell);
    current.setDate(current.getDate() + 1);
  }

  section.appendChild(grid);
  return section;
}

/* ═══════════════════════════════════════════════════════════════
   MODAL — expanded day view
   ═══════════════════════════════════════════════════════════════ */
function showCalModal(dateStr, events) {
  const date = new Date(dateStr + 'T00:00:00');
  document.getElementById('calModalTitle').textContent =
    date.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});

  const eventsList = document.getElementById('calModalEvents');
  eventsList.innerHTML = '';

  const todayModal = new Date().toISOString().split('T')[0];
  const labels = {assignment:'\u{1F4DD} Assignment',discussion:'\u{1F4AC} Discussion/Reply',event:'\u{1F4C5} Event',graded:'\u2705 Grade Posted'};
  for (const ev of events) {
    const isPastDue = ev.type === 'assignment' && ev.date < todayModal;
    const item = document.createElement('div');
    item.className = 'cal-day-modal-event-item';
    if (isPastDue) item.style.borderLeftColor = '#EA0029';
    if (ev.type === 'graded') item.style.borderLeftColor = '#1B8C5A';

    const typeLabel = document.createElement('div');
    typeLabel.className = 'cal-day-modal-event-type';
    if (isPastDue) {
      typeLabel.textContent = '\u{26A0}\u{FE0F} Assignment \u2014 PAST DUE';
      typeLabel.style.color = '#EA0029';
    } else if (ev.type === 'announcement') {
      typeLabel.textContent = ev.scheduled ? '\u{1F552} Announcement \u2014 SCHEDULED' : '\u{1F4E3} Announcement \u2014 POSTED';
    } else if (ev.type === 'discussion' && ev.forumName) {
      typeLabel.textContent = '\u{1F4AC} ' + ev.forumName;
    } else {
      typeLabel.textContent = labels[ev.type] || ev.type;
    }
    item.appendChild(typeLabel);

    const title = document.createElement('div');
    title.className = 'cal-day-modal-event-title';
    title.textContent = ev.title;
    item.appendChild(title);

    const link = document.createElement('a');
    link.className = 'cal-day-modal-event-link';
    link.href = ev.url;
    link.textContent = 'View Details \u2192';
    link.target = '_self';
    item.appendChild(link);

    eventsList.appendChild(item);
  }

  const m = document.getElementById('calDayModal');
  m.style.display = 'flex'; m.style.alignItems = 'center'; m.style.justifyContent = 'center';
}

function closeCalModal() {
  document.getElementById('calDayModal').style.display = 'none';
}

/* Calendar Panel Loader */
async function loadCalendarPanel(data, classMembers) {
  const panel = document.getElementById('p-calendar');
  if (!panel) return;

  const isDemo = _isDemoMode;

  panel.innerHTML = '<div class="ldg"><div class="sp"></div><div class="lt">' +
    _loadMsgs[Math.floor(Math.random()*_loadMsgs.length)] + '</div></div>';

  try {
    let events;
    if (isDemo) {
      events = generateCalendarSampleData();
    } else {
      events = await assembleCalendarLiveData();
    }
    _calLiveData = events;
    _calCurrentMonth = new Date();

    // Build the calendar UI
    const totalEvents = events.length;
    const types = {};
    events.forEach(e => { types[e.type] = (types[e.type]||0) + 1; });

    // KPI cards
    const kpiCards = [
      { label: 'Total Events', value: totalEvents, color: 'var(--db)' },
      { label: 'Announcements', value: types['announcement']||0, color: '#2196F3' },
      { label: 'Assignments', value: types['assignment']||0, color: '#E91E63' },
      { label: 'Discussions', value: types['discussion']||0, color: '#4CAF50' },
      { label: 'Calendar Events', value: types['calendar']||0, color: '#FF9800' },
      { label: 'Graded Items', value: types['graded']||0, color: '#9C27B0' }
    ];

    panel.innerHTML = `
      <div id="calendarInner">
        <div class="kpi-row" style="margin-bottom:clamp(12px,2vw,20px)">
          ${kpiCards.map(k => `<div class="kpi" style="border-top:3px solid ${k.color}"><div class="kv">${k.value}</div><div class="kl">${k.label}</div></div>`).join('')}
        </div>
        <div class="cal-ctrl">
          <button class="cal-nav" id="calPrev" data-tip="Go to previous month">&larr; Prev</button>
          <span class="cal-period" id="calPeriod"></span>
          <button class="cal-nav" id="calNext" data-tip="Go to next month">Next &rarr;</button>
          <button class="cal-nav" id="calToday" data-tip="Jump to current month" style="margin-left:auto">Today</button>
        </div>
        <div id="calendarWrapper"></div>
      </div>
    `;

    // Helper to render a month into the wrapper
    function updateCalendarMonth(monthDate) {
      const wrapper = document.getElementById('calendarWrapper');
      if (!wrapper) return;
      wrapper.innerHTML = '';
      wrapper.appendChild(renderMonth(monthDate));
      const periodEl = document.getElementById('calPeriod');
      if (periodEl) periodEl.textContent = monthDate.toLocaleDateString('en-US', {month:'long', year:'numeric'});
    }

    // Render the current month
    updateCalendarMonth(_calCurrentMonth);

    // Wire up navigation
    document.getElementById('calPrev')?.addEventListener('click', () => {
      _calCurrentMonth = new Date(_calCurrentMonth.getFullYear(), _calCurrentMonth.getMonth() - 1, 1);
      updateCalendarMonth(_calCurrentMonth);
    });
    document.getElementById('calNext')?.addEventListener('click', () => {
      _calCurrentMonth = new Date(_calCurrentMonth.getFullYear(), _calCurrentMonth.getMonth() + 1, 1);
      updateCalendarMonth(_calCurrentMonth);
    });
    document.getElementById('calToday')?.addEventListener('click', () => {
      _calCurrentMonth = new Date();
      updateCalendarMonth(_calCurrentMonth);
    });

    // Tooltips handled automatically via document-level event delegation
  } catch (err) {
    console.error('Calendar load error:', err);
    panel.innerHTML = '<div class="cd" style="padding:20px;color:var(--lg)">Error loading calendar: ' + esc(err.message) + '</div>';
  }
}



/* ═══════════════════════════════════════════════════════════════
   PHASE 2: Populate engagement panels with real API data
   Called after assembleLiveData + analyzeInteractions complete
   ═══════════════════════════════════════════════════════════════ */
function populateEngagementData(user, isInst, data, interactions, classList) {
  const userId = user.Identifier || user.UserId;

  // ── Rebuild classMembers with real interaction data ─────────
  const classMembers = (classList||[])
    .filter(s => String(s.Identifier) !== String(userId))
    .map(s => {
      const sid = String(s.Identifier);
      const did = interactions.interactedIds.has(sid);
      const det = interactions.interactionDetails[sid] || null;
      const total = det ? (det.replies||0) + (det.received||0) : 0;
      return {
        id: sid,
        name: `${s.FirstName||''} ${s.LastName||''}`.trim(),
        email: s.Email || '',
        interacted: did,
        detail: det,
        total,
        latestPostUrl: det?.latestPostUrl || null,
        sortKey: total
      };
    });

  const knownIds = new Set(classMembers.map(m => m.id));
  if (interactions.discoveredUsers) {
    for (const [uid, du] of Object.entries(interactions.discoveredUsers)) {
      if (knownIds.has(uid) || uid === String(userId)) continue;
      const det = interactions.interactionDetails[uid] || null;
      const total = det ? (det.replies||0) + (det.received||0) : 0;
      classMembers.push({
        id: uid,
        name: du.name || 'Unknown',
        email: '',
        interacted: interactions.interactedIds.has(uid),
        detail: det,
        total,
        latestPostUrl: det?.latestPostUrl || du.latestPostUrl || null,
        sortKey: total
      });
    }
  }

  const interactedMembers = classMembers.filter(m => m.total > 0);
  const counts = interactedMembers.map(m => m.total).sort((a,b) => a-b);
  const greenThreshold = counts.length ? counts[Math.floor(counts.length * 0.66)] || 1 : 1;
  const yellowThreshold = counts.length ? counts[Math.floor(counts.length * 0.33)] || 1 : 1;

  classMembers.forEach(m => {
    if (m.total === 0) m.tier = 'none';
    else if (m.total >= greenThreshold) m.tier = 'high';
    else if (m.total >= yellowThreshold) m.tier = 'mid';
    else m.tier = 'low';
  });
  classMembers.sort((a,b) => (a.total||0) - (b.total||0));

  const highCount = classMembers.filter(m => m.tier==='high').length;
  const midCount = classMembers.filter(m => m.tier==='mid').length;
  const lowCount = classMembers.filter(m => m.tier==='low').length;
  const noneCount = classMembers.filter(m => m.tier==='none').length;
  const interactedCount = classMembers.filter(m => m.total > 0).length;

  // ── Update KPIs ────────────────────────────────────────────
  const kpiEl = document.getElementById('kpiRow');
  if (kpiEl) {
    const pc = (a,b) => b === 0 ? 0 : Math.round(a/b*100);
    const kpis = isInst
      ? [
          { label: 'Enrolled', value: data.totalStudents || classMembers.length, cls: 'dark' },
          { label: 'Discussion Posts', value: (data.totalPosts||0) + (data.totalReplies||0), cls: '' },
          { label: 'Interaction Coverage', value: pc(interactedCount, classMembers.length) + '%', cls: 'gold' }
        ]
      : [
          { label: 'Discussion Posts', value: (data.myPosts||0) + (data.myReplies||0), cls: '' },
          { label: 'Interaction Coverage', value: pc(interactedCount, classMembers.length) + '%', cls: 'gold' }
        ];
    kpiEl.innerHTML = kpis.map(k => `<div class="kpi ${k.cls}"><div class="kv">${k.value}</div><div class="kl">${k.label}</div></div>`).join('');
  }

  // ── Activity line chart ────────────────────────────────────
  lineChart('chAct', data.actLabels||[], data.actData||[], 'Daily Posts');

  // ── Donut chart ────────────────────────────────────────────
  if (data.discPosts && data.discReplies) {
    const totalDisc = data.discPosts.reduce((a,b)=>a+b,0) + data.discReplies.reduce((a,b)=>a+b,0);
    const totalInt = interactedCount;
    donut('chBrk', ['Discussions', 'Interactions'], [totalDisc, totalInt], ['#00416B', '#3CB4E5']);
  }

  // ── Discussion charts (replace loading spinners with canvases) ──
  if (data.discLabels && data.discPosts && data.discReplies) {
    const discWrap = document.getElementById('chDiscWrap');
    if (discWrap) { discWrap.innerHTML = '<canvas id="chDisc"></canvas>'; }
    const myDiscWrap = document.getElementById('chMyDiscWrap');
    if (myDiscWrap) { myDiscWrap.innerHTML = '<canvas id="chMyDisc"></canvas>'; }
    stackedBar('chDisc', data.discLabels, data.discPosts, data.discReplies);
    responseRateBar('chMyDisc', data.discLabels, data.discResponseRate||[]);
  }

  // ── Recent posts feeds ─────────────────────────────────────
  if (data.recentPosts && data.recentPosts.length) {
    const posts = data.recentPosts.filter(p => !p.isReply).slice(0, 5);
    const replies = data.recentPosts.filter(p => p.isReply).slice(0, 5);

    const feedHtml = (items) => items.map(p => {
      // Link to the specific post when we have its ID \u2014 Brightspace anchors
      // to it via the postId query param plus the m_{id} fragment for scroll.
      // Fall back to the topic view if we somehow don't have a post ID.
      const url = p.postId
        ? `/d2l/le/${OU_ID}/discussions/topics/${p.topicId}/View?postId=${encodeURIComponent(p.postId)}#m_${encodeURIComponent(p.postId)}`
        : `/d2l/le/${OU_ID}/discussions/topics/${p.topicId}/View`;
      return `<div class="di">
        <div class="da">${ini(p.author)}</div>
        <div>
          <a href="${url}" target="_blank" rel="noopener" class="dt" style="text-decoration:none">${p.subject}</a>
          <div class="dm"><strong>${p.author}</strong> in ${p.forum} \u00b7 ${relDate(p.date)}</div>
        </div>
      </div>`;
    }).join('');

    const pEl = document.getElementById('discFeedPosts');
    if (pEl) pEl.innerHTML = feedHtml(posts) || '<div style="color:var(--lg);font-size:.82rem;padding:12px 0">No posts yet</div>';

    const rEl = document.getElementById('discFeedReplies');
    if (rEl) rEl.innerHTML = feedHtml(replies) || '<div style="color:var(--lg);font-size:.82rem;padding:12px 0">No replies yet</div>';
  } else {
    const pEl = document.getElementById('discFeedPosts');
    if (pEl) pEl.innerHTML = '<div style="color:var(--lg);font-size:.82rem;padding:12px 0">No posts yet</div>';
    const rEl = document.getElementById('discFeedReplies');
    if (rEl) rEl.innerHTML = '<div style="color:var(--lg);font-size:.82rem;padding:12px 0">No replies yet</div>';
  }

  // ── Forum Matrix ───────────────────────────────────────────
  const matrixData = buildForumMatrix(
    classList,
    interactions.forumStudentReplies || {},
    userId,
    interactions.forumOrder || [],
    interactions.forumActivity || {},
    interactions.forumReplyMeta || {}
  );
  renderForumMatrix(matrixData);

  // ── Discussion Calendar ────────────────────────────────────
  window._discussionEvents = interactions.discussionEvents || [];
  if (!window._discCalMonth) window._discCalMonth = new Date();
  renderDiscussionCalendar();
  wireDiscussionCalendarControls();

  // ── Scoreboards ────────────────────────────────────────────
  renderScoreboard(interactions.forumActivity || {});

  // ── Interaction Grid ───────────────────────────────────────
  renderInteractionGrid(classMembers);

  // Re-bind filter listeners (in case they were set up with old classMembers)
  const searchEl = document.getElementById('itSearch');
  const filterEl = document.getElementById('itFilter');
  if (searchEl) {
    searchEl.removeEventListener('input', searchEl._filterFn);
    searchEl._filterFn = () => filterInteractions(classMembers);
    searchEl.addEventListener('input', searchEl._filterFn);
  }
  if (filterEl) {
    filterEl.removeEventListener('change', filterEl._filterFn);
    filterEl._filterFn = () => filterInteractions(classMembers);
    filterEl.addEventListener('change', filterEl._filterFn);
  }

  // ── 1-on-1 Grid — split by thread initiator ─────────────────
  if (isInst && interactions.oneOnOneData) {
    const ooGrid = document.getElementById('ooGrid');
    if (ooGrid) {
      // classMembers is the current course roster. Dropped students
      // (sid not in this set) are NOT filtered out of ooEntries — per
      // the user's rule, their threads count as closed. The section
      // filters below exclude them from the actionable subsections,
      // and the KPI tallies them into the closed-thread counts.
      const enrolledOoIds = new Set(
        (classMembers || []).map(m => String(m.id || m.Identifier || m.UserId || '')).filter(Boolean)
      );
      // Students who posted in a 1-on-1 topic are always treated as
      // enrolled for display — classlist ID shapes can differ from
      // PostingUserId on discussion posts in some course types.
      Object.keys(interactions.oneOnOneData || {}).forEach(function (sid) {
        if (sid) enrolledOoIds.add(String(sid));
      });
      const ooEntries = Object.entries(interactions.oneOnOneData)
        .sort((a,b) => (a[1].name||'').localeCompare(b[1].name||''));
      console.log('[1-on-1 Render] Total entries:', ooEntries.length);
      // Debug hook — exposes the raw oneOnOneData so a console command
      // can dump the data the analyzer is working with (messages,
      // unanswered-post arrays, post counts, dates). Updated again by
      // runOOClosureAnalysis when it finishes, with the closureSids
      // set attached so we can see which threads were filtered out.
      try { window.__bspOO = { entries: ooEntries, closureSids: null, analyzedAt: null }; } catch (e) {}
      if (ooEntries.length) {
        console.log('[1-on-1 Render] Initiator values:', ooEntries.map(([sid, oo]) => sid + '=' + (oo.initiatedBy || 'UNDEFINED')).join(', '));
      }
      // KPI counts stay visible even when nothing is actionable.
      // Open threads use a tabbed list; if every tab is empty, a single
      // empty state replaces three stacked "no threads" messages.
      {
        const now = Date.now();

        // Stale-conversation threshold lives at module scope as
        // OO_STALE_DAYS (with isOoStale helper). Local alias below
        // so the older code reads naturally.
        const isStaleStudentMsg = isOoStale;

        // A thread is "closed" (per user spec) when any of:
        //   • student is no longer enrolled (dropped → counts as closed)
        //   • latest student message is older than OO_STALE_DAYS (stale)
        //   • instructor's last reply was after the student's last post
        // Closed threads are hidden from the actionable sections but
        // still appear in the KPI counts at the top so the dashboard
        // stays useful even when most/all threads are resolved.
        const isClosedOoEntry = ([sid, oo]) => {
          if (!enrolledOoIds.has(String(sid))) return true;            // dropped
          if (isStaleStudentMsg(oo)) return true;                      // stale
          if (oo.lastStudentDate && oo.lastInstructorDate
              && new Date(oo.lastInstructorDate) > new Date(oo.lastStudentDate)) {
            return true;                                                // instructor last
          }
          return false;
        };

        // Section filters — open (actionable) only.
        const studentInitiated = ooEntries.filter(e =>
          e[1].initiatedBy !== 'instructor' && !isClosedOoEntry(e)
        );
        const instructorInitiatedAll = ooEntries.filter(e =>
          e[1].initiatedBy === 'instructor'
        );
        const instructorNoStudentResponse = instructorInitiatedAll.filter(e =>
          (e[1].postsFromStudent || 0) === 0 && !isClosedOoEntry(e)
        );
        const instructorAwaitingInstrReply = instructorInitiatedAll.filter(([sid, oo]) =>
          (oo.postsFromStudent || 0) > 0
          && oo.lastStudentDate
          && (!oo.lastInstructorDate || new Date(oo.lastStudentDate) > new Date(oo.lastInstructorDate))
          && !isClosedOoEntry([sid, oo])
        );

        // Closed-thread counts (split by initiator) for the KPI cells.
        const closedStudentInitCount = ooEntries.filter(e =>
          e[1].initiatedBy !== 'instructor' && isClosedOoEntry(e)
        ).length;
        const closedInstrInitCount = ooEntries.filter(e =>
          e[1].initiatedBy === 'instructor' && isClosedOoEntry(e)
        ).length;

        function buildOOTable(entries, emptyMessage) {
          if (!entries.length) {
            return '<div class="oo-empty">' + emptyMessage + '</div>';
          }
          let t = '<div style="overflow-x:auto"><table class="oo-table"><thead><tr>';
          t += '<th>Student</th>';
          t += '<th class="num" data-tip="Number of posts from the student in their 1-on-1 forum.">Student posts</th>';
          t += '<th class="num" data-tip="Number of your replies in the student\'s 1-on-1 forum.">Your replies</th>';
          t += '<th class="num" data-tip="When the student last posted in the 1-on-1 forum.">Student last post</th>';
          t += '<th class="num" data-tip="When you last replied in the student\'s 1-on-1 forum.">Your last reply</th>';
          t += '<th class="num" data-tip="Activity status based on most recent message.">Status</th>';
          t += '<th class="num">Action</th>';
          t += '</tr></thead><tbody>';
          entries.forEach(([sid, oo]) => {
            const lastDate = oo.lastStudentDate || oo.lastInstructorDate;
            const daysAgo = lastDate ? Math.floor((now - new Date(lastDate).getTime()) / 86400000) : 999;
            const statusColor = daysAgo <= 7 ? '#0f5b46' : daysAgo <= 14 ? '#b5880a' : '#dc2626';
            const statusLabel = daysAgo <= 7 ? 'Active' : daysAgo <= 14 ? 'Stale' : daysAgo < 999 ? 'Inactive' : 'No posts';
            const studentDate = oo.lastStudentDate ? relDate(oo.lastStudentDate) : '\u2014';
            const instrDate = oo.lastInstructorDate ? relDate(oo.lastInstructorDate) : '\u2014';
            // Stale messages don't get a needs-reply badge — see
            // STALE_DAYS above. Keeps the row visible (instructor may
            // still want to scan past activity) but stops noisy badges
            // for conversations that are functionally resolved.
            const needsReply = oo.lastStudentDate
              && (!oo.lastInstructorDate || new Date(oo.lastStudentDate) > new Date(oo.lastInstructorDate))
              && !isStaleStudentMsg(oo);
            // data-sid lets the closure analyzer find this row after the
            // table is in the DOM and remove the badge if the latest
            // student message turns out to be a conversation closer.
            t += '<tr data-sid="' + sid + '">';
            t += '<td style="font-weight:600;color:var(--db)">' + oo.name + (needsReply ? ' <span class="needs-reply-badge" data-sid="' + sid + '" style="background:#dc2626;color:#fff;padding:2px 8px;border-radius:8px;font-size:.65rem;font-weight:700;margin-left:4px">needs reply</span>' : '') + '</td>';
            t += '<td class="num" style="font-weight:600">' + oo.postsFromStudent + '</td>';
            t += '<td class="num" style="font-weight:600">' + oo.postsFromInstructor + '</td>';
            t += '<td class="num" data-sid="' + sid + '" data-cell="student-date" style="font-size:.78rem;color:var(--lg)">' + studentDate + '</td>';
            t += '<td class="num" style="font-size:.78rem;color:var(--lg)">' + instrDate + '</td>';
            t += '<td class="num"><span class="oo-status" style="background:' + statusColor + '">' + statusLabel + '</span></td>';
            const openUrl = oo.lastStudentPostId
              ? (oo.topicUrl + '?postId=' + encodeURIComponent(oo.lastStudentPostId) + '#m_' + encodeURIComponent(oo.lastStudentPostId))
              : oo.topicUrl;
            t += '<td class="num"><a class="oo-open-link" href="' + openUrl + '" data-sid="' + sid + '" data-cell="open" target="_blank" rel="noopener" data-tip="Open the latest student message in this 1-on-1 discussion.">Open \u2192</a></td>';
            t += '</tr>';
          });
          t += '</tbody></table></div>';
          return t;
        }

        const ooTabs = [
          {
            id: 'student',
            label: 'Needs your reply',
            count: studentInitiated.length,
            desc: 'The student started the thread and it is still open.',
            empty: 'No student-started threads need a reply.',
            pillId: 'ooAnalysisPillStudent',
            entries: studentInitiated
          },
          {
            id: 'followup',
            label: 'Needs your follow-up',
            count: instructorAwaitingInstrReply.length,
            desc: 'You started the thread, the student replied, and it is your turn.',
            empty: 'No instructor-started threads are waiting on you.',
            pillId: 'ooAnalysisPillInstr',
            entries: instructorAwaitingInstrReply
          },
          {
            id: 'waiting',
            label: 'Waiting on student',
            count: instructorNoStudentResponse.length,
            desc: 'You reached out and the student has not replied yet.',
            empty: 'No instructor-started threads are waiting on a student.',
            pillId: 'ooAnalysisPillInstrNoResp',
            entries: instructorNoStudentResponse
          }
        ];
        const defaultTab = (ooTabs.find(tab => tab.count > 0) || ooTabs[0]).id;
        const allEmpty = ooTabs.every(tab => tab.count === 0);

        let html = '';
        if (allEmpty) {
          html += '<div class="oo-empty oo-empty--page">';
          html += '<p class="oo-empty-title">No open threads</p>';
          html += '<p class="oo-empty-sub">There are no 1-on-1 conversations that need attention in this course right now.</p>';
          html += '</div>';
          html += '<span id="ooAnalysisPillStudent" class="oo-analysis-pill" hidden></span>';
          html += '<span id="ooAnalysisPillInstr" class="oo-analysis-pill" hidden></span>';
          html += '<span id="ooAnalysisPillInstrNoResp" class="oo-analysis-pill" hidden></span>';
        } else {
          html += '<div class="oo-tabs" role="tablist" aria-label="Open 1-on-1 threads">';
          ooTabs.forEach(tab => {
            const active = tab.id === defaultTab;
            html += '<button type="button" class="oo-tab' + (active ? ' is-active' : '') + '" role="tab" id="oo-tab-' + tab.id + '" data-oo-tab="' + tab.id + '" aria-selected="' + (active ? 'true' : 'false') + '" aria-controls="oo-panel-' + tab.id + '" tabindex="' + (active ? '0' : '-1') + '">';
            html += tab.label;
            html += ' <span class="oo-tab-count' + (tab.count ? ' has-items' : '') + '">' + tab.count + '</span>';
            html += '</button>';
          });
          html += '</div>';
          ooTabs.forEach(tab => {
            const active = tab.id === defaultTab;
            html += '<div class="oo-tab-panel" role="tabpanel" id="oo-panel-' + tab.id + '" data-oo-panel="' + tab.id + '" aria-labelledby="oo-tab-' + tab.id + '"' + (active ? '' : ' hidden') + '>';
            html += '<div class="oo-panel-head">';
            html += '<p class="oo-panel-desc">' + tab.desc + '</p>';
            html += '<span id="' + tab.pillId + '" class="oo-analysis-pill"></span>';
            html += '</div>';
            html += buildOOTable(tab.entries, tab.empty);
            html += '</div>';
          });
        }

        ooGrid.innerHTML = html;

        const toolbar = document.querySelector('#p-one-on-one .oo-toolbar');
        if (toolbar) toolbar.hidden = allEmpty;

        (function wireOOTabs() {
          const tabs = Array.prototype.slice.call(ooGrid.querySelectorAll('[data-oo-tab]'));
          if (!tabs.length) return;
          function activate(id) {
            tabs.forEach(function (btn) {
              const on = btn.getAttribute('data-oo-tab') === id;
              btn.classList.toggle('is-active', on);
              btn.setAttribute('aria-selected', on ? 'true' : 'false');
              btn.tabIndex = on ? 0 : -1;
            });
            ooGrid.querySelectorAll('[data-oo-panel]').forEach(function (panel) {
              panel.hidden = panel.getAttribute('data-oo-panel') !== id;
            });
          }
          tabs.forEach(function (btn) {
            btn.addEventListener('click', function () {
              activate(btn.getAttribute('data-oo-tab'));
            });
            btn.addEventListener('keydown', function (ev) {
              const i = tabs.indexOf(btn);
              if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
              ev.preventDefault();
              const next = ev.key === 'ArrowRight'
                ? (i + 1) % tabs.length
                : (i - 1 + tabs.length) % tabs.length;
              tabs[next].focus();
              activate(tabs[next].getAttribute('data-oo-tab'));
            });
          });
        })();

        // Populate the KPI banner above the tables. Uses the raw
        // oneOnOneData first (no closure-analysis filter) so it shows
        // fast; runOOClosureAnalysis re-computes once the analyzer has
        // classified each thread's latest student message. Both calls
        // share the enrolled-ids set + closed counts.
        const kpiOpts = {
          closureSids: null,
          enrolledIds: enrolledOoIds,
          closedStudentInitCount,
          closedInstrInitCount,
        };
        renderOOKpi(ooEntries, kpiOpts);

        // After the table renders, run the closure-detection pass.
        runOOClosureAnalysis(ooEntries, { enrolledIds: enrolledOoIds });
      }
    }
  }

  console.log('[Engagement] Phase 2 UI update complete — all engagement panels populated');
}

    async function main() {
  let user, course, enr, isInst, data, cl, interactions, roleName;
  let isDemo = false;

  // Clear lazy caches so Refresh re-fetches assignment + feedback data
  window._asnBundle = null;
  window._discussionEvents = [];
  Object.keys(_tabGroupLoaded).forEach(k => { _tabGroupLoaded[k] = false; });

  try {
    /* ── PHASE 1: Fast calls ─ identity + roster (3 parallel requests) ── */
    console.time('[Engagement] Phase 1 — identity + roster');
    user = await whoami();
    const uid = user.Identifier || user.UserId;

    if (!OU_ID) throw new Error('No OrgUnitId detected');

    const [courseRes, clRes, enrRes] = await Promise.allSettled([
      courseInfo(), classlist(), enrollment(uid)
    ]);

    course = courseRes.status==='fulfilled' ? courseRes.value : null;
    cl     = (clRes.status==='fulfilled' && Array.isArray(clRes.value)) ? clRes.value : [];
    enr    = enrRes.status==='fulfilled' ? enrRes.value : null;
    isInst = isInstructor(enr);
    roleName = getRoleName(enr);

    const dbgRole = extractRole(enr);
    console.log('Enrollment data:', JSON.stringify(enr));
    console.log('Extracted role:', dbgRole?.Name, '| Role ID:', dbgRole?.Id, '| isInstructor:', isInst, '| Display:', roleName);
    console.timeEnd('[Engagement] Phase 1 — identity + roster');

    // Store shared state early so lazy-loaded panels can use them
    _currentUserId = String(uid || '0');
    _isInstructor = isInst;
    _isDemoMode = false;

    /* ── Render UI shell immediately with loading spinners ── */
    renderShell(user, course, isInst, cl, roleName, false);
    // Stop the loading message rotator
    if (window._loadRotateTimer) clearInterval(window._loadRotateTimer);

    /* ── PHASE 2: Heavy calls ─ forum data (runs in background) ── */
    console.time('[Engagement] Phase 2 — forum analysis');
    const [dataRes, intRes] = await Promise.allSettled([
      assembleLiveData(user, isInst, cl),
      analyzeInteractions(uid, cl)
    ]);

    data = dataRes.status==='fulfilled' ? dataRes.value : sampleData(isInst);
    interactions = intRes.status==='fulfilled' ? intRes.value : { interactedIds: new Set(), interactionDetails: {}, forumActivity: {}, discoveredUsers: {}, oneOnOneData: {} };
    console.timeEnd('[Engagement] Phase 2 — forum analysis');

    /* ── Populate engagement panels with real data ── */
    populateEngagementData(user, isInst, data, interactions, cl);

  } catch(err) {
    console.warn('Brightspace API not available — loading preview mode.', err);
    user = { FirstName:'Demo', LastName:'User', Identifier:'0' };
    course = { Name:"LTR-500 \u2014 Myth and Worldbuilding in Tolkien's Middle-earth (Preview)" };
    isInst = true;
    roleName = 'Instructor';
    cl = sampleClasslist('0');
    data = sampleData(isInst);
    interactions = sampleInteractions('0', cl);
    isDemo = true;

    _currentUserId = String(user.Identifier || user.UserId || '0');
    _isInstructor = isInst;
    _isDemoMode = isDemo;

    // Stop the loading message rotator
    if (window._loadRotateTimer) clearInterval(window._loadRotateTimer);

    // In demo mode, render everything at once (data is instant)
    renderShell(user, course, isInst, cl, roleName, isDemo);
    populateEngagementData(user, isInst, data, interactions, cl);
  }
}

main();

      darkBlue: [0, 65, 107], gold: [254, 217, 37], lightBlue: [60, 180, 229],

        doc.setFont('Helvetica', 'bold');
        doc.setFontSize(10);
        doc.text('Institution Engagement Dashboard — ' + activeTab, ML, 20);
        doc.setTextColor(255, 255, 255);
        doc.setFont('Helvetica', 'normal');
        doc.setFontSize(8);
        doc.text(courseName, W - MR, 20, { align: 'right' });
        y = 44;
      }
    }

    function drawFooter() {
      const fy = H - 28;
      doc.setDrawColor(...C.gold);
      doc.setLineWidth(1.2);
      doc.line(ML, fy - 4, W - MR, fy - 4);
      doc.setTextColor(...C.darkGray);
      doc.setFont('Helvetica', 'normal');
      doc.setFontSize(7);
      doc.text('Your Institution  \u00b7  Instructional Technology  \u00b7  Engagement Dashboard v1.0', ML, fy + 6);
      doc.setTextColor(...C.lightGray);
      doc.text('Page ' + pageNum, W - MR, fy + 6, { align: 'right' });
    }

    function ensureSpace(needed) {
      if (y + needed > H - MB) {
        drawFooter();
        newPage(false);
      }
    }

    function sectionHead(text) {
      ensureSpace(32);
      y += 4;
      doc.setFillColor(...C.lightBlue);
      doc.rect(ML, y, CW, 20, 'F');
      doc.setTextColor(0, 0, 0);
      doc.setFont('Helvetica', 'bold');
      doc.setFontSize(10);
      doc.text(text, ML + 8, y + 13);
      y += 28;
    }

    function kpiRow(items) {
      ensureSpace(50);
      const boxW = CW / items.length - 6;
      for (let i = 0; i < items.length; i++) {
        const x = ML + i * (boxW + 6);
        doc.setFillColor(...C.bg);
        doc.roundedRect(x, y, boxW, 40, 3, 3, 'F');
        doc.setDrawColor(220, 220, 220);
        doc.roundedRect(x, y, boxW, 40, 3, 3, 'S');
        doc.setTextColor(...C.darkBlue);
        doc.setFont('Helvetica', 'bold');
        doc.setFontSize(14);
        doc.text(String(items[i].value), x + boxW/2, y + 18, { align: 'center' });
        doc.setTextColor(...C.lightGray);
        doc.setFont('Helvetica', 'normal');
        doc.setFontSize(7);
        doc.text(items[i].label, x + boxW/2, y + 32, { align: 'center' });
      }
      y += 50;
    }

    // Generic table renderer from an HTML table element
    function renderHTMLTable(tableEl, opts) {
      if (!tableEl) return;
      opts = opts || {};
      const maxColWidth = opts.maxColWidth || 120;
      const fontSize = opts.fontSize || 7;
      const headerFontSize = opts.headerFontSize || 7;
      const rowH = opts.rowH || 12;
      const headerH = opts.headerH || 14;

      // Extract headers
      const thEls = tableEl.querySelectorAll('thead th, tr:first-child th');
      const headers = [];
      thEls.forEach(th => headers.push(th.textContent.trim()));
      if (headers.length === 0) return;

      // Extract rows
      const rows = [];
      const trEls = tableEl.querySelectorAll('tbody tr, tr');
      trEls.forEach(tr => {
        const cells = tr.querySelectorAll('td');
        if (cells.length > 0) {
          const row = [];
          cells.forEach(td => row.push(td.textContent.trim()));
          rows.push(row);
        }
      });

      const numCols = headers.length;
      const colW = Math.min(CW / numCols, maxColWidth);
      const tableW = colW * numCols;

      // Draw header
      ensureSpace(headerH + rowH * 2);
      for (let i = 0; i < numCols; i++) {
        doc.setFillColor(...C.darkBlue);
        doc.rect(ML + i * colW, y, colW, headerH, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFont('Helvetica', 'bold');
        doc.setFontSize(headerFontSize);
        const hText = headers[i].length > 16 ? headers[i].substring(0, 14) + '\u2026' : headers[i];
        doc.text(hText, ML + i * colW + 3, y + headerH - 4, { maxWidth: colW - 6 });
      }
      y += headerH + 1;

      // Draw rows
      for (let r = 0; r < rows.length; r++) {
        ensureSpace(rowH + 2);
        const rowBg = r % 2 === 0 ? C.white : C.bg;
        for (let c = 0; c < Math.min(rows[r].length, numCols); c++) {
          doc.setFillColor(...rowBg);
          doc.rect(ML + c * colW, y, colW, rowH, 'F');
          doc.setDrawColor(220, 220, 220);
          doc.setLineWidth(0.3);
          doc.rect(ML + c * colW, y, colW, rowH);
          doc.setTextColor(...C.darkGray);
          doc.setFont('Helvetica', 'normal');
          doc.setFontSize(fontSize);
          const text = rows[r][c] || '';
          const truncated = text.length > 20 ? text.substring(0, 18) + '\u2026' : text;
          doc.text(truncated, ML + c * colW + 3, y + rowH - 3, { maxWidth: colW - 6 });
        }
        y += rowH;
      }
      y += 8;
    }

    /* ── Build PDF content from the active panel ─────────── */
    newPage(true);

    const activePanel = document.querySelector('.panel.active');
    if (!activePanel) {
      doc.setTextColor(...C.darkGray);
      doc.text('No active panel found.', ML, y + 20);
      drawFooter();
      doc.save('Engagement_Dashboard_' + new Date().toISOString().split('T')[0] + '.pdf');
      return;
    }

    // Extract KPI values if present
    const kpis = activePanel.querySelectorAll('.kpi');
    if (kpis.length > 0) {
      const kpiData = [];
      kpis.forEach(k => {
        kpiData.push({
          value: k.querySelector('.kv')?.textContent?.trim() || '—',
          label: k.querySelector('.kl')?.textContent?.trim() || ''
        });
      });
      if (kpiData.length > 0) {
        sectionHead('Key Metrics');
        kpiRow(kpiData);
      }
    }

    // Extract tables
    const tables = activePanel.querySelectorAll('table');
    tables.forEach((table, idx) => {
      const heading = table.closest('.cd')?.querySelector('h3, h2, .fb-wrap h3');
      const title = heading ? heading.textContent.trim() : 'Data Table ' + (idx + 1);
      sectionHead(title);
      renderHTMLTable(table);
    });

    // If no tables found, try to capture text content
    if (tables.length === 0) {
      const cards = activePanel.querySelectorAll('.cd');
      cards.forEach(card => {
        const h = card.querySelector('h3, h2');
        if (h) {
          sectionHead(h.textContent.trim());
        }
        const text = card.textContent.trim().substring(0, 2000);
        if (text) {
          ensureSpace(60);
          doc.setTextColor(...C.darkGray);
          doc.setFont('Helvetica', 'normal');
          doc.setFontSize(8);
          const lines = doc.splitTextToSize(text, CW - 8);
          const blockH = Math.min(lines.length * 10 + 8, 300);
          doc.setFillColor(...C.bg);
          doc.roundedRect(ML, y, CW, blockH, 3, 3, 'F');
          doc.text(lines.slice(0, 30), ML + 4, y + 12);
          y += blockH + 8;
        }
      });
    }

    drawFooter();

    const filename = 'Engagement_' + activeTab.replace(/[^a-zA-Z0-9]/g, '_') + '_' + new Date().toISOString().split('T')[0] + '.pdf';
    doc.save(filename);
    console.log('[ENG] PDF generated:', filename);

  } catch(e) {
    console.error('[ENG] PDF generation error:', e);
    alert('PDF generation failed: ' + e.message);
  }
};

/* ═══════════════════════════════════════════════════════════════
   XLSX EXPORT — Forum Matrix (Fac replies · Student activity)
   ═══════════════════════════════════════════════════════════════ */
window.exportForumMatrixXLSX = function exportForumMatrixXLSX() {
  try {
    const matrix = window._forumMatrixData;
    if (!matrix || !matrix.students || !matrix.forums) {
      alert('Forum matrix not loaded yet. Please wait for data to load.');
      return;
    }

    const { students, forums, data, studentActivity } = matrix;

    // Headers: Fac | Stu | Student | per-forum Fac + Stu columns | Total Fac | Total Stu
    const headers = ['Fac Replied', 'Student Posted', 'Student'];
    forums.forEach(f => {
      const label = String(f || 'Forum');
      headers.push(label + ' — Instructor');
      headers.push(label + ' — Student');
    });
    headers.push('Total — Instructor');
    headers.push('Total — Student');

    const rows = [];
    students.forEach(student => {
      let facTotal = 0;
      let stuTotal = 0;
      const row = [];
      const forumFac = [];
      const forumStu = [];
      forums.forEach(forum => {
        const facCount = (data[forum] && data[forum][student.id]) || 0;
        const stuCount = (studentActivity && studentActivity[forum] && studentActivity[forum][student.id]
          && studentActivity[forum][student.id].total) || 0;
        facTotal += facCount;
        stuTotal += stuCount;
        forumFac.push(facCount);
        forumStu.push(stuCount);
      });
      row.push(facTotal > 0 ? 'Yes' : 'No');
      row.push(stuTotal > 0 ? 'Yes' : 'No');
      row.push(student.name || '');
      forums.forEach((_, i) => {
        row.push(forumFac[i]);
        row.push(forumStu[i]);
      });
      row.push(facTotal);
      row.push(stuTotal);
      rows.push(row);
    });

    // Footer: % of students you replied to (instructor columns only)
    const pctRow = ['', '', '% Faculty replied'];
    forums.forEach(forum => {
      const forumData = data[forum] || {};
      const interactedCount = students.filter(s => (forumData[s.id] || 0) > 0).length;
      const pct = students.length > 0 ? Math.round(interactedCount / students.length * 100) : 0;
      pctRow.push(pct + '%');
      pctRow.push(''); // student column has no faculty-% metric
    });
    const overallInteracted = students.filter(s => {
      return forums.some(forum => ((data[forum] && data[forum][s.id]) || 0) > 0);
    }).length;
    const overallPct = students.length > 0 ? Math.round(overallInteracted / students.length * 100) : 0;
    pctRow.push(overallPct + '%');
    pctRow.push('');
    rows.push(pctRow);

    // Legend / notes sheet rows
    const notes = [
      ['Column', 'Meaning'],
      ['Fac Replied', 'Yes if you directly replied to this student in at least one forum'],
      ['Student Posted', 'Yes if the student posted or replied in at least one of these forums'],
      ['— Instructor', 'Number of times you directly replied to that student in that forum'],
      ['— Student', 'Student posts + replies in that forum (their own activity)'],
      ['% Faculty replied', 'Share of class roster you have replied to in that forum']
    ];

    let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
    xml += '<?mso-application progid="Excel.Sheet"?>\n';
    xml += '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"\n';
    xml += '  xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n';

    xml += '<Styles>\n';
    xml += '  <Style ss:ID="Default"><Font ss:FontName="Calibri" ss:Size="11"/></Style>\n';
    xml += '  <Style ss:ID="Header"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#FFFFFF"/>';
    xml += '<Interior ss:Color="#0F5B46" ss:Pattern="Solid"/>';
    xml += '<Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="1"/></Style>\n';
    xml += '  <Style ss:ID="HeaderFac"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#FFFFFF"/>';
    xml += '<Interior ss:Color="#0F5B46" ss:Pattern="Solid"/>';
    xml += '<Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="1"/></Style>\n';
    xml += '  <Style ss:ID="HeaderStu"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#FFFFFF"/>';
    xml += '<Interior ss:Color="#2D9D7A" ss:Pattern="Solid"/>';
    xml += '<Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="1"/></Style>\n';
    xml += '  <Style ss:ID="Name"><Font ss:FontName="Calibri" ss:Size="11"/></Style>\n';
    xml += '  <Style ss:ID="Zero"><Font ss:FontName="Calibri" ss:Size="11" ss:Color="#AAAAAA"/><Alignment ss:Horizontal="Center"/></Style>\n';
    xml += '  <Style ss:ID="FacNum"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#0F5B46"/><Alignment ss:Horizontal="Center"/></Style>\n';
    xml += '  <Style ss:ID="StuNum"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#2D9D7A"/><Alignment ss:Horizontal="Center"/></Style>\n';
    xml += '  <Style ss:ID="Yes"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#0F5B46"/><Alignment ss:Horizontal="Center"/></Style>\n';
    xml += '  <Style ss:ID="No"><Font ss:FontName="Calibri" ss:Size="11" ss:Color="#B00020"/><Alignment ss:Horizontal="Center"/></Style>\n';
    xml += '  <Style ss:ID="Pct"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1"/><Alignment ss:Horizontal="Center"/>';
    xml += '<Interior ss:Color="#F2F8F5" ss:Pattern="Solid"/></Style>\n';
    xml += '</Styles>\n';

    function cellXml(value, styleId, forceString) {
      const style = styleId ? ' ss:StyleID="' + styleId + '"' : '';
      if (!forceString && typeof value === 'number' && Number.isFinite(value)) {
        return '  <Cell' + style + '><Data ss:Type="Number">' + value + '</Data></Cell>\n';
      }
      return '  <Cell' + style + '><Data ss:Type="String">' + escXml(String(value == null ? '' : value)) + '</Data></Cell>\n';
    }

    xml += '<Worksheet ss:Name="Forum Matrix">\n<Table>\n';

    // Header row — color instructor vs student forum columns differently
    xml += '<Row ss:Height="30">\n';
    headers.forEach((h, idx) => {
      let style = 'Header';
      if (idx >= 3) {
        // After Student name: pairs of Fac, Stu, … then Total Fac, Total Stu
        const offset = idx - 3;
        style = (offset % 2 === 0) ? 'HeaderFac' : 'HeaderStu';
      }
      xml += cellXml(h, style, true);
    });
    xml += '</Row>\n';

    rows.forEach((row, rowIdx) => {
      const isPct = rowIdx === rows.length - 1;
      xml += '<Row>\n';
      row.forEach((cell, idx) => {
        if (isPct) {
          xml += cellXml(cell, 'Pct', true);
          return;
        }
        if (idx === 0 || idx === 1) {
          xml += cellXml(cell, cell === 'Yes' ? 'Yes' : 'No', true);
        } else if (idx === 2) {
          xml += cellXml(cell, 'Name', true);
        } else if (typeof cell === 'number') {
          const offset = idx - 3;
          const isFacCol = offset % 2 === 0;
          const style = cell === 0 ? 'Zero' : (isFacCol ? 'FacNum' : 'StuNum');
          xml += cellXml(cell, style);
        } else {
          xml += cellXml(cell, null, true);
        }
      });
      xml += '</Row>\n';
    });

    xml += '</Table>\n</Worksheet>\n';

    // Notes sheet
    xml += '<Worksheet ss:Name="Legend">\n<Table>\n';
    notes.forEach((noteRow, i) => {
      xml += '<Row>\n';
      noteRow.forEach(cell => {
        xml += cellXml(cell, i === 0 ? 'Header' : 'Name', true);
      });
      xml += '</Row>\n';
    });
    xml += '</Table>\n</Worksheet>\n</Workbook>';

    const blob = new Blob([xml], { type: 'application/vnd.ms-excel' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const courseName = document.querySelector('.hdr .sub')?.textContent?.trim() || 'Course';
    a.download = 'Forum_Matrix_' + courseName.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 30) + '_' + new Date().toISOString().split('T')[0] + '.xls';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    console.log('[ENG] Forum Matrix XLSX exported (' + students.length + ' students, ' + forums.length + ' forums)');
  } catch(e) {
    console.error('[ENG] XLSX export error:', e);
    alert('Excel export failed: ' + e.message);
  }
};

function escXml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Grades XLSX Export ──────────────────────────────────────── */
window.exportGradesXLSX = function exportGradesXLSX() {
  try {
    const panel = document.getElementById('p-grades');
    if (!panel) { alert('Grades panel not found.'); return; }
    const table = panel.querySelector('table');
    if (!table) { alert('Grades table not loaded yet. Please wait for data to load.'); return; }

    const headers = [];
    table.querySelectorAll('thead th').forEach(th => {
      headers.push(th.textContent.trim() || th.title || '');
    });

    const rows = [];
    table.querySelectorAll('tbody tr').forEach(tr => {
      const row = [];
      tr.querySelectorAll('td').forEach(td => {
        const text = td.textContent.trim();
        const num = parseFloat(text);
        row.push(isNaN(num) ? text : num);
      });
      if (row.length > 0) rows.push(row);
    });

    let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
    xml += '<?mso-application progid="Excel.Sheet"?>\n';
    xml += '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"\n';
    xml += '  xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n';
    xml += '<Styles>\n';
    xml += '  <Style ss:ID="Default"><Font ss:FontName="Calibri" ss:Size="11"/></Style>\n';
    xml += '  <Style ss:ID="Header"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#00416B" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:Vertical="Center"/></Style>\n';
    xml += '  <Style ss:ID="Num"><NumberFormat ss:Format="0.0"/><Alignment ss:Horizontal="Center"/></Style>\n';
    xml += '  <Style ss:ID="Name"><Font ss:FontName="Calibri" ss:Size="11"/></Style>\n';
    xml += '  <Style ss:ID="FERPA"><Font ss:FontName="Calibri" ss:Size="10" ss:Bold="1" ss:Color="#CC0000"/></Style>\n';
    xml += '</Styles>\n';
    xml += '<Worksheet ss:Name="Grades Overview">\n<Table>\n';

    // Header
    xml += '<Row>\n';
    headers.forEach(h => {
      xml += '  <Cell ss:StyleID="Header"><Data ss:Type="String">' + escXml(h) + '</Data></Cell>\n';
    });
    xml += '</Row>\n';

    // Data
    rows.forEach(row => {
      xml += '<Row>\n';
      row.forEach((cell, idx) => {
        if (idx === 0) {
          xml += '  <Cell ss:StyleID="Name"><Data ss:Type="String">' + escXml(String(cell)) + '</Data></Cell>\n';
        } else if (typeof cell === 'number') {
          xml += '  <Cell ss:StyleID="Num"><Data ss:Type="Number">' + cell + '</Data></Cell>\n';
        } else {
          xml += '  <Cell><Data ss:Type="String">' + escXml(String(cell)) + '</Data></Cell>\n';
        }
      });
      xml += '</Row>\n';
    });

    // Empty row then FERPA notice
    xml += '<Row></Row>\n';
    xml += '<Row>\n  <Cell ss:StyleID="FERPA"><Data ss:Type="String">Note: This information is protected by FERPA laws. Keep this information confidential.</Data></Cell>\n</Row>\n';

    xml += '</Table>\n</Worksheet>\n</Workbook>';

    const blob = new Blob([xml], { type: 'application/vnd.ms-excel' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const courseName = document.querySelector('.hdr .sub')?.textContent?.trim() || 'Course';
    a.download = 'Grades_' + courseName.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 30) + '_' + new Date().toISOString().split('T')[0] + '.xls';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    console.log('[ENG] Grades XLSX exported');
  } catch(e) {
    console.error('[ENG] Grades export error:', e);
    alert('Excel export failed: ' + e.message);
  }
};
