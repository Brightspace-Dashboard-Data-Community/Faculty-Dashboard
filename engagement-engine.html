<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Institution Engagement Dashboard for Faculty</title>
<!-- Privacy mask must load before engine fetches so classlist names are harvested -->
<script src="js/pii-mask.js"></script>
<script src="js/pdf-brand.js"></script>
<script src="js/ldaa-report.js"></script>
<!--
  ================================================================
  Institution ENGAGEMENT DASHBOARD FOR FACULTY — Brightspace Content Topic
  ================================================================
  DEPLOYMENT: Paste this entire HTML into a Brightspace Custom Widget
  (Course Home → Widgets → Create Widget → paste as HTML source).

  Brightspace automatically replaces these tokens at render time:
    {OrgUnitId}  → current course ID
    {UserId}     → current logged-in user's ID

  All API calls use RELATIVE paths so the user's existing
  Brightspace session cookies handle authentication. No external
  hosting, proxy, or additional API access is required.
  ================================================================
-->
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous" referrerpolicy="no-referrer">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ── Institution Brand Tokens ───────────────────────────────────────── */
:root{
  --db:#0f5b46;--lb:#2d9d7a;--gd:#10b981;--dg:#111111;--lg:#555555;
  --bg:#FCFFFD;--sf:#FFFFFF;
  --hf:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --bf:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --r:clamp(6px,1.2vw,10px);--sh:0 2px 8px rgba(0,65,107,.1);
  /* responsive base: 13px at 400px → 16px at 1200px */
  --fs:clamp(13px,0.8vw + 9.8px,16px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--fs);-webkit-font-smoothing:antialiased}
body{font-family:var(--bf);color:var(--dg);background:var(--bg);line-height:1.5}

/* ── Layout ─────────────────────────────────────────────────── */
.w{max-width:1100px;margin:0 auto;padding:clamp(10px,2vw,20px) clamp(8px,1.5vw,16px)}

/* Header */
.hdr{position:relative;display:flex;align-items:center;justify-content:space-between;gap:clamp(8px,1.5vw,16px);
  padding:clamp(12px,2vw,20px) clamp(14px,2.5vw,24px);background:var(--db);
  border-radius:var(--r);color:#fff;margin-bottom:clamp(12px,2vw,18px);box-shadow:var(--sh)}
.demo-pill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#EA0029;color:#fff;
  font-family:var(--hf);font-size:clamp(9px,1vw,11px);font-weight:700;letter-spacing:1.5px;
  padding:3px 14px;border-radius:999px;text-transform:uppercase;white-space:nowrap;
  box-shadow:0 2px 6px rgba(234,0,41,.4)}
.hdr .hl{display:flex;align-items:center;gap:clamp(8px,1.5vw,14px)}
.hdr .circ{width:clamp(34px,5vw,44px);height:clamp(34px,5vw,44px);background:var(--gd);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--hf);font-weight:700;font-size:clamp(12px,1.5vw,15px);color:var(--db);flex-shrink:0}
.hdr h1{font-family:var(--hf);font-weight:700;font-size:clamp(1rem,2vw,1.4rem);
  letter-spacing:.5px;text-transform:uppercase}
.hdr .sub{font-size:clamp(.65rem,1vw,.8rem);opacity:.85;margin-top:1px}
.hdr .hr{text-align:right;font-size:clamp(.65rem,1vw,.78rem);opacity:.9;white-space:nowrap}
.badge{display:inline-block;padding:clamp(2px,.4vw,3px) clamp(7px,1vw,11px);border-radius:12px;
  font-size:clamp(.58rem,.9vw,.7rem);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.badge-i{background:var(--gd);color:var(--db)}
.badge-s{background:var(--lb);color:#fff}
@media(max-width:520px){
  .hdr{flex-direction:column;text-align:center;padding:10px 12px}
  .hdr .hl{justify-content:center}
  .hdr .hr{text-align:center;white-space:normal}
  .demo-pill{position:static;transform:none;margin:6px 0 2px;display:inline-block}
  .tab-groups{flex-wrap:wrap}
  .tab-group{flex:1;text-align:center;font-size:clamp(.6rem,.9vw,.72rem);padding:6px 8px}
}

/* Tab Groups — top row */
.tab-groups{display:flex;gap:0;margin-bottom:0}
.tab-group{padding:clamp(7px,1.2vw,11px) clamp(14px,2.5vw,22px);font-family:var(--hf);font-size:clamp(.72rem,1.1vw,.9rem);
  font-weight:600;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;
  background:#E8ECF0;color:var(--dg);border-radius:6px 6px 0 0;transition:.2s ease;
  border:2px solid transparent;border-bottom:none;margin-right:2px;white-space:nowrap}
.tab-group:hover{background:#D0D5DD}
.tab-group.active{background:var(--db);color:#fff}

/* Tab Items — second row */
.tabs{display:flex;gap:clamp(4px,.8vw,8px);margin-bottom:clamp(12px,2vw,18px);flex-wrap:wrap;
  padding:clamp(8px,1.2vw,12px) clamp(6px,1vw,10px);background:var(--bg);border-radius:0 0 var(--r) var(--r);
  border:1px solid #E8ECF0;border-top:none}
.tab{padding:clamp(4px,.8vw,7px) clamp(8px,1.5vw,14px);border-radius:5px;font-size:clamp(.66rem,1vw,.82rem);font-weight:600;
  cursor:pointer;border:2px solid transparent;background:var(--sf);color:var(--dg);
  transition:.2s ease;box-shadow:var(--sh)}
.tab:hover{border-color:var(--lb)}
.tab.active{background:var(--lb);color:#fff;border-color:var(--lb)}

/* Panels */
.panel{display:none}.panel.active{display:block}

/* KPI row */
.kr{display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(140px,20vw,200px),1fr));gap:clamp(8px,1.5vw,14px);margin-bottom:clamp(12px,2vw,18px)}
.kc{background:var(--sf);border-radius:var(--r);padding:clamp(10px,1.8vw,18px) clamp(12px,2vw,20px);
  box-shadow:var(--sh);border-top:3px solid var(--lb);transition:.2s}
.kc:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,65,107,.15)}
.kc.gold{border-top-color:var(--gd)}.kc.dark{border-top-color:var(--db)}
.kc .kl{font-size:clamp(.6rem,.9vw,.75rem);text-transform:uppercase;letter-spacing:.5px;
  color:var(--lg);font-weight:600;margin-bottom:2px}
.kc .kv{font-family:var(--hf);font-size:clamp(1.3rem,2.5vw,2rem);font-weight:700;
  color:var(--db);line-height:1.1}
.kc .ks{font-size:clamp(.6rem,.9vw,.75rem);color:var(--lg);margin-top:2px}

/* Cards */
.cd{background:var(--sf);border-radius:var(--r);padding:clamp(12px,2vw,20px);
  box-shadow:var(--sh);margin-bottom:clamp(10px,1.8vw,16px)}
.cd h3{font-family:var(--hf);font-size:clamp(.78rem,1.2vw,1rem);text-transform:uppercase;
  letter-spacing:.4px;color:var(--db);margin-bottom:clamp(8px,1.5vw,14px);
  padding-bottom:6px;border-bottom:2px solid var(--gd)}

/* Chart grid */
.cg{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.8vw,16px);margin-bottom:clamp(10px,1.8vw,16px)}
@media(max-width:700px){.cg{grid-template-columns:1fr}}
.cg .cd canvas{width:100%!important}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:clamp(.72rem,1vw,.88rem)}
thead th{text-align:left;padding:clamp(5px,1vw,9px) clamp(6px,1vw,10px);font-weight:700;font-size:clamp(.62rem,.9vw,.76rem);
  text-transform:uppercase;letter-spacing:.5px;color:var(--lg);
  border-bottom:2px solid #E8ECF0}
tbody td{padding:clamp(6px,1.2vw,10px) clamp(6px,1vw,10px);border-bottom:1px solid #F0F2F5}
tbody tr:hover{background:#F8FAFC}

.pill{display:inline-block;padding:clamp(2px,.3vw,3px) clamp(6px,1vw,10px);border-radius:10px;
  font-size:clamp(.6rem,.9vw,.75rem);font-weight:600}
.pg{background:#E6F9F0;color:#1B8C5A}
.py{background:#FFF8E1;color:#B5880A}
.pr{background:#FDECEA;color:#C0392B}
.pb{background:#E8F4FD;color:#00416B}

/* Interaction tracker */
.it-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(180px,25vw,260px),1fr));gap:clamp(8px,1.2vw,12px)}
.it-card{display:flex;align-items:center;gap:clamp(8px,1.2vw,12px);padding:clamp(8px,1.2vw,12px) clamp(10px,1.5vw,14px);
  border-radius:8px;border:1px solid #E8ECF0;transition:.2s}
.it-card:hover{box-shadow:0 2px 8px rgba(0,65,107,.1)}
.it-card.tier-high{border-left:3px solid #1B8C5A;background:#FAFFF8}
.it-card.tier-mid{border-left:3px solid #FED925;background:#FFFDE6}
.it-card.tier-low{border-left:3px solid #EA0029;background:#FFF5F5}
.it-card.tier-none{border-left:3px solid #EA0029;background:#FFFAFA}
.it-av{width:clamp(28px,4vw,38px);height:clamp(28px,4vw,38px);border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-weight:700;
  font-size:clamp(.62rem,1vw,.78rem);flex-shrink:0;color:#fff}
.it-card.tier-high .it-av{background:#1B8C5A;color:#fff}
.it-card.tier-mid .it-av{background:#FED925;color:#333}
.it-card.tier-low .it-av{background:#EA0029;color:#fff}
.it-card.tier-none .it-av{background:var(--lg)}
.it-name{font-weight:600;font-size:clamp(.74rem,1.1vw,.9rem);color:var(--dg)}
.it-detail{font-size:clamp(.62rem,.9vw,.75rem);color:var(--lg)}
.it-status{font-size:clamp(.6rem,.9vw,.74rem);font-weight:600;margin-left:auto;white-space:nowrap}
.it-status.s-high{color:#1B8C5A}.it-status.s-mid{color:#B5880A}.it-status.s-low{color:#EA0029}.it-status.s-none{color:#EA0029}

/* Scoreboard */
.sb-wrap{display:flex;gap:clamp(10px,1.5vw,16px);flex-wrap:wrap}
/* Forum scoreboards container — let each .sb-forum take its natural
   min-width and wrap into multiple rows. Previously they stretched to
   fill a single column, which made tall narrow lists; the grid lets
   them stack 2–4 across depending on viewport width. */
#scoreboardWrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:clamp(10px,1.5vw,16px)}
.sb-forum{border:1px solid #E8ECF0;border-radius:10px;overflow:hidden}
.sb-forum-hdr{background:var(--db);color:#fff;padding:clamp(8px,1vw,12px) clamp(10px,1.5vw,14px);
  font-family:var(--hf);font-size:clamp(.72rem,1vw,.88rem);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sb-forum-hdr a{color:#fff;text-decoration:none}
.sb-forum-hdr .sb-count{font-size:clamp(.6rem,.85vw,.72rem);opacity:.8;font-weight:400}
.sb-row{display:flex;align-items:center;gap:clamp(6px,1vw,10px);padding:clamp(5px,.8vw,8px) clamp(10px,1.5vw,14px);
  border-bottom:1px solid #F3F4F6;font-size:clamp(.68rem,.95vw,.82rem)}
.sb-row:last-child{border-bottom:none}
.sb-rank{width:clamp(18px,2.5vw,24px);height:clamp(18px,2.5vw,24px);border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:clamp(.55rem,.8vw,.68rem);flex-shrink:0}
.sb-rank.r1{background:#FED925;color:#333}.sb-rank.r2{background:#C0C0C0;color:#333}.sb-rank.r3{background:#CD7F32;color:#fff}
.sb-rank.rn{background:#E8ECF0;color:var(--dg)}
.sb-name{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-bar-wrap{width:clamp(60px,8vw,100px);height:6px;background:#E8ECF0;border-radius:3px;flex-shrink:0}
.sb-bar{height:100%;border-radius:3px;transition:width .3s}
.sb-total{font-weight:700;color:var(--db);min-width:clamp(22px,3vw,32px);text-align:right;font-size:clamp(.65rem,.9vw,.78rem)}

/* Filter bar */
.fbar{display:flex;gap:clamp(6px,1vw,10px);margin-bottom:clamp(8px,1.5vw,14px);flex-wrap:wrap;align-items:center}
.fbar input{padding:clamp(5px,.8vw,8px) clamp(8px,1.2vw,12px);border:1px solid #D0D5DD;border-radius:6px;
  font-size:clamp(.72rem,1vw,.88rem);flex:1;max-width:300px;font-family:var(--bf)}
.fbar select{padding:clamp(5px,.8vw,8px) clamp(6px,1vw,10px);border:1px solid #D0D5DD;border-radius:6px;
  font-size:clamp(.72rem,1vw,.88rem);font-family:var(--bf);background:var(--sf)}
.fbar .count{font-size:clamp(.65rem,.9vw,.78rem);color:var(--lg);margin-left:auto}

/* Discussion feed */
.di{display:flex;gap:clamp(8px,1.2vw,12px);padding:clamp(8px,1.2vw,12px) 0;border-bottom:1px solid #F0F2F5}
.di:last-child{border-bottom:none}
.da{width:clamp(28px,4vw,36px);height:clamp(28px,4vw,36px);border-radius:50%;background:var(--lb);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;
  font-size:clamp(.62rem,1vw,.76rem);flex-shrink:0}
.dt{font-weight:600;font-size:clamp(.74rem,1.1vw,.9rem);color:var(--db)}
a.dt{transition:.15s ease}
a.dt:hover{color:var(--lb);text-decoration:underline!important}
.dm{font-size:clamp(.62rem,.9vw,.76rem);color:var(--lg);margin-top:1px}

/* Loading */
.ldg{text-align:center;padding:clamp(30px,6vw,60px) 20px}
.ldg .sp{width:clamp(28px,4vw,40px);height:clamp(28px,4vw,40px);margin:0 auto 14px;
  border:4px solid #E8ECF0;border-top-color:var(--lb);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ldg p{color:var(--lg);font-size:clamp(.78rem,1.1vw,.92rem);transition:opacity .3s ease}

/* Refresh button */
.btn-refresh,.btn-print{display:inline-flex;align-items:center;gap:6px;padding:clamp(5px,.8vw,8px) clamp(10px,1.5vw,16px);
  border-radius:6px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);
  color:#fff;font-family:var(--bf);font-size:clamp(.65rem,1vw,.78rem);font-weight:600;
  cursor:pointer;transition:.2s ease;white-space:nowrap}
.btn-refresh:hover,.btn-print:hover{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.6)}
.btn-refresh:active,.btn-print:active{transform:scale(.96)}
.btn-refresh.loading{opacity:.7;pointer-events:none}
.btn-refresh svg,.btn-print svg{width:14px;height:14px}
.btn-refresh svg{transition:transform .3s}
.btn-refresh.loading svg{animation:spin .8s linear infinite}

/* Tab explanation blocks */
.tab-explain{font-size:clamp(.72rem,1vw,.84rem);color:var(--lg);background:#e8f5f0;border-left:3px solid var(--lb);
  padding:10px 14px;border-radius:8px;margin:8px 0 14px;line-height:1.45}
.tab-explain strong{color:var(--db)}
.tab-explain .tab-legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:8px;font-size:.78em}
.tab-explain .tab-legend span{display:inline-flex;align-items:center;gap:5px}

/* Forum Matrix Table */
.fm-table{width:100%;border-collapse:collapse;font-size:clamp(.68rem,.95vw,.82rem);overflow-x:auto;
  display:block;overflow-y:visible;overflow-x:auto}
.fm-table thead{background:var(--db);color:#fff;position:sticky;top:0;z-index:10}
.fm-table thead th{padding:clamp(8px,1.2vw,12px) clamp(6px,1vw,10px);text-align:center;font-weight:700;
  font-size:clamp(.62rem,.9vw,.76rem);text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid #003d5c}
.fm-table thead th.fm-th-icon{width:28px;min-width:28px;padding:0 2px;font-size:clamp(.55rem,.8vw,.68rem)}
.fm-table thead th.fm-th-fac{position:sticky;left:0;background:var(--db);z-index:12}
.fm-table thead th.fm-th-stu{position:sticky;left:28px;background:var(--db);z-index:12}
.fm-table thead th.fm-th-name{text-align:left;position:sticky;left:56px;background:var(--db);z-index:11}
.fm-table tbody td{padding:clamp(6px,1.2vw,10px) clamp(6px,1vw,10px);border-bottom:1px solid #F0F2F5;
  text-align:center;font-weight:400}
.fm-table .fm-cell-icon{width:28px;min-width:28px;padding:2px!important;text-align:center;
  background:var(--sf);z-index:9}
.fm-table .fm-cell-icon.fm-fac{position:sticky;left:0}
.fm-table .fm-cell-icon.fm-stu{position:sticky;left:28px}
.fm-table tbody td.fm-cell-name{position:sticky;left:56px;background:var(--sf);font-weight:600;color:var(--db);
  text-align:left;z-index:9;border-right:2px solid #E8ECF0;white-space:nowrap}
.fm-table tbody tr:hover td{background:#F8FAFC}
.fm-table tbody tr:hover .fm-cell-icon,.fm-table tbody tr:hover td.fm-cell-name{background:#F8FAFC}
.fm-table .fm-pct-row td{font-weight:700;color:var(--db);background:#FCFFFD;border-top:2px solid var(--db)}
.fm-table .fm-pct-row .fm-cell-icon,.fm-table .fm-pct-row td.fm-cell-name{background:#FCFFFD}
.fm-table .fm-cell-num{font-weight:600;color:var(--db)}
.fm-table .fm-cell-num a{color:var(--db);text-decoration:none;font-weight:700}
.fm-table .fm-cell-num a:hover{color:var(--lb);text-decoration:underline}
.fm-table .fm-cell-dual{font-size:clamp(.6rem,.85vw,.72rem);line-height:1.35}
.fm-table .fm-cell-dual a{text-decoration:none}
.fm-table .fm-cell-dual .fm-fac-n{color:var(--db);font-weight:700}
.fm-table .fm-cell-dual .fm-stu-n{color:#1B8C5A;font-weight:600}
.fm-table .fm-cell-pct{font-weight:700;padding:clamp(5px,1vw,8px) clamp(4px,.8vw,8px)}
.fm-table .fm-pct-100{background:#1B8C5A;color:#fff;border-radius:4px}
.fm-table .fm-pct-0{background:#EA0029;color:#fff;border-radius:4px}
.fm-table .fm-pct-mid{background:var(--gd);color:#333;border-radius:4px}
.fm-icon{font-size:clamp(.85rem,1.2vw,1.1rem);cursor:default}
.fm-wrap{display:flex;flex-direction:column;overflow-x:auto}

/* Discussion interaction calendar */
.dc-legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin:0 0 12px;font-size:clamp(.65rem,.9vw,.78rem);color:var(--lg)}
.dc-legend span{display:inline-flex;align-items:center;gap:5px}
.dc-swatch{width:10px;height:10px;border-radius:2px;display:inline-block}
.dc-swatch.instr{background:var(--db)}
.dc-swatch.peer{background:#2d9d7a}
.dc-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.dc-filters label{font-size:clamp(.68rem,.95vw,.8rem);color:var(--dg);display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.dc-day-list{margin-top:14px;border-top:1px solid #E8ECF0;padding-top:12px}
.dc-day-list h4{font-family:var(--hf);font-size:clamp(.78rem,1.1vw,.92rem);color:var(--db);margin-bottom:8px}
.dc-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #F0F2F5;font-size:clamp(.7rem,1vw,.84rem)}
.dc-item:last-child{border-bottom:none}
.dc-badge{flex-shrink:0;font-size:clamp(.55rem,.8vw,.65rem);font-weight:700;text-transform:uppercase;letter-spacing:.3px;
  padding:2px 6px;border-radius:4px;height:fit-content}
.dc-badge.instr{background:var(--db);color:#fff}
.dc-badge.peer{background:#e8f5f0;color:#0f5b46}
.dc-item a{color:var(--db);font-weight:600;text-decoration:none}
.dc-item a:hover{color:var(--lb);text-decoration:underline}
.dc-meta{color:var(--lg);font-size:.9em;margin-top:2px}
.cal-pill.dc-instr{background:var(--db);color:#fff}
.cal-pill.dc-peer{background:#2d9d7a;color:#fff}
.cal-day.has-dc{cursor:pointer}
.cal-day.has-dc:hover{border-color:var(--lb);box-shadow:0 0 0 1px var(--lb)}

/* Assignment tabs */
.asn-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:0 0 14px}
.asn-kpi .kc{padding:10px 12px}
.asn-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:0 0 12px;font-size:clamp(.65rem,.9vw,.78rem);color:var(--lg)}
.asn-legend span{display:inline-flex;align-items:center;gap:5px}
.asn-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.asn-dot.none{background:#d1d5db}
.asn-dot.submitted{background:#b5880a}
.asn-dot.draft{background:#3CB4E5}
.asn-dot.published{background:#1B8C5A}
.asn-dot.missing{background:#EA0029}
.asn-status-cell{font-size:clamp(.55rem,.8vw,.68rem);font-weight:700;padding:6px 4px!important}
.asn-status-cell a{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.asn-status-cell .asn-dot{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.asn-status-cell a:hover .asn-dot{transform:scale(1.15);box-shadow:0 0 0 2px rgba(15,91,70,.25)}
.asn-queue{display:flex;flex-direction:column;gap:0}
.asn-queue-item{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid #F0F2F5;font-size:clamp(.72rem,1vw,.86rem)}
.asn-queue-item:last-child{border-bottom:none}
.asn-queue-item .asn-q-main{flex:1;min-width:0}
.asn-queue-item .asn-q-title{font-weight:600;color:var(--db)}
.asn-queue-item .asn-q-meta{color:var(--lg);font-size:.9em;margin-top:2px}
.asn-queue-item a.asn-q-link{flex-shrink:0;font-size:.78em;font-weight:600;color:var(--lb);text-decoration:none;padding:4px 10px;border:1px solid var(--lb);border-radius:6px}
.asn-queue-item a.asn-q-link:hover{background:var(--lb);color:#fff}
.asn-badge{font-size:clamp(.55rem,.8vw,.65rem);font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:2px 6px;border-radius:4px;flex-shrink:0}
.asn-badge.wait{background:#FFF8E1;color:#b5880a}
.asn-badge.draft{background:#E8F4FD;color:#1F5582}
.asn-badge.late{background:#FDECEA;color:#C0392B}
.cal-pill.asn-due{background:#b5880a;color:#fff}
.cal-pill.asn-sub{background:#3CB4E5;color:#fff}
.cal-pill.asn-graded{background:#1B8C5A;color:#fff}

/* Content Time grid */
.ct-cell{text-align:center;font-size:clamp(.62rem,.85vw,.75rem);padding:clamp(3px,.5vw,6px)}
.ct-cell.ct-high{background:#E8F5E9;color:#1B8C5A;font-weight:600}
.ct-cell.ct-mid{background:#FFF8E1;color:#B5880A;font-weight:600}
.ct-cell.ct-low{background:#FFEBEE;color:#EA0029;font-weight:600}
.ct-cell.ct-zero{background:#F9FAFB;color:#ccc}

/* Announcement items */
.ann-item{display:flex;align-items:center;gap:clamp(10px,1.5vw,14px);padding:clamp(10px,1.5vw,14px) 0;
  border-bottom:1px solid #F0F2F5}
.ann-item:last-child{border-bottom:none}
.ann-icon{width:clamp(32px,4vw,40px);height:clamp(32px,4vw,40px);border-radius:8px;background:var(--db);
  color:var(--gd);display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:clamp(.8rem,1.2vw,1rem)}
.ann-title{font-weight:600;font-size:clamp(.76rem,1.1vw,.9rem);color:var(--dg)}
.ann-meta{font-size:clamp(.62rem,.9vw,.76rem);color:var(--lg);margin-top:2px}
.ann-rate{margin-left:auto;text-align:center;flex-shrink:0}
.ann-rate .pct{font-family:var(--hf);font-size:clamp(1rem,1.6vw,1.3rem);font-weight:700}
.ann-rate .lbl{font-size:clamp(.55rem,.8vw,.65rem);color:var(--lg)}

/* Student Activity - Student selector */
.stu-sel-wrap{display:flex;align-items:center;gap:clamp(8px,1.5vw,14px);margin-bottom:clamp(10px,1.8vw,16px);flex-wrap:wrap}
.stu-sel-act{font-family:var(--bf);font-size:clamp(.72rem,1vw,.88rem);padding:clamp(5px,.8vw,8px) clamp(10px,1.5vw,14px);
  border:2px solid var(--db);border-radius:6px;background:var(--sf);color:var(--db);font-weight:600;
  cursor:pointer;min-width:200px;max-width:400px;transition:opacity .3s,background .3s,border-color .3s}
.stu-sel-act:disabled{opacity:.55;cursor:not-allowed;background:#E8ECF0;border-color:var(--lg);color:var(--lg)}

/* Calendar controls */
.cal-ctrl{display:flex;align-items:center;justify-content:space-between;margin-bottom:clamp(10px,1.8vw,16px);flex-wrap:wrap;gap:clamp(8px,1.5vw,14px)}
.cal-nav{display:flex;gap:clamp(6px,1vw,10px)}
.cal-nav button{display:inline-flex;align-items:center;gap:4px;padding:clamp(5px,.8vw,8px) clamp(10px,1.5vw,16px);
  border:1px solid #D0D5DD;border-radius:6px;background:var(--sf);color:var(--db);font-family:var(--bf);
  font-size:clamp(.65rem,1vw,.78rem);font-weight:600;cursor:pointer;transition:.2s}
.cal-nav button:hover{border-color:var(--db);background:var(--bg)}
.cal-month{font-family:var(--hf);font-size:clamp(.78rem,1.1vw,.95rem);font-weight:600;color:var(--db)}

/* Calendar grid */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(3px,.5vw,6px);margin-bottom:clamp(10px,1.8vw,16px)}
.cal-dow{text-align:center;font-weight:700;font-size:clamp(.62rem,.9vw,.75rem);color:var(--db);padding:clamp(6px,1vw,10px);
  text-transform:uppercase;letter-spacing:.3px}
.cal-day{min-height:clamp(60px,10vw,100px);border:1px solid #E8ECF0;border-radius:4px;padding:clamp(4px,.8vw,6px);
  font-size:clamp(.62rem,.9vw,.75rem);background:var(--sf);position:relative;overflow:hidden}
.cal-day.other{opacity:.4;background:#F9FAFB}
.cal-day.today{background:var(--gd);color:var(--db);font-weight:600}
.cal-day .day-num{font-weight:600;margin-bottom:clamp(2px,.4vw,4px)}
.cal-day .pills{display:flex;flex-direction:column;gap:clamp(1px,.2vw,2px)}
.cal-pill{display:inline-block;padding:clamp(2px,.3vw,3px) clamp(4px,.6vw,6px);border-radius:3px;
  font-size:clamp(.55rem,.8vw,.65rem);font-weight:600;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;background:var(--lb);color:#fff;cursor:pointer;transition:.2s}
.cal-pill:hover{opacity:.85}
.cal-more{display:inline-block;font-size:clamp(.55rem,.8vw,.65rem);color:var(--db);font-weight:600;
  cursor:pointer;margin-top:1px;padding:clamp(1px,.2vw,2px)}
.cal-more:hover{text-decoration:underline}

/* Student Activity Modal */
#calDayModal .cal-day-modal-content{background:var(--sf);border-radius:var(--r);padding:clamp(16px,2.5vw,28px);max-width:600px;width:90%;max-height:80vh;overflow-y:auto;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#calDayModal .cal-day-modal-close{position:absolute;top:clamp(8px,1.2vw,14px);right:clamp(8px,1.2vw,14px);background:var(--lb);color:#fff;border:none;border-radius:50%;width:28px;height:28px;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
#calDayModal .cal-day-modal-close:hover{background:var(--db)}
#calDayModal .cal-day-modal-title{font-family:var(--hf);font-size:clamp(.9rem,1.3vw,1.1rem);font-weight:700;color:var(--db);margin-bottom:clamp(10px,1.5vw,16px)}
#calDayModal .cal-day-modal-events{display:flex;flex-direction:column;gap:clamp(8px,1.2vw,12px)}
#saModal{display:none;position:fixed;z-index:2000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.5)}
#saModal.active{display:flex;align-items:center;justify-content:center}
.sa-modal-content{background:var(--sf);border-radius:var(--r);padding:clamp(16px,3vw,24px);
  max-width:600px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sa-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(12px,2vw,18px);
  padding-bottom:clamp(8px,1.5vw,12px);border-bottom:2px solid var(--gd)}
.sa-modal-header h3{font-family:var(--hf);font-size:clamp(.9rem,1.3vw,1.1rem);color:var(--db);text-transform:uppercase;
  letter-spacing:.3px;margin:0}
.sa-modal-close{background:none;border:none;font-size:1.5rem;color:var(--lg);cursor:pointer;padding:0;
  width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.sa-modal-close:hover{color:var(--db)}
.sa-modal-events{display:flex;flex-direction:column;gap:clamp(8px,1.5vw,12px)}
.sa-event-item{padding:clamp(8px,1.2vw,12px);border-left:3px solid var(--lb);background:var(--bg);
  border-radius:4px}
.sa-event-title{font-weight:600;font-size:clamp(.76rem,1.1vw,.9rem);color:var(--db)}
.sa-event-type{display:inline-block;margin-top:2px;padding:clamp(1px,.3vw,2px) clamp(4px,.6vw,6px);
  border-radius:3px;font-size:clamp(.55rem,.8vw,.65rem);font-weight:600;background:var(--lb);color:#fff}
.sa-event-time{font-size:clamp(.62rem,.9vw,.75rem);color:var(--lg);margin-top:3px}

/* Activity Table */
.at-table{width:100%;border-collapse:collapse;font-size:clamp(.7rem,.95vw,.85rem)}
.at-table thead th{background:var(--db);color:#fff;padding:clamp(8px,1.2vw,12px) clamp(6px,1vw,10px);
  text-align:left;font-weight:700;text-transform:uppercase;letter-spacing:.3px;
  border-bottom:2px solid #003d5c}
.at-table tbody td{padding:clamp(6px,1.2vw,10px) clamp(6px,1vw,10px);border-bottom:1px solid #E8ECF0}
.at-table tbody tr:hover{background:#F8FAFC}
.at-col-student{font-weight:600;color:var(--db)}
.at-col-status{text-align:center}
.at-status-badge{display:inline-block;padding:clamp(2px,.3vw,3px) clamp(6px,1vw,10px);border-radius:8px;
  font-size:clamp(.6rem,.9vw,.75rem);font-weight:600;white-space:nowrap}
.at-status-complete{background:#E6F9F0;color:#1B8C5A}
.at-status-partial{background:#FFF8E1;color:#B5880A}
.at-status-notstarted{background:#FFEBEE;color:#EA0029}

/* Student Detail Panel */
.detail-wrap{display:flex;flex-direction:column;gap:clamp(12px,2vw,18px)}
.detail-section{border:1px solid #E8ECF0;border-radius:6px;padding:clamp(12px,2vw,16px)}
.detail-section h4{font-family:var(--hf);font-size:clamp(.78rem,1.1vw,.95rem);color:var(--db);
  text-transform:uppercase;letter-spacing:.3px;margin-bottom:clamp(8px,1.5vw,12px);
  padding-bottom:6px;border-bottom:2px solid var(--gd)}
.detail-item{display:flex;justify-content:space-between;padding:clamp(6px,1vw,10px) 0;
  border-bottom:1px solid #F0F2F5;font-size:clamp(.72rem,1vw,.88rem)}
.detail-item:last-child{border-bottom:none}
.detail-label{color:var(--lg);font-weight:600}
.detail-value{color:var(--db);font-weight:600}

/* Tooltip */
.ccu-tip{position:fixed;z-index:9999;max-width:280px;padding:8px 12px;background:var(--db);color:#fff;
  font-family:var(--bf);font-size:clamp(.65rem,.9vw,.76rem);line-height:1.45;border-radius:6px;
  box-shadow:0 4px 16px rgba(0,65,107,.35);pointer-events:none;opacity:0;transition:opacity .15s ease;white-space:normal}
.ccu-tip.visible{opacity:1}
.ccu-tip::after{content:'';position:absolute;left:50%;transform:translateX(-50%);border:6px solid transparent}
.ccu-tip.above::after{top:100%;border-top-color:var(--db)}
.ccu-tip.below::after{bottom:100%;border-bottom-color:var(--db)}
[data-tip]{cursor:help}
thead th[data-tip]{cursor:pointer}

/* Footer */
.ft{display:flex;justify-content:space-between;align-items:center;font-size:clamp(.56rem,.8vw,.68rem);color:var(--lg);padding:clamp(4px,.8vw,8px) 0 2px}

/* ── Mobile Responsive ───────────────────────────────────── */
@media(max-width:768px){
  .w{padding:8px 6px}
  .tabs{gap:4px}
  .tab{padding:5px 10px;font-size:clamp(.65rem,1vw,.78rem)}
  .btn-refresh,.btn-print{padding:4px 8px;font-size:clamp(.6rem,.9vw,.72rem)}
  .btn-refresh svg,.btn-print svg{width:13px;height:13px}
  .fbar{gap:6px}
  .fbar select,.fbar input{font-size:clamp(.65rem,.9vw,.78rem);padding:4px 6px}
  .sb-wrap{min-width:160px;max-width:100%}
  .di{flex-direction:column;gap:4px}
  .fm-table th,.fm-table td{padding:3px 4px;font-size:clamp(.55rem,.8vw,.68rem)}
  .cg{grid-template-columns:1fr}
}
@media(max-width:480px){
  .kr{grid-template-columns:1fr 1fr}
  .cg{grid-template-columns:1fr}
  .cd{padding:10px}
  .it-grid{grid-template-columns:1fr}
  .ft{flex-direction:column;text-align:center;gap:2px}
  .cal-grid{gap:2px}
  .cal-day{min-height:50px}
}

/* ═══════════════════════════════════════════════════════════════
   GRADING HELPER — Migrated CSS
   ═══════════════════════════════════════════════════════════════ */
/* Scope grading helper sub-tabs */
#p-grading-helper .gh-tabs{display:flex;gap:0;margin-bottom:clamp(12px,2vw,20px)}
#p-grading-helper .gh-tab{padding:clamp(6px,1vw,10px) clamp(12px,2vw,20px);font-family:var(--hf);font-size:clamp(.7rem,1vw,.85rem);font-weight:600;color:var(--lg);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
#p-grading-helper .gh-tab:hover{color:var(--db);background:rgba(0,65,107,.04)}
#p-grading-helper .gh-tab.active{color:var(--db);border-bottom-color:var(--gd)}
#p-grading-helper .gh-panel{display:none}
#p-grading-helper .gh-panel.active{display:block}

.pd-wrap{overflow-x:auto}
.pd-table{width:100%;border-collapse:collapse;font-size:clamp(.68rem,.95vw,.82rem)}
.pd-table thead{background:var(--db);color:#fff;position:sticky;top:0;z-index:10}
.pd-table thead th{padding:clamp(8px,1.2vw,12px) clamp(6px,1vw,10px);text-align:center;font-weight:700;
  font-size:clamp(.62rem,.9vw,.76rem);text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid #003d5c}
.pd-table thead th:first-child{text-align:left;position:sticky;left:0;background:var(--db);z-index:11;min-width:160px}
.pd-table tbody td{padding:clamp(6px,1.2vw,10px) clamp(6px,1vw,10px);border-bottom:1px solid #F0F2F5;
  text-align:center;font-weight:400}
.pd-table tbody td:first-child{position:sticky;left:0;background:var(--sf);font-weight:600;color:var(--db);
  text-align:left;z-index:9;border-right:2px solid #E8ECF0;white-space:nowrap}
.pd-table tbody tr:hover td{background:#F8FAFC}
.pd-table tbody tr:hover td:first-child{background:#F8FAFC}
.pd-table .pd-total{font-weight:700;color:var(--db);background:#F9FAFB}
.pd-table .pd-pct-row td{font-weight:700;color:var(--db);background:#FCFFFD;border-top:2px solid var(--db)}
.pd-table .pd-pct-row td:first-child{background:#FCFFFD}
.pd-cell-0{color:var(--lg)}
.pd-cell-num{font-weight:600;color:var(--db)}
.pd-pct-pill{display:inline-block;padding:clamp(2px,.3vw,3px) clamp(6px,1vw,10px);border-radius:10px;
  font-size:clamp(.6rem,.9vw,.75rem);font-weight:600}
.pd-pct-100{background:#1B8C5A;color:#fff;border-radius:4px}
.pd-pct-0{background:#EA0029;color:#fff;border-radius:4px}
.pd-pct-mid{background:var(--gd);color:#333;border-radius:4px}

/* Loading */
.ldg{text-align:center;padding:clamp(30px,6vw,60px) 20px}
.ldg .sp{width:clamp(28px,4vw,40px);height:clamp(28px,4vw,40px);margin:0 auto 14px;
  border:4px solid #E8ECF0;border-top-color:var(--lb);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ldg p{color:var(--lg);font-size:clamp(.78rem,1.1vw,.92rem)}

/* Refresh / Print buttons */
.btn-refresh,.btn-print{display:inline-flex;align-items:center;gap:6px;padding:clamp(5px,.8vw,8px) clamp(10px,1.5vw,16px);
  border-radius:6px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);
  color:#fff;font-family:var(--bf);font-size:clamp(.65rem,1vw,.78rem);font-weight:600;
  cursor:pointer;transition:.2s ease;white-space:nowrap}
.btn-refresh:hover,.btn-print:hover{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.6)}
.btn-refresh:active,.btn-print:active{transform:scale(.96)}
.btn-refresh.loading{opacity:.7;pointer-events:none}
.btn-refresh svg,.btn-print svg{width:14px;height:14px}
.btn-refresh svg{transition:transform .3s}
.btn-refresh.loading svg{animation:spin .8s linear infinite}

/* Student selector */
.stu-sel{display:flex;align-items:center;gap:clamp(8px,1.5vw,14px);margin-bottom:clamp(12px,2vw,18px);flex-wrap:wrap}
.stu-sel label{font-family:var(--hf);font-size:clamp(.78rem,1.2vw,1rem);font-weight:600;color:var(--db);
  text-transform:uppercase;letter-spacing:.4px}
.stu-sel select{padding:clamp(6px,1vw,10px) clamp(10px,1.5vw,16px);border:2px solid #D0D5DD;border-radius:6px;
  font-size:clamp(.75rem,1.1vw,.9rem);font-family:var(--bf);background:var(--sf);color:var(--dg);
  min-width:240px;cursor:pointer;transition:.2s}
.stu-sel select:focus{border-color:var(--lb);outline:none;box-shadow:0 0 0 3px rgba(60,180,229,.2)}

/* Feedback Summary Table */
.fb-wrap{overflow-x:auto;margin-top:clamp(8px,1.5vw,14px)}
.fb-table{width:100%;border-collapse:collapse;font-size:clamp(.6rem,.8vw,.74rem);table-layout:auto}
.fb-table col.fb-col-score{width:clamp(40px,4vw,55px)}
.fb-table col.fb-col-fb{width:auto}
.fb-table thead{background:var(--db);color:#fff;position:sticky;top:0;z-index:10}
.fb-table thead th{padding:clamp(4px,.6vw,8px) clamp(3px,.5vw,6px);text-align:center;font-weight:700;
  font-size:clamp(.55rem,.75vw,.68rem);text-transform:uppercase;letter-spacing:.3px;
  border-bottom:2px solid #003d5c;border-right:1px solid rgba(255,255,255,.2);vertical-align:middle}
.fb-table thead th.fb-asn-hdr{border-left:3px solid rgba(255,255,255,.4);border-right:3px solid rgba(255,255,255,.4);
  text-align:center;font-size:clamp(.55rem,.78vw,.7rem);padding:clamp(4px,.5vw,6px) clamp(2px,.4vw,4px)}
.fb-table thead th.fb-sub-hdr{font-size:clamp(.48rem,.65vw,.58rem);font-weight:600;letter-spacing:.2px;
  opacity:.85;padding:clamp(2px,.3vw,4px) clamp(2px,.4vw,4px)}
.fb-table thead th.fb-sub-score{border-left:3px solid rgba(255,255,255,.4)}
.fb-table thead th.fb-sub-fb{border-right:3px solid rgba(255,255,255,.4)}

/* Data cells */
.fb-table tbody td{padding:clamp(3px,.5vw,6px) clamp(3px,.5vw,6px);border-bottom:1px solid #E0E4EA;
  vertical-align:top;font-size:clamp(.58rem,.78vw,.72rem);line-height:1.4;word-wrap:break-word;
  border-right:1px solid #E0E4EA}
.fb-table tbody td.fb-score-cell{text-align:center;font-weight:700;font-size:clamp(.58rem,.78vw,.72rem);
  white-space:nowrap;min-width:38px}
.fb-table tbody td.fb-asn-divider{border-left:3px solid #C0C8D4}
.fb-table tbody tr:hover td{background:#F8FAFC}
.fb-table tbody tr:hover td.fb-score-high{background:#D7EED9!important}
.fb-table tbody tr:hover td.fb-score-mid{background:#FFF3CC!important}
.fb-table tbody tr:hover td.fb-score-low{background:#FFDDE0!important}

/* Overall feedback header + row */
.fb-overall-hdr td{background:#FFF8E1!important;border-top:2px solid var(--gd);font-family:var(--hf);
  font-weight:700;color:#B5880A;text-transform:uppercase;letter-spacing:.4px;
  font-size:clamp(.58rem,.82vw,.72rem);padding:clamp(4px,.5vw,6px) clamp(6px,1vw,10px)}
.fb-overall td{background:#FFFDF5!important;border-bottom:1px solid #F0E6C0}

/* Empty feedback cell */
.fb-empty{color:var(--lg);font-style:italic;font-size:clamp(.6rem,.85vw,.72rem)}

/* Feedback text cell */
.fb-text{color:var(--dg)}

/* Score-based cell backgrounds — applies to BOTH score and feedback cells in the pair */
.fb-score-high{background:#E8F5E9!important}
.fb-score-mid{background:#FFF8E1!important}
.fb-score-low{background:#FFEBEE!important}
.fb-score-none{background:#FCFFFD!important}

/* No data message */
.fb-nodata{text-align:center;padding:clamp(20px,4vw,40px);color:var(--lg);font-size:clamp(.78rem,1.1vw,.92rem)}

/* ── Missing Grades Table ───────────────────────────────────── */
.mg-wrap{overflow-x:auto;margin-top:clamp(8px,1.5vw,14px)}
.mg-table{width:100%;border-collapse:collapse;font-size:clamp(.62rem,.88vw,.76rem);table-layout:auto}
.mg-table thead{background:var(--db);color:#fff;position:sticky;top:0;z-index:10}
.mg-table thead th{padding:clamp(6px,1vw,10px) clamp(4px,.7vw,6px);text-align:center;font-weight:700;

  --hf: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --bf: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --sh: none;
  font-family: var(--bf);
  color: var(--dg);
  background: transparent !important;
}
body.bsp-embed .cd {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  box-shadow: none;
}
/* 1-on-1 view: wrapper owns the title; flatten card chrome inside the panel */
body.bsp-embed.bsp-view-oneonone .cd {
  background: transparent;
  border: none;
  border-radius: 0;
  box-shadow: none;
  padding: 0;
  margin: 0;
}
body.bsp-embed.bsp-view-oneonone .cd h3 {
  display: none;
}
body.bsp-embed .oo-kpi {
  background: transparent;
  border: none;
  border-left: none;
  border-radius: 0;
  box-shadow: none;
  padding: 0;
}
body.bsp-embed .oo-section-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.125rem;
  flex-shrink: 0;
  color: #111111;
  font-size: 0.95rem;
}
body.bsp-embed .oo-section-icon i {
  color: #111111;
}
body.bsp-embed .oo-kpi-cell .oo-kpi-label {
  color: var(--lg);
  font-weight: 700;
}
body.bsp-embed .oo-kpi-cell .oo-kpi-value {
  font-family: var(--hf);
  color: var(--db);
}
body.bsp-embed .oo-kpi-cell.good .oo-kpi-value { color: #0f5b46; }
body.bsp-embed .oo-kpi-cell.warn .oo-kpi-value { color: #b5880a; }
body.bsp-embed .oo-kpi-cell.bad  .oo-kpi-value { color: #dc2626; }
body.bsp-embed .needs-reply-badge {
  background: #dc2626 !important;
}
body.bsp-embed .oo-calc-spinner {
  border-color: #bfe5d7;
  border-top-color: var(--db);
}
body.bsp-embed.bsp-view-oneonone #p-one-on-one .panel,
body.bsp-embed.bsp-view-oneonone #p-one-on-one {
  padding-top: 0 !important;
}
/* 1-on-1 activity layout: compact toolbar, KPI cards, tabbed thread lists */
.oo-toolbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px 20px;
  flex-wrap: wrap;
  margin: 0 0 14px;
}
.oo-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  list-style: none;
  margin: 0;
  padding: 0;
  font-size: .75rem;
  color: var(--lg);
}
.oo-legend li { display: inline-flex; align-items: center; }
.oo-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  flex-shrink: 0;
}
.oo-dot-active { background: #0f5b46; }
.oo-dot-stale { background: #b5880a; }
.oo-dot-inactive { background: #dc2626; border-radius: 2px; }
.oo-help {
  font-size: .8rem;
  color: var(--lg);
  max-width: 34rem;
}
.oo-help summary {
  cursor: pointer;
  color: var(--db);
  font-weight: 600;
  list-style: none;
}
.oo-help summary::-webkit-details-marker { display: none; }
.oo-help summary::after { content: " ▾"; font-weight: 400; }
.oo-help[open] summary::after { content: " ▴"; }
.oo-help-body {
  margin-top: 8px;
  padding: 10px 12px;
  background: #f8fafc;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  line-height: 1.5;
}
.oo-help-body p { margin: 0; }
.oo-kpi {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin: 0 0 16px;
  padding: 0;
  background: none;
  border: none;
  border-radius: 0;
}
.oo-kpi-cell {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 14px 16px;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
}
.oo-kpi-cell .oo-kpi-label {
  font-size: .65rem;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--lg);
  font-weight: 700;
}
.oo-kpi-cell .oo-kpi-value {
  font-family: var(--hf);
  font-size: clamp(1.35rem, 2.2vw, 1.7rem);
  font-weight: 700;
  color: var(--db);
  line-height: 1.1;
  margin-top: 4px;
}
.oo-kpi-cell .oo-kpi-sub {
  font-size: .72rem;
  color: var(--lg);
  margin-top: 4px;
  line-height: 1.35;
}
.oo-kpi-cell.warn .oo-kpi-value { color: #B5880A; }
.oo-kpi-cell.bad  .oo-kpi-value { color: #EA0029; }
.oo-kpi-cell.good .oo-kpi-value { color: #1B8C5A; }
.oo-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 4px;
  margin: 0 0 12px;
  background: #f3f4f6;
  border-radius: 10px;
}
.oo-tab {
  flex: 1 1 160px;
  border: none;
  background: transparent;
  padding: 10px 12px;
  border-radius: 8px;
  font: inherit;
  font-size: .82rem;
  font-weight: 600;
  color: #374151;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.oo-tab:hover { background: rgba(15, 91, 70, 0.08); }
.oo-tab.is-active {
  background: var(--db);
  color: #fff;
}
.oo-tab:focus-visible {
  outline: 2px solid var(--db);
  outline-offset: 2px;
}
.oo-tab-count {
  display: inline-flex;
  min-width: 1.25rem;
  padding: 0 6px;
  border-radius: 999px;
  font-size: .7rem;
  font-weight: 700;
  background: #e5e7eb;
  color: #374151;
}
.oo-tab-count.has-items {
  background: var(--db);
  color: #fff;
}
.oo-tab.is-active .oo-tab-count,
.oo-tab.is-active .oo-tab-count.has-items {
  background: #fff;
  color: var(--db);
}
.oo-panel-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.oo-panel-desc {
  margin: 0;
  font-size: .8rem;
  color: var(--lg);
}
.oo-analysis-pill {
  display: none;
  background: #f8fafc;
  color: var(--db);
  padding: 3px 10px;
  border-radius: 999px;
  font-size: .72rem;
  font-weight: 600;
  border: 1px solid #e5e7eb;
}
.oo-empty {
  padding: 28px 16px;
  text-align: center;
  color: var(--lg);
  font-size: .88rem;
  background: #f8fafc;
  border: 1px dashed #e5e7eb;
  border-radius: 10px;
}
.oo-empty-title {
  margin: 0 0 4px;
  font-size: 1rem;
  font-weight: 700;
  color: var(--dg);
}
.oo-empty-sub { margin: 0; }
.oo-table {
  width: 100%;
  border-collapse: collapse;
  font-size: .82rem;
}
.oo-table th {
  text-align: left;
  padding: 10px 12px;
  font-weight: 700;
  color: var(--dg);
  background: #f8fafc;
  border-bottom: 1px solid #e5e7eb;
}
.oo-table th.num,
.oo-table td.num { text-align: center; }
.oo-table td {
  padding: 10px 12px;
  border-bottom: 1px solid #e5e7eb;
  vertical-align: middle;
}
.oo-table tbody tr:last-child td { border-bottom: none; }
.oo-status {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: .72rem;
  font-weight: 700;
  color: #fff;
}
.oo-open-link {
  color: var(--lb);
  font-weight: 700;
  font-size: .78rem;
  text-decoration: none;
}
.oo-open-link:hover { text-decoration: underline; }
@media (max-width: 720px) {
  .oo-kpi { grid-template-columns: 1fr; }
}

/* Calculating overlay — sits over the KPI banner + tables while the
   closure analyzer is running. Hides itself when the analyzer is
   done (or determines there's nothing to analyze). Lives inside a
   position:relative wrapper that surrounds the data section. */
#oneOnOneDataWrap { position: relative; min-height: 140px; }
.oo-calc-overlay {
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0.94);
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: opacity .3s ease;
}
.oo-calc-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}
.oo-calc-spinner {
  width: 56px;
  height: 56px;
  border: 5px solid #C5DEEF;
  border-top-color: var(--db);
  border-radius: 50%;
  animation: oo-calc-spin 0.9s linear infinite;
}
.oo-calc-overlay .oo-calc-msg {
  margin-top: 16px;
  font-family: var(--hf);
  font-size: 1rem;
  color: var(--db);
  font-weight: 700;
  letter-spacing: 0.5px;
}
.oo-calc-overlay .oo-calc-sub {
  margin-top: 4px;
  font-size: .75rem;
  color: var(--lg);
}
@keyframes oo-calc-spin {
  to { transform: rotate(360deg); }
}

<script id="bsp-embed-bridge">
/* Embed-mode toggle + parent-iframe bridge. Mirrors the pattern
   used by tone-engine.html and accommodations-engine.html. When
   ?embed=1 is set, adds the .bsp-embed body class so the CSS rules
   above kick in, and posts the document's content height to the
   parent so the wrapper can resize the iframe (no second scrollbar). */
(function () {
  try {
    var params = new URLSearchParams(location.search || '');
    if (params.get('embed') !== '1') return;
    // ?view=oneonone — pulls just the 1-on-1 panel out of the engine
    // for the standalone "1-on-1 Discussion Activity" dashboard. The
    // dedicated wrapper (dashboards/one-on-one.html) appends this param
    // so the engine renders only the 1-on-1 data block, with the new
    // avg-time-to-response KPI banner above it.
    var view = params.get('view') || '';
    function applyBodyClasses() {
      document.body.classList.add('bsp-embed');
      if (view === 'oneonone') document.body.classList.add('bsp-view-oneonone');
    }
    if (document.body) {
      applyBodyClasses();
    } else {
      document.addEventListener('DOMContentLoaded', applyBodyClasses, { once: true });
    }
    function post(msg) {
      try { parent.postMessage(Object.assign({ source: 'bsp-engagement-engine' }, msg), '*'); }
      catch (e) {}
    }
    var lastReported = 0;
    function reportHeight() {
      var app = document.getElementById('app');
      var h = app ? app.offsetHeight : (document.body ? document.body.offsetHeight : 0);
      if (Math.abs(h - lastReported) < 4) return;
      lastReported = h;
      post({ type: 'height', height: h });
    }
    function attach() {
      reportHeight();
      try {
        if (typeof ResizeObserver === 'function') {
          var ro = new ResizeObserver(function () { reportHeight(); });
          var app = document.getElementById('app');
          if (app) ro.observe(app);
        }
      } catch (e) {}
      var start = Date.now();
      var iv = setInterval(function () {
        reportHeight();
        if (Date.now() - start > 30000) clearInterval(iv);
      }, 500);
      window.addEventListener('load', reportHeight);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', attach, { once: true });
    } else {
      attach();
    }
  } catch (e) { /* embed bridge is best-effort */ }
})();
</script>

<script>
(function(){
'use strict';

/* ═══════════════════════════════════════════════════════════════
   DEBUG CONSOLE — intercept console.log/warn/error with buffer
   ═══════════════════════════════════════════════════════════════ */
(function setupDebugConsole() {
  const _origLog = console.log;
  const _origWarn = console.warn;
  const _origError = console.error;
  window._debugCount = { log: 0, warn: 0, err: 0 };
  window._debugBuffer = [];

  function formatMsg(args) {
    return Array.from(args).map(a => {
      if (a instanceof Error) return a.message + (a.stack ? '\n' + a.stack.split('\n').slice(0,3).join('\n') : '');
      if (typeof a === 'object' && a !== null) try { return JSON.stringify(a, null, 1); } catch(e) { return String(a); }
      return String(a);
    }).join(' ');
  }

  function renderLine(el, type, ts, msg) {
    const colors = { log: '#8bc34a', warn: '#ffb74d', error: '#ef5350' };
    const prefix = { log: 'LOG', warn: 'WRN', error: 'ERR' };
    window._debugCount[type === 'error' ? 'err' : type]++;
    const line = document.createElement('div');
    line.style.borderBottom = '1px solid #262640';
    line.style.padding = '2px 0';
    line.innerHTML = '<span style="color:#666">' + ts + '</span> <span style="color:' + colors[type] + ';font-weight:bold">[' + prefix[type] + ']</span> ' + msg.replace(/</g, '&lt;').substring(0, 2000);
    el.appendChild(line);
  }

  function addDebugLine(type, args) {
    const ts = new Date().toLocaleTimeString('en-US', { hour12: false, hour:'2-digit', minute:'2-digit', second:'2-digit' });
    const msg = formatMsg(args);
    const el = document.getElementById('debug-log');
    if (!el) {
      window._debugBuffer.push({ type, ts, msg });
      return;
    }
    if (window._debugBuffer.length > 0) {
      for (const b of window._debugBuffer) renderLine(el, b.type, b.ts, b.msg);
      window._debugBuffer.length = 0;
    }
    renderLine(el, type, ts, msg);
    el.parentElement.scrollTop = el.parentElement.scrollHeight;
    const statsEl = document.getElementById('debug-stats');
    if (statsEl) statsEl.textContent = window._debugCount.log + ' logs \u00B7 ' + window._debugCount.warn + ' warnings \u00B7 ' + window._debugCount.err + ' errors';
  }

  window._flushDebugBuffer = function() {
    const el = document.getElementById('debug-log');
    if (el && window._debugBuffer.length > 0) {
      for (const b of window._debugBuffer) renderLine(el, b.type, b.ts, b.msg);
      window._debugBuffer.length = 0;
      el.parentElement.scrollTop = el.parentElement.scrollHeight;
      const statsEl = document.getElementById('debug-stats');
      if (statsEl) statsEl.textContent = window._debugCount.log + ' logs \u00B7 ' + window._debugCount.warn + ' warnings \u00B7 ' + window._debugCount.err + ' errors';
    }
  };

/* ═══════════════════════════════════════════════════════════════
   CLOSURE ANALYZER
   ═══════════════════════════════════════════════════════════════
   Decides whether a discussion message is a conversation closer
   (e.g. "thanks!", "got it", "understood") that doesn't actually
   require a reply from the instructor.

   Two layers:
     1. Heuristic — instant. Regex + length checks catch the bulk of
        obvious cases ("thanks", "i understand", short closing lines).
     2. ML — lazy-loaded. For ambiguous messages where the heuristic
        can't decide, we defer to a zero-shot NLI classifier that
        weighs "closing the conversation" vs "needing a reply".
        The model is fetched on demand; until then the heuristic's
        "uncertain" verdict falls back to "needs reply" so we never
        suppress a badge incorrectly.

   Results are cached per-session by message text so a re-render
   doesn't re-analyze. The model + its weights cache in the browser's
   IndexedDB on first use; subsequent sessions load instantly.
*/
// ── 1-on-1 stale-thread threshold ─────────────────────────────────
// Threads whose latest student message is older than this many days
// are treated as resolved for badge + KPI purposes. Lives at module
// scope so the analyzer, the render block, and the KPI banner all
// agree on the same cutoff.
//   • Per-row needs-reply badge → suppressed if stale
//   • Avg time-to-response KPI → stale-with-prior-reply counts as
//     closed at the instructor's last reply time (not as an open
//     thread inflating the metric)
//   • Closure analyzer → skips stale entries entirely (no point
//     ML-classifying a thread we're already calling resolved)
const OO_STALE_DAYS = 7;
function isOoStale(oo) {
  if (!oo || !oo.lastStudentDate) return false;
  return (Date.now() - new Date(oo.lastStudentDate).getTime()) / 86400000 > OO_STALE_DAYS;
}

const CLOSURE_ANALYZER = (function () {
  // ── Whole-message closure pattern ─────────────────────────────────
  // The entire message body BE the closure phrase ("thanks", "got it",
  // "no worries", etc.). Used for short messages where the closure
  // phrase is the whole content. Order matters only for readability.
  const CLOSURE_PHRASES = /^[\s.,!?:;'"\-]*(thanks?(?:\s+(?:you|a\s+lot|so\s+much|again|both|all))?|thank\s+you|ty\b|thx\b|got\s+it|i\s+understand|understood|noted|okay?|ok\b|alright|alrighty|copy\s+that|roger\s+that|appreciate(?:d|\s+it|\s+the\s+help|\s+that)?|sounds?\s+good|that\s+(?:makes\s+sense|works|helps|did\s+(?:it|the\s+trick))|makes\s+sense|works\s+for\s+me|that['']?s\s+(?:helpful|great|perfect|fine)|great|perfect|awesome|excellent|wonderful|will\s+do|i['']?ll\s+do\s+(?:that|so)|fixed\s+it|got\s+that|all\s+good|all\s+set|figured\s+it\s+out|got\s+it\s+now|it\s+worked|that\s+worked|no\s+worries|no\s+problem|np\b|np!|cheers|have\s+a\s+(?:good|great|nice|wonderful|blessed)\s+(?:day|week|weekend|night|one|evening)|see\s+you|talk\s+(?:soon|to\s+you\s+later)|catch\s+you\s+later|i\s+see)[\s.,!?:;'"\-]*$/i;

  // ── Leading-phrase closure / acknowledgment pattern ───────────────
  // Message STARTS with an acknowledgment ("Thank you for your grace
  // and flexibility", "I will try that", "I'll work on it tonight",
  // "I have reviewed the page", "I just wanted to let you know").
  //
  // Applied to text AFTER stripLeadingFiller() removes greetings and
  // short affirmatives so phrases like "Hello Professor, I have
  // reviewed…" and "Ok, will do!" still match.
  const CLOSURE_LEADING = /^[\s.,!?:;'"\-]*(thanks?\s+(?:you\s+)?(?:for|so\s+much|a\s+lot|again)\b|thank\s+you\s+(?:for|so\s+much|again)\b|i\s+(?:will|['']?ll)\s+(?:try|do|give|work|take|attempt|get|reach|reply|email|message|let|update|follow|check|look|review|read|watch|listen|submit|post|make|fix|figure|put|send|address|tackle|handle|resubmit|respond|re-?do|keep|continue|definitely|certainly|absolutely)\b|i\s+(?:will|['']?ll)\s+be\b|i\s+am\s+going\s+to\s+(?:try|do|give|work|take|reach|email|let|update|check|look|review|submit|post|make|fix|figure|put|send|tackle|handle|keep|continue)\b|i['']?m\s+(?:going|gonna|planning|happy|glad|excited|ready)\s+to\b|going\s+to\s+(?:try|do|give|work|take|reach|email|let|update|check|look|review|submit|post|make|fix|figure|put|send|tackle|handle)\b|appreciate\s+(?:the|your|that|it|all)\b|i\s+(?:really\s+|truly\s+|so\s+much\s+)?appreciate\b|i\s+understand\b|understood,?\s+(?:thank|i|will)\b|noted,?\s+(?:thank|i|will)\b|that\s+(?:makes\s+sense|works|helps|sounds|will\s+work)\b|sounds?\s+(?:great|perfect|good|like\s+a\s+plan)\b|that\s+(?:was|is)\s+(?:helpful|the\s+answer)|got\s+it,?\s+(?:thank|i|will)\b|no\s+worries\b|no\s+problem\b|np[,!.]\s|good\s+to\s+know\b|nice\s+to\s+know\b|happy\s+to\b|glad\s+(?:you|i|to|we)\b|i\s+(?:have|['']?ve)\s+(?:reviewed|received|read|seen|checked|looked|viewed|completed|finished|gone\s+(?:through|over)|set\s+(?:up|it)|subscribed|signed|opened|noted|saved|added|updated|fixed|resolved|resubmitted|submitted|sent|posted|uploaded|emailed|messaged)\b|i\s+(?:already\s+)?(?:submitted|sent|posted|uploaded|emailed|messaged|completed|finished|fixed|resolved|resubmitted|reviewed|received|seen|checked|looked|viewed|signed|opened|saved|added|updated)\b|(?:i\s+)?just\s+(?:wanted|wanting|need(?:ed|ing)?)\s+to\s+(?:let|update|tell|say|inform|confirm|share|mention|reach|check|follow|drop|give)\b|i\s+wanted\s+to\s+(?:let|update|tell|say|inform|confirm|share|mention|reach|check|follow|drop|give)\b|just\s+(?:letting|wanting)\s+you\s+know\b|just\s+an?\s+(?:update|fyi|heads[\s-]?up|note|quick\s+(?:note|update|fyi))\b|this\s+is\s+(?:just\s+)?(?:to|a\s+(?:note|message|update))\s+(?:let|update|confirm|inform|share|tell)\b|will\s+do\b|will\s+(?:get|reach|email|message|let|update|check|look|review|submit|post|make|fix|figure|put|send|try|tackle|handle)\b|wanted\s+to\s+(?:thank|let|say|share|update|confirm)\b)/i;

  // ── Leading-filler prefix patterns ───────────────────────────────
  // Polite openers that come BEFORE the actual content. We strip these
  // so the closure patterns see the real start of the message.
  //
  //   "Hello, Professor Nimeth. I have reviewed…"  →  "I have reviewed…"
  //   "Hi Mr. Nimith, I just wanted to let you know…"  →  "I just wanted to let you know…"
  //   "Ok, will do!"  →  "will do!"
  //   "Yes, I'm planning to submit tomorrow."  →  "I'm planning to submit tomorrow."
  const GREETING_RE = /^[\s.,!?:;'"\-]*(hi|hello|hey|dear|greetings|good\s+(?:morning|afternoon|evening|day))(?:\s+(?:dr\.?|prof(?:essor)?\.?|mr\.?|mrs\.?|ms\.?|miss|pastor|coach|sir|ma['']?am))?(?:\s+[a-z][a-z'\-.]*){0,4}[\s.,!?:;'"\-]+/i;
  const AFFIRMATIVE_RE = /^[\s.,!?:;'"\-]*(ok(?:ay)?|yes|yeah|yep|yup|sure(?:\s+thing)?|alright|alrighty|absolutely|definitely|certainly|of\s+course|so)[\s.,!?:;'"\-]+/i;

  function stripLeadingFiller(text) {
    if (!text) return '';
    let s = String(text);
    // Loop a few times so we strip BOTH a greeting and a following
    // affirmative ("Hi Professor, Ok, ___" → "___"). Cap at 4 iters
    // to keep this O(1) even on adversarial input.
    for (let i = 0; i < 4; i++) {
      const prev = s;
      s = s.replace(GREETING_RE, '');
      s = s.replace(AFFIRMATIVE_RE, '');
      if (s === prev) break;
    }
    return s.trim();
  }

  // Strip HTML tags + entities from a Brightspace post body so the
  // classifier sees the actual text the student typed.
  function clean(text) {
    if (!text) return '';
    return String(text)
      .replace(/<br\s*\/?\s*>/gi, ' ')
      .replace(/<[^>]+>/g, ' ')
      .replace(/&nbsp;/gi, ' ')
      .replace(/&[#a-z0-9]+;/gi, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // Fast heuristic — returns 'closure', 'needs-reply', or null (uncertain).
  //
  // Bias: lean toward 'closure' for acknowledgment-style messages so we
  // don't pester the instructor with "needs reply" badges that aren't
  // actually asking anything. A real question can still slip through the
  // deep classifier if the heuristic returns null.
  function quick(text) {
    const t = clean(text);
    if (!t) return 'needs-reply'; // empty body — leave the badge on so
                                  //  the instructor at least sees the row
    // Trailing question mark = real question. Note we look for ? near
    // the END of the message specifically — "Thanks! Quick question:
    // can you confirm?" still has a ? at the end and is a real question.
    if (/\?\s*$/.test(t)) return 'needs-reply';
    // Mid-message question mark — still a question, but only if the
    // message is long enough that the ? isn't decoration. Short messages
    // with ? in them ("Got it?") are usually rhetorical.
    if (/\?/.test(t) && t.length > 24) return 'needs-reply';
    if (t.length < 4) return 'closure';

    // Strip greetings ("Hello, Professor Nimeth.") and leading
    // affirmatives ("Ok,", "Yes,") so closure patterns see the actual
    // start of the message. Many false positives in live data were
    // caused by polite openers pushing the closure phrase out of
    // position 1, so the leading regex didn't match.
    const tStripped = stripLeadingFiller(t);
    const stripTarget = tStripped || t;

    // Whole-message match — short messages whose entire content
    // (post-strip) is a closure phrase. Length cap raised to 140 so
    // "Hello Professor, I have reviewed the contents. Thank you!"
    // resolves correctly after the greeting strip.
    if (stripTarget.length < 140 && CLOSURE_PHRASES.test(stripTarget)) return 'closure';

    // Leading-phrase match — message OPENS with an acknowledgment
    // after stripping. Length cap raised to 600 (from 280) because
    // when a message starts with "I have reviewed" or "I just wanted
    // to let you know", we trust that signal regardless of how much
    // elaboration follows — the opener tells us the student isn't
    // asking anything. Question marks are already short-circuited
    // above so a long message with "I have reviewed… but I have a
    // question?" still gets needs-reply.
    if (stripTarget.length < 600 && CLOSURE_LEADING.test(stripTarget)) return 'closure';

    // Long messages WITHOUT a question mark are usually informational
    // updates, not requests. Hand them to the deep classifier (which
    // defaults to closure when uncertain) rather than auto-flagging.
    // The prior `length > 320 → needs-reply` rule was producing too
    // many false positives on student status updates.
    return null;
  }

  // Lazy-loaded zero-shot classifier. Loaded once per session on first
  // ambiguous message. Fails silently — if the model can't load (network,
  // CSP, etc.), we fall back to leaving the badge on for those messages.
  //
  // ⚠ TRANSFORMERS.JS VERSION ALIGNMENT
  // Use the SAME import URL as the tone dashboard
  // (dashboards/tone-engine.html). Both dashboards intentionally pull the
  // same package + version so the browser dedups the WASM runtime + any
  // shared model weights across dashboards. If you add a new dashboard
  // that uses Transformers.js, import from this same URL and add it to
  // the list here:
  //   • tone-engine.html        — distilbert sentiment (~67 MB)
  //   • engagement-engine.html  — nli-deberta-v3-xsmall zero-shot (~60 MB)
  // Pin the version explicitly so a breaking minor release doesn't
  // silently change behavior in production.
  let _pipe = null, _loading = null;
  async function loadPipeline() {
    if (_pipe) return _pipe;
    if (_loading) return _loading;
    _loading = (async () => {
      try {
        const mod = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.4.1');
        const { pipeline, env } = mod;
        env.allowLocalModels = false;
        _pipe = await pipeline(
          'zero-shot-classification',
          'Xenova/nli-deberta-v3-xsmall'
        );
        return _pipe;
      } catch (e) {
        console.warn('[ClosureAnalyzer] pipeline load failed; heuristic-only mode', e);
        return null;
      }
    })();
    return _loading;
  }

  async function deep(text) {
    const pipe = await loadPipeline();
    if (!pipe) return null;
    const t = clean(text).slice(0, 500);
    if (!t) return null;
    try {
      // Three labels instead of two:
      //   1. Acknowledgment / closure
      //   2. Stating an action the student plans to take
      //   3. Asking a question (the only one that actually needs reply)
      // Anything that isn't #3 is treated as "no reply needed". This
      // makes the classifier aggressive about filtering — instructors
      // would rather miss a non-question than be pestered with badges
      // for "I'll try that" or "Thanks for your patience."
      const res = await pipe(t, [
        'thanking the instructor, closing the conversation, or acknowledging the information',
        'stating an action the student plans to take, with no question asked',
        'asking the instructor a question or requesting clarification or help',
      ]);
      const top = res.labels[0];
      const topScore = res.scores ? res.scores[0] : 0;
      // Only flag needs-reply when the question label wins AND the
      // model is confident (>0.55). The threshold was bumped from
      // 0.45 → 0.55 after live-data testing showed the model was
      // giving narrow wins to the question label on informational
      // messages like "I just wanted to let you know I can't attend"
      // and "I have reviewed the contents." When the model is on the
      // fence, default to closure — the instructor is better served
      // by a quiet row than a badge that turns out not to need
      // attention.
      if (/asking|question|clarif|request/i.test(top) && topScore > 0.55) {
        return 'needs-reply';
      }
      return 'closure';
    } catch (e) {
      console.warn('[ClosureAnalyzer] deep classify failed', e);
      return null;
    }
  }

  const cache = new Map();
  async function isClosure(text) {
    const key = clean(text).slice(0, 500);
    if (!key) return false;
    if (cache.has(key)) return cache.get(key);
    const q = quick(text);
    if (q === 'closure')     { cache.set(key, true);  return true; }
    if (q === 'needs-reply') { cache.set(key, false); return false; }
    const d = await deep(text);
    const result = (d === 'closure');
    cache.set(key, result);
    return result;
  }

  // Synchronous variant used by the Instructor Avg Time to Response
  // KPI math. The KPI runs on first paint (before the ML model has
  // loaded) so we can't await classification — but we still want to
  // exclude obvious closures from the response-time average. This
  // returns true if the regex quick() pass says "closure" OR the
  // analyzer has already cached a verdict for this message. Defaults
  // to false (treat as substantive) when uncertain so the KPI is
  // measured against real exchanges rather than skipping them.
  function isClosureSync(text) {
    const key = clean(text).slice(0, 500);
    if (!key) return false;
    if (cache.has(key)) return cache.get(key);
    return quick(text) === 'closure';
  }

  return { isClosure, isClosureSync, clean };
})();

/* ═══════════════════════════════════════════════════════════════
   API HELPER — relative paths, session cookies handle auth
   ═══════════════════════════════════════════════════════════════ */
async function api(path) {
  const r = await fetch(path, {credentials:'include'});
  if (!r.ok) throw new Error(`${r.status} ${path}`);
  const ct = r.headers.get('content-type') || '';
  return ct.includes('json') ? r.json() : r.text();
}

// Paged API helper — follows D2L pagination (Next URL or Bookmark) to collect all items
async function pagedApi(basePath) {
  let all = [];
  let nextUrl = null;
  let safety = 0;
  let pageNum = 0;
  while (safety++ < 50) {
    const url = nextUrl || basePath;
    const result = await api(url);
    pageNum++;
    // If the result is a plain array, no paging — return directly
    if (Array.isArray(result)) return all.length ? all.concat(result) : result;
    const items = result?.Objects || result?.Items || [];
    all = all.concat(items);
    // Strategy 1: D2L "Next" URL (most grade endpoints use this)
    if (result?.Next) {
      console.log('[pagedApi] Page', pageNum, ':', items.length, 'items, following Next URL');
      nextUrl = result.Next;
      continue;
    }
    // Strategy 2: PagingInfo with Bookmark (some older endpoints)
    const paging = result?.PagingInfo;
    if (paging && paging.HasMoreItems && paging.Bookmark) {
      const sep = basePath.includes('?') ? '&' : '?';
      nextUrl = `${basePath}${sep}bookmark=${encodeURIComponent(paging.Bookmark)}`;
      continue;
    }
    // No more pages
    break;
  }
  if (pageNum > 1) console.log('[pagedApi] Collected', all.length, 'total items across', pageNum, 'pages');
  return all;
}

// Attach scroll-hint behavior to a scrollable container
// Adds a right-edge gradient+chevron that appears when content overflows and fades when fully scrolled
function initScrollHint(el) {
  if (!el) return;
  el.classList.add('scroll-hint-wrap');
  function update() {
    const canScroll = el.scrollWidth > el.clientWidth + 2;
    const atEnd = el.scrollLeft + el.clientWidth >= el.scrollWidth - 4;
    el.classList.toggle('can-scroll-right', canScroll && !atEnd);
  }
  el.addEventListener('scroll', update, { passive: true });
  // Check after layout settles
  requestAnimationFrame(() => { update(); setTimeout(update, 300); });
  // Also update on resize
  if (window.ResizeObserver) {
    new ResizeObserver(update).observe(el);
  }
}

async function enrollment(uid) {
  // Strategy 1: org-unit enrollment list (most reliable for role detection)
  try {
    const r = await api(`/d2l/api/lp/${LP}/enrollments/orgUnits/${OU_ID}/users/`);
    const items = r?.Items || (Array.isArray(r) ? r : []);
    const me = items.find(e => String(e.User?.Identifier || e.UserId || '') === String(uid));
    if (me) {
      console.log('Enrollment strategy 1 (orgUnit users list) succeeded:', JSON.stringify(me.Role || me.Access));
      return me;
    }
  } catch(e) { console.log('Enrollment format 1 (orgUnit users) failed:', e.message); }
  // Strategy 2: direct user enrollment for this org unit
  try {
    const r = await api(`/d2l/api/lp/${LP}/enrollments/orgUnits/${OU_ID}/users/${uid}`);
    if (r && (r.Role || r.Access)) { console.log('Enrollment strategy 2 succeeded'); return r; }
  } catch(e) { console.log('Enrollment format 2 (direct) failed:', e.message); }
  // Strategy 3: myenrollments
  try {
    const r = await api(`/d2l/api/lp/${LP}/enrollments/myenrollments/?orgUnitId=${OU_ID}`);
    const items = r?.Items || (Array.isArray(r) ? r : []);
    if (items.length) {
      const item = items[0];
      // myenrollments returns Access.ClasslistRoleName
      if (item.Access && item.Access.ClasslistRoleName && !item.Role) {
        item.Role = { Id: item.Access.ClasslistRoleId, Name: item.Access.ClasslistRoleName };
      }
      console.log('Enrollment strategy 3 (myenrollments) succeeded:', JSON.stringify(item.Role || item.Access));
      return item;
    }
  } catch(e) { console.log('Enrollment format 3 (myenrollments) failed:', e.message); }
  // Strategy 4: classlist fallback — get RoleId and look up role name
  try {
    const cl = await api(`/d2l/api/le/${LE}/${OU_ID}/classlist/`);
    if (Array.isArray(cl)) {
      const me = cl.find(s => String(s.Identifier) === String(uid));
      if (me) {
        // Try to get role name from the roles API
        let roleName = me.RoleName || null;
        if (!roleName && me.RoleId) {
          try {
            const role = await api(`/d2l/api/lp/${LP}/roles/${me.RoleId}`);
            roleName = role?.DisplayName || role?.Name || null;
            console.log('Resolved RoleId', me.RoleId, 'to', roleName);
          } catch { /* role lookup failed, fall through */ }
        }
        // If still no role name, infer from classlist position
        // Instructors typically have low Identifiers and are not in the main student list
        if (me.RoleId) return { Role: { Id: me.RoleId, Name: roleName || 'Instructor' } };
      }
    }
  } catch(e) { console.log('Enrollment format 4 (classlist) failed:', e.message); }
  return null;
}

/* ═══════════════════════════════════════════════════════════════
   ROLE DETECTION
   ═══════════════════════════════════════════════════════════════ */
function extractRole(enr) {
  if (!enr) return null;
  if (enr.Role && enr.Role.Name) return enr.Role;
  if (enr.Access) {
    if (enr.Access.Role && enr.Access.Role.Name) return enr.Access.Role;
    if (enr.Access.ClasslistRoleName) return { Id: enr.Access.ClasslistRoleId, Name: enr.Access.ClasslistRoleName };
  }
  if (enr.RoleId) return { Id: enr.RoleId, Name: enr.RoleName || null };
  return null;
}
function isInstructor(enr) {
  const role = extractRole(enr);
  if (!role || !role.Name) return false;
  const n = role.Name.toLowerCase();
  const studentRoles = ['student','learner','participant','observer','guest','auditor'];
  if (studentRoles.some(r => n.includes(r))) return false;
  return true;
}
function getRoleName(enr) {
  const role = extractRole(enr);
  if (!role || !role.Name) return 'Student';
  return role.Name;
}

   UTILITY FUNCTIONS
   ═══════════════════════════════════════════════════════════════ */
function pc(num, denom) { return denom ? Math.round(num / denom * 100) : 0; }
function pillC(val) { return val >= 80 ? 'pg' : val >= 60 ? 'py' : 'pr'; }
function ini(name) { return (name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function relDate(d) {
  if (!d) return '';
  const now = Date.now();
  const td = new Date(d).getTime();
  const diff = now - td;
  if (diff < 3600000) return 'now';
  if (diff < 86400000) return Math.round(diff/3600000) + 'h ago';
  if (diff < 604800000) return Math.round(diff/86400000) + 'd ago';
  return new Date(d).toLocaleDateString('en-US', {month:'short', day:'numeric'});
}

function abbreviateForumName(name) {
  if (!name) return name;
  if (/getting\s+to\s+know/i.test(name)) return 'GTKY';
  const weekMatch = name.match(/week\s*(\d+)/i);
  if (weekMatch) return 'Wk ' + weekMatch[1];
  const sessMatch = name.match(/session\s*(\d+)/i);
  if (sessMatch) return 'Sess ' + sessMatch[1];
  return name;
}

function topicViewUrl(topicId, postId) {
  if (!topicId || !OU_ID) return null;
  if (postId) {
    return `/d2l/le/${OU_ID}/discussions/topics/${topicId}/View?postId=${encodeURIComponent(postId)}#m_${encodeURIComponent(postId)}`;
  }
  return `/d2l/le/${OU_ID}/discussions/topics/${topicId}/View`;
}

function postDateKey(d) {
  if (!d) return null;
  try {
    const dt = new Date(d);
    if (isNaN(dt.getTime())) return null;
    return dt.toISOString().split('T')[0];
  } catch { return null; }
}

function lineChart(id,labels,data,label){
  const c=document.getElementById(id); if(!c) return;
  new Chart(c,{type:'line',data:{labels,datasets:[{label,data,
    borderColor:'#3CB4E5',backgroundColor:'rgba(60,180,229,.12)',

function stackedBar(id,labels,d1,d2){
  const c=document.getElementById(id); if(!c) return;
  new Chart(c,{type:'bar',data:{labels,datasets:[
    {label:'Posts',data:d1,backgroundColor:'#00416B',borderRadius:4,maxBarThickness:24},
    {label:'Replies',data:d2,backgroundColor:'#3CB4E5',borderRadius:4,maxBarThickness:24}]},
    options:{...cDef,scales:{...cDef.scales,
      x:{...cDef.scales.x,stacked:true},y:{...cDef.scales.y,stacked:true,beginAtZero:true}}}});
}
function responseRateBar(id,labels,rates){
  const c=document.getElementById(id); if(!c) return;
  // Show every forum at its actual rate. 0% forums sit on the baseline
  // so instructors can see at a glance where the gaps are. Bar height
  // = response rate; no "remaining" filler stacked on top.
  const fLabels = labels.slice();
  const fRates  = rates.slice();
  new Chart(c,{type:'bar',data:{labels:fLabels,datasets:[
    {label:'Response Rate %',data:fRates,
      backgroundColor:fRates.map(r=>r>=33?'#1B8C5A':r>=25?'#FED925':'#EA0029'),
      borderRadius:4,maxBarThickness:32}]},
    options:{...cDef,
      plugins:{...cDef.plugins,
        legend:{display:false},
        tooltip:{callbacks:{
          label:ctx=>ctx.parsed.y+'% of posts responded to'}}},
      scales:{...cDef.scales,
        y:{...cDef.scales.y,min:0,max:100,beginAtZero:true,
          ticks:{...cDef.scales.y.ticks,callback:v=>v+'%'}}}}});
}
function donut(id,labels,data,colors){
  const c=document.getElementById(id); if(!c) return;
  new Chart(c,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors,
    borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'right',labels:{font:{family:"'Open Sans'",size:11},padding:10}}}}});
}
