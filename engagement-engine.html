  }

  // ── Content Time Panel ───────────────────────────────────────
  const contentTimePanel = document.getElementById('p-content-time');
  if (contentTimePanel) {
    contentTimePanel.innerHTML = '<div class="cd"><h3>Content Progress</h3><div class="ldg"><div class="sp"></div><p>Fetching content progress from Brightspace…</p></div></div>';
    (async () => {
      try {
        console.log('[ContentProgress] Starting content progress analysis');
        const root = await contentRoot();
        console.log('[ContentProgress] Root response type:', typeof root, Array.isArray(root) ? 'array(' + root.length + ')' : '', root ? Object.keys(root).join(', ') : 'null');
        const modules = Array.isArray(root) ? root : (root?.Modules || []);
        if (!modules.length) { console.warn('[ContentProgress] No modules found in root response'); contentTimePanel.innerHTML = '<div class="cd"><h3>Content Progress</h3><p style="color:var(--lg);padding:14px 0">No content modules found.</p></div>'; return; }
        console.log('[ContentProgress] Found', modules.length, 'modules. First module keys:', Object.keys(modules[0]).join(', '));

        const studentCount = classMembers ? classMembers.length : 0;
        console.log('[ContentProgress] Student count:', studentCount);
        let totalTopicsAll = 0, totalCompletedAll = 0;

        // Build module structure with per-topic completion
        let tableRows = '';
        for (const mod of modules.slice(0, 25)) {
          const name = mod.Title || mod.Name || 'Module';
          const modId = mod.Id || mod.ModuleId;
          let topicCount = 0;
          let completedCount = 0;
          let totalChecks = 0;

          try {
            const structure = await contentModule(modId);
            // structure may return Topics array or nested Modules
            const allItems = [];
            function extractTopics(items) {
              if (!Array.isArray(items)) return;
              for (const item of items) {
                if (item.Type === 1 || item.TopicId) { allItems.push(item); } // Type 1 = Topic
                else if (item.Type === 0 || item.Modules) { // Type 0 = Module
                  extractTopics(item.Modules || item.Topics || []);
                }
                // Also handle flat arrays where items have Id and Title but no Type
                else if (item.Id && item.Title && !item.Type) { allItems.push(item); }
              }
            }
            const rawItems = Array.isArray(structure) ? structure : (structure?.Modules || structure?.Topics || []);
            extractTopics(rawItems);
            // If extractTopics found nothing, treat rawItems as topics directly
            if (!allItems.length && rawItems.length) {
              rawItems.forEach(item => allItems.push(item));
            }
            topicCount = allItems.length;
            totalTopicsAll += topicCount;
            if (modules.indexOf(mod) === 0) console.log('[ContentProgress] First module "' + name + '": ' + topicCount + ' topics extracted. First topic keys:', allItems.length ? Object.keys(allItems[0]).join(', ') : 'none');

            // For each topic, check completion across students
            let topicCompletionErrors = 0;
            for (const topic of allItems) {
              const topicId = topic.Id || topic.TopicId;
              if (!topicId) continue;
              try {
                // Try bulk completion endpoint first
                const completions = await topicCompletionAll(topicId);
                const compArr = Array.isArray(completions) ? completions : (completions?.Objects || []);
                if (modules.indexOf(mod) === 0 && allItems.indexOf(topic) === 0) {
                  console.log('[ContentProgress] First topic completion response type:', typeof completions, Array.isArray(completions) ? 'array(' + completions.length + ')' : '', compArr.length ? 'First entry keys: ' + Object.keys(compArr[0]).join(', ') : 'empty');
                }
                const completed = compArr.filter(c => c.CompletionDate || c.CompletedDate || c.IsComplete || c.Completed).length;
                completedCount += completed;
                totalChecks += studentCount || compArr.length;
              } catch(topicErr) {
                topicCompletionErrors++;
                if (topicCompletionErrors <= 2) console.warn('[ContentProgress] topicCompletionAll failed for topic', topicId, ':', topicErr.message || topicErr);
                // Fall back to per-student checks (limited to avoid API overload)
                const checkLimit = Math.min(studentCount, 5);
                for (let si = 0; si < checkLimit && si < (classMembers||[]).length; si++) {
                  try {
                    const comp = await topicCompletion(topicId, classMembers[si].id);
                    if (comp && (comp.CompletionDate || comp.CompletedDate || comp.IsComplete || comp.Completed)) completedCount++;
                    totalChecks++;
                  } catch { totalChecks++; }
                }
              }
            }
            if (topicCompletionErrors) console.warn('[ContentProgress] Module "' + name + '": ' + topicCompletionErrors + '/' + topicCount + ' topics failed completion check');
            totalCompletedAll += completedCount;
            console.log('[ContentProgress] Module "' + name + '": topics=' + topicCount + ' completedChecks=' + completedCount + '/' + totalChecks);
          } catch(e) { console.warn('[ContentProgress] Module structure error for', modId, ':', e.message || e); }

          const completionPct = totalChecks > 0 ? Math.round(completedCount / totalChecks * 100) : 0;
          const compCls = completionPct >= 80 ? 'pg' : completionPct >= 50 ? 'py' : completionPct > 0 ? 'pr' : '';

          tableRows += `<tr>
            <td>${name.substring(0,50)}</td>
            <td style="text-align:center">${topicCount}</td>
            <td style="text-align:center">${compCls ? `<span class="pill ${compCls}">${completionPct}%</span>` : '<span style="color:var(--lg)">—</span>'}</td>
          </tr>`;
        }

        // KPI summary
        const overallPct = totalTopicsAll > 0 && studentCount > 0
          ? Math.round(totalCompletedAll / (totalTopicsAll * studentCount) * 100) : 0;
        const overallCls = overallPct >= 80 ? 'pg' : overallPct >= 50 ? 'py' : overallPct > 0 ? 'pr' : '';

        let html = '<div class="cd"><h3>Content Progress</h3>';
        html += '<div style="display:flex;gap:clamp(8px,1.5vw,14px);flex-wrap:wrap;margin-bottom:14px">';
        html += '<div style="background:var(--sf);border:1px solid #E8ECF0;border-left:3px solid var(--db);border-radius:6px;padding:6px 12px">';
        html += '<div style="font-size:clamp(.6rem,.85vw,.72rem);color:var(--lg);text-transform:uppercase;letter-spacing:.3px">Modules</div>';
        html += '<div style="font-family:var(--hf);font-size:clamp(1.1rem,2vw,1.5rem);font-weight:700;color:var(--db)">' + modules.length + '</div></div>';
        html += '<div style="background:var(--sf);border:1px solid #E8ECF0;border-left:3px solid var(--lb);border-radius:6px;padding:6px 12px">';
        html += '<div style="font-size:clamp(.6rem,.85vw,.72rem);color:var(--lg);text-transform:uppercase;letter-spacing:.3px">Total Topics</div>';
        html += '<div style="font-family:var(--hf);font-size:clamp(1.1rem,2vw,1.5rem);font-weight:700;color:var(--lb)">' + totalTopicsAll + '</div></div>';
        html += '<div style="background:var(--sf);border:1px solid #E8ECF0;border-left:3px solid var(--gd);border-radius:6px;padding:6px 12px">';
        html += '<div style="font-size:clamp(.6rem,.85vw,.72rem);color:var(--lg);text-transform:uppercase;letter-spacing:.3px">Overall Completion</div>';
        html += '<div style="font-family:var(--hf);font-size:clamp(1.1rem,2vw,1.5rem);font-weight:700;color:#B5880A">' + overallPct + '%</div></div>';
        html += '</div>';

        html += '<div style="overflow-x:auto"><table><thead><tr>';
        html += '<th>Module</th><th style="text-align:center">Topics</th><th style="text-align:center">Completion</th>';
        html += '</tr></thead><tbody>';
        html += tableRows;
        html += '</tbody></table></div>';
        html += '<p style="font-size:clamp(.6rem,.85vw,.72rem);color:var(--lg);margin-top:8px;font-style:italic">Note: Time-in-content data is not available via the Brightspace API. Completion is based on content topic completion tracking. For detailed time analytics, refer to Brightspace Data Hub.</p>';
        html += '</div>';
        contentTimePanel.innerHTML = html;
      } catch (err) {
        console.warn('Content progress load error:', err);
        contentTimePanel.innerHTML = '<div class="cd"><h3>Content Progress</h3><p style="color:var(--lg);padding:14px 0">Unable to load content data.</p></div>';
      }
    })();
  }

  // Render student activity panel
  const studentActivityPanel = document.getElementById('p-student-activity');
  if (studentActivityPanel) {
    studentActivityPanel.innerHTML = `
    <div class="cd">
      <h3>Student Activity Calendar</h3>
      <div class="stu-sel-wrap">
        <label for="sa-student-select" style="font-weight:600;color:var(--db);font-size:clamp(.78rem,1.1vw,.9rem)">Select Student:</label>
        <select id="sa-student-select" class="stu-sel-act" disabled data-tip="Loading student activity data from Brightspace — this may take a moment…">
          <option value="">⏳ Loading student data…</option>
        </select>
      </div>
      <div id="sa-placeholder" style="color:var(--lg);font-size:.82rem;padding:20px;text-align:center">Choose a student to view their activity timeline</div>
      <div id="sa-calendar-area" style="display:none">
        <div class="cal-ctrl">
          <div class="cal-nav">
            <button id="sa-btnPrev">← Previous</button>
            <span class="cal-month" id="sa-monthLabel"></span>
            <button id="sa-btnNext">Next →</button>
          </div>
          <div id="sa-kpiArea"></div>
        </div>
        <div id="sa-calendarWrapper"></div>
        <p style="font-size:.7rem;color:var(--lg);margin-top:12px">Click on events to see details</p>
      </div>
    </div>`;

    // Populate the student dropdown once data is available
    const saSelect = document.getElementById('sa-student-select');
    if (saSelect && classMembers && classMembers.length) {
      const sorted = [...classMembers].sort((a,b) => a.name.localeCompare(b.name));
      saSelect.innerHTML = '<option value="">— Select a student —</option>' +
        sorted.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
      saSelect.disabled = false;
      saSelect.removeAttribute('data-tip');
      saSelect.setAttribute('data-tip', 'Select a student to view their activity calendar');
    }

    /* ── Student Activity Calendar Engine ────────────────────── */
    let saEvents = [];      // array of { date:Date, type:string, label:string, color:string }
    let saMonth  = new Date().getMonth();
    let saYear   = new Date().getFullYear();

    const EVENT_COLORS = {
      post:       '#00416B',  // dark blue — discussion post
      reply:      '#3CB4E5',  // light blue — discussion reply
      submission: '#1B8C5A',  // green — assignment submission
      content:    '#FED925',  // gold — content access
      grade:      '#EA0029'   // red — grade received
    };

    function renderSACalendar() {
      const wrapper  = document.getElementById('sa-calendarWrapper');
      const label    = document.getElementById('sa-monthLabel');
      const kpiArea  = document.getElementById('sa-kpiArea');
      if (!wrapper || !label) return;

      label.textContent = new Date(saYear, saMonth).toLocaleDateString('en-US', { month:'long', year:'numeric' });

      // Filter events for this month
      const monthEvents = saEvents.filter(e => {
        const d = new Date(e.date);
        return d.getMonth() === saMonth && d.getFullYear() === saYear;
      });

      // KPIs for this month
      const posts = monthEvents.filter(e => e.type === 'post' || e.type === 'reply').length;
      const subs  = monthEvents.filter(e => e.type === 'submission').length;
      const cont  = monthEvents.filter(e => e.type === 'content').length;
      if (kpiArea) {
        kpiArea.innerHTML = `
          <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:clamp(.65rem,.9vw,.78rem)">
            <span style="color:${EVENT_COLORS.post};font-weight:600">● ${posts} Discussion${posts!==1?'s':''}</span>
            <span style="color:${EVENT_COLORS.submission};font-weight:600">● ${subs} Submission${subs!==1?'s':''}</span>
            <span style="color:${EVENT_COLORS.content};font-weight:600">● ${cont} Content Access</span>
          </div>`;
      }

      // Build calendar grid
      const firstDay = new Date(saYear, saMonth, 1).getDay();
      const daysInMonth = new Date(saYear, saMonth + 1, 0).getDate();
      const daysInPrev  = new Date(saYear, saMonth, 0).getDate();
      const today = new Date();

      let html = '<div class="cal-grid">';
      ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
        html += `<div class="cal-dow">${d}</div>`;
      });

      // Previous month padding
      for (let i = firstDay - 1; i >= 0; i--) {
        html += `<div class="cal-day other"><div class="day-num">${daysInPrev - i}</div></div>`;
      }

      // Current month days
      for (let d = 1; d <= daysInMonth; d++) {
        const isToday = d === today.getDate() && saMonth === today.getMonth() && saYear === today.getFullYear();
        const dayEvents = monthEvents.filter(e => new Date(e.date).getDate() === d);
        const MAX_PILLS = 3;
        html += `<div class="cal-day${isToday ? ' today' : ''}">`;
        html += `<div class="day-num">${d}</div>`;
        if (dayEvents.length) {
          html += '<div class="pills">';
          dayEvents.slice(0, MAX_PILLS).forEach(ev => {
            html += `<div class="cal-pill" style="background:${ev.color}" title="${ev.label}">${ev.label.substring(0,18)}</div>`;
          });
          if (dayEvents.length > MAX_PILLS) {
            html += `<div class="cal-more" title="${dayEvents.length - MAX_PILLS} more events">+${dayEvents.length - MAX_PILLS} more</div>`;
          }
          html += '</div>';
        }
        html += '</div>';
      }

      // Next month padding
      const totalCells = firstDay + daysInMonth;
      const remaining = (7 - (totalCells % 7)) % 7;
      for (let i = 1; i <= remaining; i++) {
        html += `<div class="cal-day other"><div class="day-num">${i}</div></div>`;
      }

      html += '</div>';
      wrapper.innerHTML = html;
    }

    // Wire up month navigation
    document.getElementById('sa-btnPrev')?.addEventListener('click', () => {
      saMonth--;
      if (saMonth < 0) { saMonth = 11; saYear--; }
      renderSACalendar();
    });
    document.getElementById('sa-btnNext')?.addEventListener('click', () => {
      saMonth++;
      if (saMonth > 11) { saMonth = 0; saYear++; }
      renderSACalendar();
    });

    // Fetch student activity data and build events
    async function loadStudentActivity(studentId, studentName) {
      const placeholder = document.getElementById('sa-placeholder');
      const calArea     = document.getElementById('sa-calendar-area');
      if (placeholder) placeholder.innerHTML = '<div class="ldg"><div class="sp"></div><p>Fetching activity for <strong>' + studentName + '</strong>…</p></div>';
      if (calArea) calArea.style.display = 'none';

      saEvents = [];

      try {
        // 1. Discussion posts & replies by this student
        let allForums = [];
        try { allForums = await forums(); if (!Array.isArray(allForums)) allForums = []; } catch {}

        for (const forum of allForums) {
          let fTopics = [];
          try { fTopics = await forumTopics(forum.ForumId); if (!Array.isArray(fTopics)) fTopics = []; } catch { continue; }
          for (const t of fTopics) {
            let posts = [];
            try { posts = await topicPosts(forum.ForumId, t.TopicId); if (!Array.isArray(posts)) posts = []; } catch { continue; }
            for (const p of posts) {
              const authorId = String(p.PostingUserId || p.UserId || '');
              if (authorId !== studentId) continue;
              const dt = p.DatePosted || p.LastEditedDate;
              if (!dt) continue;
              const isReply = !!p.ParentPostId;
              saEvents.push({
                date: new Date(dt),
                type: isReply ? 'reply' : 'post',
                label: (isReply ? 'Reply: ' : 'Post: ') + ((p.Subject || t.Name || 'Discussion').substring(0, 30)),
                color: isReply ? EVENT_COLORS.reply : EVENT_COLORS.post
              });
            }
          }
        }

        // 2. Assignment submissions by this student
        let folders = [];
        try { folders = await dropboxFolders(); if (!Array.isArray(folders)) folders = []; } catch {}
        for (const f of folders) {
          try {
            const subs = await dropboxSubs(f.Id || f.FolderId);
            const subArr = Array.isArray(subs) ? subs : (subs?.Objects || []);
            for (const s of subArr) {
              const subEntity = s.Entity || s;
              const submitter = String(subEntity.SubmittedBy?.Identifier || subEntity.UserId || '');
              if (submitter !== studentId) continue;
              const dt = subEntity.SubmissionDate || subEntity.CreatedDate;
              if (!dt) continue;
              saEvents.push({
                date: new Date(dt),
                type: 'submission',
                label: 'Submitted: ' + (f.Name || 'Assignment').substring(0, 25),
                color: EVENT_COLORS.submission
              });
            }
          } catch { /* skip folder */ }
        }

        // 3. Content last visits from the Content statistics page
        try {
          if (window.LdaaReport && LdaaReport.contentStatistics && OU_ID) {
            const pack = await LdaaReport.contentStatistics(OU_ID, studentId);
            const statRows = (pack && pack.rows) || [];
            for (const row of statRows) {
              if (!row || row.isModule || !row.date) continue;
              const label = row.module ? row.module + ' — ' + row.title : row.title;
              saEvents.push({
                date: new Date(row.date),
                type: 'content',
                label: 'Opened: ' + String(label || 'Content').substring(0, 40),
                color: EVENT_COLORS.content
              });
            }
          }
        } catch { /* content statistics may not be available */ }

        // 4. Grades received
        try {
          const gVals = await myGrades(studentId);
          const gArr = Array.isArray(gVals) ? gVals : (gVals?.Objects || []);
          for (const g of gArr) {
            const dt = g.LastModified || g.GradedDate;
            if (!dt) continue;
            const pts = g.DisplayedGrade || g.PointsNumerator;
            if (pts == null) continue;
            saEvents.push({
              date: new Date(dt),
              type: 'grade',
              label: 'Grade: ' + (g.GradeObjectName || 'Item').substring(0, 20) + ' — ' + pts,
              color: EVENT_COLORS.grade
            });
          }
        } catch { /* grades may not be accessible */ }

      } catch (err) {
        console.warn('Student activity load error:', err);
      }

      // Sort events chronologically
      saEvents.sort((a,b) => a.date - b.date);

      // Jump to the most recent month with events, or current month
      if (saEvents.length) {
        const latest = saEvents[saEvents.length - 1].date;
        saMonth = latest.getMonth();
        saYear  = latest.getFullYear();
      } else {
        saMonth = new Date().getMonth();
        saYear  = new Date().getFullYear();
      }

      if (placeholder) placeholder.style.display = 'none';
      if (calArea) calArea.style.display = 'block';
      renderSACalendar();
    }

    // Wire up student select change event
    if (saSelect) {
      saSelect.addEventListener('change', () => {
        const sid = saSelect.value;
        if (!sid) {
          document.getElementById('sa-placeholder').style.display = 'block';
          document.getElementById('sa-placeholder').textContent = 'Choose a student to view their activity timeline';
          document.getElementById('sa-calendar-area').style.display = 'none';
          return;
        }
        const studentName = saSelect.options[saSelect.selectedIndex].text;
        loadStudentActivity(sid, studentName);
      });
    }
  }
}

   LAZY-LOADED: ACTIVITY TRACKER DATA

  // ── Fetch all activity for a student ─────────────────────────

    if (placeholder) {

    }
    if (feedEl) feedEl.style.display = 'none';

    const activities = []; // { date, type, title, detail, url }

    try {
      // 1. Discussion posts & replies
      let allForums = [];
      try { allForums = await forums(); if (!Array.isArray(allForums)) allForums = []; } catch {}

      for (const forum of allForums) {
        let fTopics = [];
        try { fTopics = await forumTopics(forum.ForumId); if (!Array.isArray(fTopics)) fTopics = []; } catch { continue; }
        for (const t of fTopics) {
          let posts = [];
          try { posts = await topicPosts(forum.ForumId, t.TopicId); if (!Array.isArray(posts)) posts = []; } catch { continue; }
          for (const p of posts) {

            if (authorId !== studentId) continue;

          }

      } catch(e) { console.warn('[ActivityTracker] dropboxFolders failed:', e.message || e); }

      for (const f of folders) {
        try {
          const subs = await dropboxSubs(f.Id || f.FolderId);
          const subArr = Array.isArray(subs) ? subs : (subs?.Objects || subs?.Items || []);
          if (folders.indexOf(f) === 0 && subArr.length) {
            console.log('[ActivityTracker] First folder "' + (f.Name||'?') + '" subs: ' + subArr.length + ', first sub keys:', Object.keys(subArr[0]).join(', '));
          }
          for (const s of subArr) {

            if (submitter !== studentId) continue;

            if (!dt) continue;
            subCount++;
            const files = subEntity.Submissions || subEntity.Files || [];
            const fileNames = files.map(fl => fl.FileName || fl.Name || '').filter(Boolean).join(', ');
            activities.push({

              url: '/d2l/lms/dropbox/user/folder_submit_files.d2l?db=' + (f.Id || f.FolderId) + '&ou=' + OU_ID

            date: new Date(dt),
            type: 'grade',
            title: (g.GradeObjectName || g.Name || 'Grade Item').substring(0, 60),
            detail: max ? pts + ' / ' + max : String(pts),
            url: null
          });
        }
      } catch { /* grades may not be accessible */ }

    } catch (err) {
      console.warn('Activity tracker load error:', err);
    }

    // Sort newest first
    activities.sort((a,b) => b.date - a.date);

    // ── Last-Activity Summary Table ─────────────────────────────
    // Group by the four major categories the instructor cares about
    const SUMMARY_CATS = [
      { key: 'discussions', label: 'Last Discussion Post', types: ['post','reply'], color: '#00416B', icon: '💬' },
      { key: 'submission',  label: 'Last Assignment Submitted', types: ['submission'],    color: '#1B8C5A', icon: '📄' },
      { key: 'content',     label: 'Last Course Accessed',   types: ['content'],       color: '#B5880A', icon: '📖' },
      { key: 'grade',       label: 'Last Grade Received',    types: ['grade'],         color: '#EA0029', icon: '📊' }
    ];

    if (summaryEl) {
      // Find the most recent date per category (activities already sorted newest-first)
      const lastDates = {};
      const totalCounts = {};
      for (const cat of SUMMARY_CATS) {
        const matching = activities.filter(a => cat.types.includes(a.type));
        totalCounts[cat.key] = matching.length;
        lastDates[cat.key] = matching.length ? matching[0].date : null; // first = newest since sorted desc
      }

      let khtml = '<div style="overflow-x:auto;margin-bottom:10px"><table style="width:100%;border-collapse:collapse;font-size:clamp(.72rem,1vw,.88rem)">';
      // Header row — category labels
      khtml += '<thead><tr>';
      for (const cat of SUMMARY_CATS) {
        khtml += '<th style="text-align:center;padding:8px 10px;font-weight:700;font-size:clamp(.62rem,.9vw,.76rem);text-transform:uppercase;letter-spacing:.5px;color:#fff;background:' + cat.color + ';border-right:2px solid #fff">';
        khtml += cat.icon + ' ' + cat.label;
        khtml += '</th>';
      }
      khtml += '</tr></thead>';
      // Data row — last date + count
      khtml += '<tbody><tr>';
      for (const cat of SUMMARY_CATS) {
        const d = lastDates[cat.key];
        const count = totalCounts[cat.key] || 0;
        let dateStr, cls;
        if (!d) {
          dateStr = 'Never';
          cls = 'color:#EA0029;font-weight:700';
        } else {
          const daysDiff = Math.floor((Date.now() - d.getTime()) / 86400000);
          dateStr = d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
          if (daysDiff <= 3) cls = 'color:#1B8C5A;font-weight:700';
          else if (daysDiff <= 7) cls = 'color:var(--db);font-weight:600';
          else if (daysDiff <= 14) cls = 'color:#B5880A;font-weight:600';
          else cls = 'color:#EA0029;font-weight:700';
        }
        khtml += '<td style="text-align:center;padding:10px;border-right:1px solid #E8ECF0;background:var(--sf)">';
        khtml += '<div style="' + cls + ';font-size:clamp(.78rem,1.1vw,.92rem)">' + dateStr + '</div>';
        khtml += '<div style="font-size:clamp(.6rem,.85vw,.72rem);color:var(--lg);margin-top:2px">' + count + ' total</div>';
        khtml += '</td>';
      }
      khtml += '</tr></tbody></table></div>';

      if (!activities.length) {
        khtml = '<div style="color:var(--lg);font-size:.82rem;padding:10px 0">No activity found for this student.</div>';
      }
      summaryEl.innerHTML = khtml;
    }

    // ── Activity feed ──────────────────────────────────────────
    if (feedEl) {
      if (!activities.length) {
        if (placeholder) { placeholder.style.display = 'block'; placeholder.textContent = 'No activities found for ' + studentName + '.'; }
        feedEl.style.display = 'none';
        return;
      }

      let fhtml = '';
      let lastDateKey = '';
      activities.forEach(a => {
        const dateKey = a.date.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
        if (dateKey !== lastDateKey) {
          fhtml += '<div style="font-weight:700;font-size:clamp(.72rem,1vw,.85rem);color:var(--db);padding:12px 0 6px;border-bottom:2px solid var(--gd);margin-top:8px">' + dateKey + '</div>';
          lastDateKey = dateKey;
        }
        const cfg = AT_TYPES[a.type] || AT_TYPES.content;
        const timeStr = a.date.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
        fhtml += '<div style="display:flex;align-items:flex-start;gap:clamp(8px,1.2vw,12px);padding:8px 0;border-bottom:1px solid #F0F2F5">';
        fhtml += '<div style="width:clamp(28px,4vw,36px);height:clamp(28px,4vw,36px);border-radius:50%;background:' + cfg.color + ';color:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(.7rem,1vw,.85rem);flex-shrink:0">' + cfg.icon + '</div>';
        fhtml += '<div style="flex:1;min-width:0">';
        if (a.url) {
          fhtml += '<a href="' + a.url + '" target="_blank" rel="noopener" style="font-weight:600;font-size:clamp(.74rem,1.1vw,.9rem);color:var(--db);text-decoration:none">' + a.title + '</a>';
        } else {
          fhtml += '<div style="font-weight:600;font-size:clamp(.74rem,1.1vw,.9rem);color:var(--db)">' + a.title + '</div>';
        }
        fhtml += '<div style="font-size:clamp(.62rem,.9vw,.76rem);color:var(--lg)">';
        fhtml += '<span style="color:' + cfg.color + ';font-weight:600">' + cfg.label + '</span>';
        if (a.detail) fhtml += ' · ' + a.detail;
        fhtml += ' · ' + timeStr;
        fhtml += '</div></div></div>';
      });

      feedEl.innerHTML = fhtml;
      feedEl.style.display = 'block';
      if (placeholder) placeholder.style.display = 'none';
    }
  }

  // ── Wire up student select change event ──────────────────────
  if (atSelect) {
    atSelect.addEventListener('change', () => {
      const sid = atSelect.value;
      if (!sid) {
        document.getElementById('at-placeholder').style.display = 'block';
        document.getElementById('at-placeholder').textContent = 'Choose a student to view their complete activity feed';
        document.getElementById('at-feed').style.display = 'none';
        document.getElementById('at-summary').innerHTML = '';
        return;
      }
      const studentName = atSelect.options[atSelect.selectedIndex].text;
      loadTrackerActivity(sid, studentName);
    });
  }
}

/* ═══════════════════════════════════════════════════════════════
   POSTING DAYS ANALYSIS — count distinct days per student per forum
   ═══════════════════════════════════════════════════════════════ */
async function analyzePostingDays(currentUserId) {
  const forumPostingDays = {};  // forumName → { studentId → count of distinct days }
  const forumOrder = [];        // preserves course sequence
  // Track unique days per student per FORUM (across all topics in that forum)
  const daysSets = {};          // forumName → { studentId → Set<dateString> }

  try {
    console.log('[PostingDays] Starting analysis for user', currentUserId);
    const rawForums = await forums();
    console.log('[PostingDays] Raw forums response type:', typeof rawForums, Array.isArray(rawForums) ? 'array(' + rawForums.length + ')' : '');

    // Handle paged response: { Objects: [...] } or { Items: [...] } or plain array
    const allForums = Array.isArray(rawForums) ? rawForums
      : Array.isArray(rawForums?.Objects) ? rawForums.Objects
      : Array.isArray(rawForums?.Items) ? rawForums.Items
      : [];

    if (!allForums.length) {
      console.warn('[PostingDays] No forums found — raw response:', rawForums);
      return { forumPostingDays, forumOrder };
    }
    console.log('[PostingDays] Processing', allForums.length, 'forums. First forum keys:', Object.keys(allForums[0]).join(', '));

    for (const forum of allForums) {
      const fId = forum.ForumId || forum.Id;
      const fName = (forum.Name || forum.Title || 'Forum');
      if (isExcludedForum(fName)) { console.log('[PostingDays] Excluding forum:', fName); continue; }

      forumOrder.push(fName);
      forumPostingDays[fName] = {};
      daysSets[fName] = {};

      let rawTopics = [];
      try { rawTopics = await forumTopics(fId); } catch(te) { console.warn('[PostingDays] Failed to get topics for forum', fName, ':', te.message || te); continue; }

      // Handle paged topic responses
      const allTopics = Array.isArray(rawTopics) ? rawTopics
        : Array.isArray(rawTopics?.Objects) ? rawTopics.Objects
        : Array.isArray(rawTopics?.Items) ? rawTopics.Items
        : [];

      if (!allTopics.length) { console.log('[PostingDays] No topics in forum:', fName); continue; }
      console.log('[PostingDays] Forum "' + fName + '" has', allTopics.length, 'topics. First topic keys:', Object.keys(allTopics[0]).join(', '));

      for (const topic of allTopics) {
        const tId = topic.TopicId || topic.Id;
        let rawPosts = [];
        try { rawPosts = await topicPosts(fId, tId); } catch(pe) { console.warn('[PostingDays] Failed to get posts for topic', tId, ':', pe.message || pe); continue; }

        // Handle paged post responses
        const posts = Array.isArray(rawPosts) ? rawPosts
          : Array.isArray(rawPosts?.Objects) ? rawPosts.Objects
          : Array.isArray(rawPosts?.Items) ? rawPosts.Items
          : [];

        if (!posts.length) continue;
        if (allTopics.indexOf(topic) === 0) console.log('[PostingDays] First post keys:', Object.keys(posts[0]).join(', '));

        for (const post of posts) {
          const authorId = String(post.PostingUserId || post.UserId || '');
          if (!authorId || authorId === String(currentUserId)) continue;

          const rawDate = post.DatePosted || post.LastEditedDate || post.CreatedDate || '';
          const dateStr = rawDate.split('T')[0];
          if (!dateStr) continue;

          if (!daysSets[fName][authorId]) daysSets[fName][authorId] = new Set();
          daysSets[fName][authorId].add(dateStr);
        }
      }

      // Convert Sets to counts
      for (const [uid, dates] of Object.entries(daysSets[fName])) {
        forumPostingDays[fName][uid] = dates.size;
      }
      console.log('[PostingDays] Forum "' + fName + '": ' + Object.keys(daysSets[fName]).length + ' students with posts');
    }

    console.log('[PostingDays] Complete — ' + forumOrder.length + ' forums processed, ' + Object.values(forumPostingDays).reduce((a, f) => a + Object.keys(f).length, 0) + ' student-forum entries');
  } catch(e) {
    console.warn('Posting days analysis failed:', e.message || e, e.stack || '');
  }

  return { forumPostingDays, forumOrder };
}

/* ═══════════════════════════════════════════════════════════════
   RENDER — Posting Days Matrix
   ═══════════════════════════════════════════════════════════════ */
function renderPostingDays(postingData, classList, currentUserId) {
  const { forumPostingDays, forumOrder } = postingData;

  // Filter & sort students — classMembers uses { id, name }
  const students = classList
    .filter(s => String(s.Identifier || s.id) !== String(currentUserId))
    .map(s => {
      const sid = String(s.Identifier || s.id);
      const fn = s.FirstName || (s.name ? s.name.split(' ')[0] : '');
      const ln = s.LastName || (s.name ? s.name.split(' ').slice(1).join(' ') : '');
      return { id: sid, name: `${ln}, ${fn}`.replace(/^, |, $/, '').trim() || s.name || sid, firstName: fn, lastName: ln };
    })
    .sort((a, b) => {
      const lc = (a.lastName || '').localeCompare(b.lastName || '');
      return lc !== 0 ? lc : (a.firstName || '').localeCompare(b.firstName || '');
    });

  if (!students.length || !forumOrder.length) {
    return '<div class="cd"><h3>Posting Days</h3><p style="color:var(--lg);padding:12px 0">No data available.</p></div>';
  }

  // Pre-calculate totals per student
  const studentTotals = {};
  students.forEach(s => {
    let total = 0;
    forumOrder.forEach(f => { total += (forumPostingDays[f]?.[s.id] || 0); });
    studentTotals[s.id] = total;
  });

  // KPIs
  const totalStudents = students.length;
  const totalForums = forumOrder.length;
  const allTotals = Object.values(studentTotals);
  const avgDays = (allTotals.reduce((a, b) => a + b, 0) / totalStudents).toFixed(1);

  let html = `<div class="kr">
    <div class="kc" data-tip="Number of students enrolled in this course, excluding the instructor."><div class="kl">Total Students</div><div class="kv">${totalStudents}</div></div>
    <div class="kc gold" data-tip="Count of discussion forums with at least one recorded posting day."><div class="kl">Active Forums</div><div class="kv">${totalForums}</div></div>
    <div class="kc dark" data-tip="Average number of distinct posting days per student across all active forums."><div class="kl">Avg Posting Days</div><div class="kv">${avgDays}</div>
      <div class="ks">per student across all forums</div></div>
  </div>`;

  // Table
  html += '<div class="cd"><h3>Distinct Posting Days by Student</h3><div class="pd-wrap"><table class="pd-table"><thead><tr>';
  html += '<th data-tip="Click to sort students alphabetically by last name.">Student</th>';
  forumOrder.forEach(f => {
    html += `<th title="${esc(f)}" data-tip="Distinct days this student posted. Click to sort.">${esc(abbreviateForumName(f))}</th>`;
  });
  html += '<th data-tip="Sum of posting days across all forums for this student. Click to sort.">Total</th></tr></thead><tbody>';

  // Student rows
  students.forEach(s => {
    html += `<tr><td>${esc(s.name)}</td>`;
    forumOrder.forEach(f => {
      const days = forumPostingDays[f]?.[s.id] || 0;
      if (days === 0) {
        html += '<td class="pd-cell-0">0</td>';
      } else {
        html += `<td class="pd-cell-num">${days}</td>`;
      }
    });
    const total = studentTotals[s.id] || 0;
    html += `<td class="pd-total">${total}</td></tr>`;
  });

  // Percentage row
  html += '<tr class="pd-pct-row"><td data-tip="Percentage of students who posted at least once in each forum.">% Posted</td>';
  forumOrder.forEach(f => {
    const posted = students.filter(s => (forumPostingDays[f]?.[s.id] || 0) > 0).length;
    const pct = Math.round((posted / totalStudents) * 100);
    let cls = 'pd-pct-mid';
    let tip = 'Moderate: 1–74% of students posted in this forum.';
    if (pct >= 75) { cls = 'pd-pct-100'; tip = 'Excellent: 75%+ of students posted in this forum.'; }
    else if (pct === 0) { cls = 'pd-pct-0'; tip = 'No students posted in this forum.'; }
    html += `<td><span class="pd-pct-pill ${cls}" data-tip="${tip}">${pct}%</span></td>`;
  });
  // Total column percentage: % of students with at least 1 total day
  const anyActivity = students.filter(s => (studentTotals[s.id] || 0) > 0).length;
  const totalPct = Math.round((anyActivity / totalStudents) * 100);
  let totalCls = 'pd-pct-mid';
  if (totalPct >= 75) totalCls = 'pd-pct-100';
  else if (totalPct === 0) totalCls = 'pd-pct-0';
  html += `<td class="pd-total"><span class="pd-pct-pill ${totalCls}">${totalPct}%</span></td></tr>`;

  html += '</tbody></table></div></div>';
  return html;
}

   FEEDBACK SUMMARY — collect rubric + overall feedback per assignment

// Preload assignment list and rubric definitions (called once at init)
async function collectAssignmentData() {
  const assignments = [];   // { id, name, rubricIds:[], rubricMeta:{} }
  const rubricCache = {};   // rubricId → { name, criteria: [{id, name, sortOrder, maxPoints}] }

  try {
    let folders = await dropboxFolders();
    if (!Array.isArray(folders)) folders = folders?.Objects || folders?.Items || [];

    // Sort by SortOrder or Name
    folders.sort((a, b) => (a.SortOrder ?? 999) - (b.SortOrder ?? 999));

    for (const folder of folders) {
      const fId = folder.Id || folder.FolderId;
      const fName = folder.Name || 'Assignment';
      const rubricIds = [];

      // Extract rubric associations from Assessment block
      const rubrics = folder.Assessment?.Rubrics || folder.Rubrics || [];
      for (const rub of rubrics) {
        const rId = rub.RubricId || rub.Id;
        if (!rId) continue;
        rubricIds.push(rId);

        // The folder's Assessment.Rubrics may already include the rubric Name
        const folderRubricName = rub.Name || rub.RubricName || '';

        if (!rubricCache[rId]) {
          // Criteria will be auto-discovered from feedback data
          rubricCache[rId] = { name: folderRubricName || `Rubric ${rId}`, criteria: [] };
        }
      }

      assignments.push({ id: fId, name: fName, rubricIds });
    }
  } catch(e) {
    console.warn('Failed to load assignment data:', e);
  }

  return { assignments, rubricCache };
}

// ── Helper: extract RichText from any object that might be RichText ──
function extractRichText(obj) {
  if (!obj) return '';
  if (typeof obj === 'string') return obj;
  return obj.Html || obj.Text || obj.Content || obj.html || obj.text || '';
}

/** Prefer plain Text; otherwise strip Html/Content so empty <p></p> does not count. */
function richTextPlain(obj) {
  if (!obj) return '';
  if (typeof obj === 'string') {
    return obj.replace(/<[^>]*>/g, ' ').replace(/&nbsp;/gi, ' ').replace(/\s+/g, ' ').trim();
  }
  const t = String(obj.Text || obj.text || '').trim();
  if (t) return t;
  const h = obj.Html || obj.html || obj.Content || obj.content || '';
  return String(h).replace(/<[^>]*>/g, ' ').replace(/&nbsp;/gi, ' ').replace(/\s+/g, ' ').trim();
}

function normalizeItemName(s) {
  return String(s || '')
    .toLowerCase()
    .replace(/&amp;/g, '&')
    .replace(/[^a-z0-9]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

/**
 * Detect overall + rubric-row comments (and feedback file attachments)
 * on a Dropbox Feedback / DropboxFeedbackOut block.
 */
function scoreDropboxFeedbackBlock(fbBlock) {
  let hasOverall = false;
  let hasRubric = false;
  if (!fbBlock || typeof fbBlock !== 'object') return { hasOverall, hasRubric, hasAttachment: false };

  const fbRich = fbBlock.Feedback;
  if (richTextPlain(fbRich)) hasOverall = true;
  // HTML-only feedback that embeds a file / image (common when the
  // "attachment" is inline rather than in the Files array)
  const rawHtml = (fbRich && (fbRich.Html || fbRich.html)) || '';
  if (!hasOverall && rawHtml && /d2lfile|viewfile|\/le\/file|attachment|data-d2l-file|img\s/i.test(rawHtml)) {
    hasOverall = true;
  }

  const hasAttachment = (Array.isArray(fbBlock.Files) && fbBlock.Files.length > 0)
    || (Array.isArray(fbBlock.Links) && fbBlock.Links.length > 0);
  if (hasAttachment) hasOverall = true;

  const ra = fbBlock.RubricAssessments || [];
  if (Array.isArray(ra)) {
    ra.forEach(rub => {
      if (richTextPlain(rub.OverallFeedback)) hasOverall = true;
      const outcomes = rub.CriteriaOutcome || rub.Criteria || [];
      outcomes.forEach(co => {
        if (richTextPlain(co.Feedback)) hasRubric = true;
      });
    });
  }
  return { hasOverall, hasRubric, hasAttachment };
}

function dropboxEntityUserId(sub) {
  const ent = sub?.Entity || {};
  return String(
    ent.EntityId ||
    ent.Identifier ||
    ent.UserId ||
    sub?.SubmittedBy?.Identifier ||
    sub?.SubmittedBy?.Id ||
    sub?.UserId ||
    ''
  );
}

function dropboxStatusNum(sub) {
  const st = sub?.Status;
  if (st == null) return null;
  const n = Number(st);
  if (!Number.isNaN(n)) return n;
  const s = String(st).toLowerCase();
  if (s.includes('publish')) return 3;
  if (s.includes('draft')) return 2;
  if (s.includes('submit')) return 1;
  if (s.includes('unsubmit')) return 0;
  return null;
}

// ── Helper: walk an object recursively to find all string values ──
function deepFindStrings(obj, depth) {
  if (!obj || depth > 4) return '';
  if (typeof obj === 'string') return obj;
  if (Array.isArray(obj)) return obj.map(x => deepFindStrings(x, depth + 1)).filter(Boolean).join(' ');
  if (typeof obj === 'object') {
    for (const k of Object.keys(obj)) {
      const kl = k.toLowerCase();
      if (kl.includes('feedback') || kl.includes('comment') || kl === 'html' || kl === 'text') {
        const v = deepFindStrings(obj[k], depth + 1);
        if (v) return v;
      }
    }
  }
  return '';
}

// ── Helper: find a numeric score in a criterion outcome object ──
function extractScore(co) {
  for (const k of Object.keys(co)) {
    const kl = k.toLowerCase();
    if ((kl === 'score' || kl === 'points' || kl === 'value' || kl.includes('score')) && typeof co[k] === 'number') return co[k];
  }
  // Check nested Level object
  if (co.Level && typeof co.Level === 'object') {
    for (const k of Object.keys(co.Level)) {
      if (typeof co.Level[k] === 'number' && k.toLowerCase().includes('score') || k.toLowerCase() === 'points') return co.Level[k];
    }
  }
  return null;
}

// ── Helper: find a criterion/row ID in an outcome object ──
function extractCriterionId(co) {
  for (const k of Object.keys(co)) {
    const kl = k.toLowerCase();
    if ((kl === 'criterionid' || kl === 'id' || kl === 'criterion_id') && co[k]) return co[k];
  }
  return null;
}

// Load feedback for a specific student across all assignments
// Now uses known Brightspace API structure:
//   {Files, Links, Score, Feedback:{Text,Html}, RubricAssessments:[...], IsGraded, GradedSymbol}
//   RubricAssessments[]: {RubricId, OverallScore, OverallFeedback:{Text,Html}, CriteriaOutcome:[...]}
//   CriteriaOutcome[]: {CriterionId, LevelId, Score, ScoreIsOverridden, Feedback:{Text,Html}, FeedbackIsOverridden}
async function loadStudentFeedback(studentId, assignments, rubricCache) {
  const result = {};

  const fetches = assignments.map(async (asn) => {
    try {
      const fb = await dropboxFeedback(asn.id, studentId);

      const entry = { overallFeedback: '', rubricFeedback: {} };

      // Overall feedback — direct known key
      entry.overallFeedback = extractRichText(fb.Feedback) || '';

      // Rubric assessments — direct known key
      const rubAssessments = fb.RubricAssessments || [];

      for (const ra of rubAssessments) {
        const rId = ra.RubricId;
        if (!rId) continue;

        entry.rubricFeedback[rId] = {};

        // Overall rubric feedback
        const overallTxt = extractRichText(ra.OverallFeedback);
        if (overallTxt) entry.rubricFeedback[rId].__overall__ = overallTxt;

        // Criterion outcomes — direct known key
        const outcomes = ra.CriteriaOutcome || [];

        for (const co of outcomes) {
          const cId = co.CriterionId;
          if (!cId) continue;
          const txt = extractRichText(co.Feedback);
          const score = (typeof co.Score === 'number') ? co.Score : null;
          if (txt || score !== null) {
            entry.rubricFeedback[rId][cId] = { text: txt, score };
          }
        }

        // ── AUTO-DISCOVER CRITERIA from feedback data ──
        const existingCriteria = rubricCache?.[rId]?.criteria || [];
        if (outcomes.length > 0 && existingCriteria.length === 0) {
          rubricCache[rId].criteria = outcomes.map((co, idx) => {
            const thisScore = (typeof co.Score === 'number') ? co.Score : 0;
            return { id: co.CriterionId, sortOrder: idx, maxPoints: thisScore };
          });
          console.log(`Auto-discovered ${outcomes.length} criteria for rubric ${rId}`);
        }

        // ── UPDATE maxPoints: track highest score seen per criterion ──
        if (rubricCache?.[rId]?.criteria.length > 0) {
          for (const co of outcomes) {
            if (typeof co.Score === 'number' && co.CriterionId) {
              const crit = rubricCache[rId].criteria.find(c => String(c.id) === String(co.CriterionId));
              if (crit && co.Score > crit.maxPoints) crit.maxPoints = co.Score;
            }
          }
        }
      }

      result[asn.id] = entry;
    } catch(e) {
      // Suppress 404s (expected for ungraded assignments)
      if (!String(e).includes('404')) console.warn(`Feedback error: folder ${asn.id}, user ${studentId}:`, e.message);
      result[asn.id] = { overallFeedback: '', rubricFeedback: {} };
    }
  });

  await Promise.allSettled(fetches);
  return result;
}

// Render the feedback summary table for a given student
function renderFeedbackTable(studentFeedback, assignments, rubricCache) {
  if (!assignments.length) {
    return '<div class="fb-nodata">No assignments found in this course.</div>';
  }

  // Collect all unique rubric IDs in order across assignments
  const seenRubrics = new Set();
  const rubricOrder = [];
  assignments.forEach(asn => {
    (asn.rubricIds || []).forEach(rId => {
      if (!seenRubrics.has(rId)) { seenRubrics.add(rId); rubricOrder.push(rId); }
    });
  });

  const totalCols = assignments.length * 2; // score + feedback per assignment

  // Build colgroup: (score + feedback) per assignment — NO first label column
  let html = '<div class="fb-wrap"><table class="fb-table"><colgroup>';
  assignments.forEach(() => {
    html += '<col class="fb-col-score"/>';
    html += '<col class="fb-col-fb"/>';
  });
  html += '</colgroup>';

  // Header row 1: assignment names (each spans 2 cols)
  html += '<thead><tr>';
  assignments.forEach(asn => {
    const short = asn.name.length > 20 ? asn.name.substring(0, 19) + '\u2026' : asn.name;
    html += `<th colspan="2" class="fb-asn-hdr" title="${esc(asn.name)}">${esc(short)}</th>`;
  });
  html += '</tr>';

  // Header row 2: Score | Feedback sub-headers under each assignment
  html += '<tr>';
  assignments.forEach(() => {
    html += '<th class="fb-sub-hdr fb-sub-score" data-tip="Points earned out of maximum for this rubric criterion.">Score</th>';
    html += '<th class="fb-sub-hdr fb-sub-fb" data-tip="Instructor comments on this rubric criterion.">Feedback</th>';
  });
  html += '</tr></thead><tbody>';

  // For each rubric → for each criterion: data row with score + feedback per assignment
  rubricOrder.forEach(rId => {
    const rDef = rubricCache[rId] || { name: 'Rubric', criteria: [] };

    rDef.criteria.forEach(criterion => {
      html += '<tr>';
      assignments.forEach(asn => {
        const fb = studentFeedback[asn.id];
        const rubFb = fb?.rubricFeedback?.[rId] || {};
        const entry = rubFb[criterion.id];

        let text = '', score = null;
        if (entry && typeof entry === 'object') {
          text = entry.text || '';
          score = entry.score;
        } else if (typeof entry === 'string') {
          text = entry;
        }

        // Color based ONLY on score/rank
        let colorCls = 'fb-score-none';
        let scoreTip = '';
        if (score !== null && score !== undefined && criterion.maxPoints > 0) {
          const pct = (score / criterion.maxPoints) * 100;
          if (pct >= 75) { colorCls = 'fb-score-high'; scoreTip = 'Strong performance: 75%+ of maximum points.'; }
          else if (pct >= 40) { colorCls = 'fb-score-mid'; scoreTip = 'Moderate: 40–74% of maximum points.'; }
          else { colorCls = 'fb-score-low'; scoreTip = 'Needs improvement: under 40% of maximum points.'; }
        } else if (score !== null && score !== undefined) {
          colorCls = 'fb-score-mid';
          scoreTip = 'Moderate: 40–74% of maximum points.';
        }

        // Score cell (left divider marks assignment boundary)
        const scoreDisplay = (score !== null && score !== undefined)
          ? `${score}/${criterion.maxPoints}` : '\u2014';
        html += `<td class="fb-score-cell fb-asn-divider ${colorCls}" ${scoreTip ? `data-tip="${scoreTip}"` : ''}>${scoreDisplay}</td>`;

        // Feedback cell
        html += text
          ? `<td class="fb-text ${colorCls}" data-tip="Instructor comments on this rubric criterion.">${text}</td>`
          : `<td class="fb-empty ${colorCls}">\u2014</td>`;
      });
      html += '</tr>';
    });
  });

  // Overall Feedback: banner row + data row
  html += `<tr class="fb-overall-hdr"><td colspan="${totalCols}">Overall Feedback</td></tr>`;
  html += '<tr class="fb-overall">';
  assignments.forEach(asn => {
    const fb = studentFeedback[asn.id];
    const text = fb?.overallFeedback || '';
    html += text
      ? `<td colspan="2" class="fb-text">${text}</td>`
      : '<td colspan="2" class="fb-empty">\u2014</td>';
  });
  html += '</tr>';

  html += '</tbody></table></div>';
  return html;
}

/* ═══════════════════════════════════════════════════════════════
   MISSING GRADES — identify ungraded items past due + 1 week
   ═══════════════════════════════════════════════════════════════ */

// Flatten grade items from Brightspace's nested category structure
function flattenGradeItems(items) {
  const result = [];
  if (!Array.isArray(items)) return result;
  for (const item of items) {
    // Category — recurse into children
    if (item.GradeObjectTypeName === 'Category' || item.CategoryId === undefined) {
      if (Array.isArray(item.Objects)) {
        result.push(...flattenGradeItems(item.Objects));
      }
    }
    // Numeric or pass/fail grade item
    if (item.GradeObjectTypeName === 'Numeric' || item.GradeObjectTypeName === 'PassFail' ||
        item.GradeObjectTypeName === 'SelectBox' || item.GradeObjectTypeName === 'Text' ||
        (item.Id && item.Name && item.MaxPoints !== undefined)) {
      result.push(item);
    }
  }
  return result;
}

async function collectMissingGradesData(classList, currentUserId) {
  const items = [];     // { id, name, maxPoints, dueDate, isPastGracePeriod }
  const studentGrades = {}; // studentId → { gradeItemId → { points, displayedGrade } }

  try {
    // Fetch all grade items
    let rawItems = await gradeItems();
    // The API may return an array or an object with Objects property
    if (!Array.isArray(rawItems)) rawItems = rawItems?.Objects || rawItems?.Items || [];
    const flatItems = flattenGradeItems(rawItems);

    const now = new Date();
    const oneWeekMs = 7 * 24 * 60 * 60 * 1000;

    for (const gi of flatItems) {
      // Skip "Final Calculated Grade" and "Final Adjusted Grade" (system items)
      if (gi.GradeObjectTypeName === 'Calculated' || gi.GradeObjectTypeName === 'Formula') continue;
      if (/final\s*(calculated|adjusted)\s*grade/i.test(gi.Name)) continue;

      const dueDate = gi.DueDate ? new Date(gi.DueDate) : null;
      const isPastGracePeriod = dueDate ? (now - dueDate > oneWeekMs) : false;

      items.push({
        id: gi.Id || gi.GradeObjectId,
        name: gi.Name,
        maxPoints: gi.MaxPoints || 0,
        dueDate,
        isPastGracePeriod
      });
    }

    // Fetch grade values for each student (parallel with concurrency limit)
    // classMembers uses { id, name } — normalize access
    const students = classList.filter(s => String(s.Identifier || s.id) !== String(currentUserId));
    const BATCH = 5;
    for (let i = 0; i < students.length; i += BATCH) {
      const batch = students.slice(i, i + BATCH);
      await Promise.allSettled(batch.map(async (student) => {
        const sid = String(student.Identifier || student.id);
        studentGrades[sid] = {};
        try {
          let vals = await myGrades(sid);
          if (!Array.isArray(vals)) vals = vals?.Objects || vals?.Items || [];
          for (const v of vals) {
            const gv = v.GradeValue || v;
            const gId = gv.GradeObjectIdentifier || gv.GradeObjectId || v.GradeObjectIdentifier || v.GradeObjectId;
            if (!gId) continue;
            const points = gv.PointsNumerator ?? gv.GradeValue ?? null;
            const displayed = gv.DisplayedGrade || gv.GradeFormattedValue || '';
            studentGrades[sid][gId] = { points, displayed };
          }
        } catch(e) {
          // Suppress — student may not have any grades yet
          if (!String(e).includes('404')) console.warn(`Grade values error for ${sid}:`, e.message);
        }
      }));
    }
  } catch(e) {
    console.warn('Failed to collect missing grades data:', e);
  }

  // Sort items by due date, falling back to week number in name
  function mgWeekNum(name) {
    const m = (name || '').match(/week\s*(\d+)/i);
    return m ? parseInt(m[1], 10) : 999;
  }
  items.sort((a, b) => {
    if (a.dueDate && b.dueDate) return a.dueDate.getTime() - b.dueDate.getTime();
    if (a.dueDate && !b.dueDate) return -1;
    if (!a.dueDate && b.dueDate) return 1;
    return mgWeekNum(a.name) - mgWeekNum(b.name);
  });

  return { items, studentGrades };
}

function renderMissingGrades(mgData, classList, currentUserId) {
  const { items, studentGrades } = mgData;

  if (!items.length) {
    return '<div class="fb-nodata">No grade items found in this course.</div>';
  }

  // classMembers uses { id, name } — normalize access
  const students = classList
    .filter(s => String(s.Identifier || s.id) !== String(currentUserId))
    .map(s => {
      const sid = String(s.Identifier || s.id);
      const fn = s.FirstName || (s.name ? s.name.split(' ')[0] : '');
      const ln = s.LastName || (s.name ? s.name.split(' ').slice(1).join(' ') : '');
      return { id: sid, name: `${ln}, ${fn}`.replace(/^, |, $/, '').trim() || s.name || sid, firstName: fn, lastName: ln };
    })
    .sort((a, b) => {
      const lc = (a.lastName || '').localeCompare(b.lastName || '');
      return lc !== 0 ? lc : (a.firstName || '').localeCompare(b.firstName || '');
    });

  if (!students.length) {
    return '<div class="fb-nodata">No students found.</div>';
  }

  // Count missing per student and per item, and track which items have at least one grade
  const missingPerStudent = {};
  const missingPerItem = {};
  const itemHasAnyGrade = {};  // itemId → boolean: true if at least one student has a grade
  students.forEach(s => { missingPerStudent[s.id] = 0; });
  items.forEach(gi => { missingPerItem[gi.id] = 0; itemHasAnyGrade[gi.id] = false; });

  // First pass: determine which items have at least one graded student
  students.forEach(s => {
    items.forEach(gi => {
      const gv = studentGrades[s.id]?.[gi.id];
      if (gv && (gv.points !== null && gv.points !== undefined)) {
        itemHasAnyGrade[gi.id] = true;
      }
    });
  });

  // Second pass: count missing
  students.forEach(s => {
    items.forEach(gi => {
      const gv = studentGrades[s.id]?.[gi.id];
      const hasGrade = gv && (gv.points !== null && gv.points !== undefined);
      if (!hasGrade && gi.isPastGracePeriod) {
        missingPerStudent[s.id]++;
        missingPerItem[gi.id]++;
      }
    });
  });

  // KPIs
  const totalMissing = Object.values(missingPerStudent).reduce((a, b) => a + b, 0);
  const studentsWithMissing = Object.values(missingPerStudent).filter(n => n > 0).length;
  const itemsWithMissing = Object.values(missingPerItem).filter(n => n > 0).length;

  let html = `<div class="kr">
    <div class="kc${totalMissing > 0 ? '' : ' gold'}" data-tip="Total count of ungraded assignments past their due date plus 7-day grace period."><div class="kl">Total Missing</div><div class="kv">${totalMissing}</div>
      <div class="ks">grades past due + 7 days</div></div>
    <div class="kc${studentsWithMissing > 0 ? '' : ' gold'}" data-tip="Number of students with at least one ungraded item past the grace period."><div class="kl">Students Affected</div><div class="kv">${studentsWithMissing}</div>
      <div class="ks">of ${students.length} students</div></div>
    <div class="kc dark" data-tip="Total grade items in this course. The count shows how many have missing grades."><div class="kl">Grade Items</div><div class="kv">${items.length}</div>
      <div class="ks">${itemsWithMissing} with missing grades</div></div>
  </div>`;

  // Table
  html += '<div class="cd"><h3>Missing Grades Overview</h3><div class="mg-wrap"><table class="mg-table"><thead><tr>';
  html += '<th data-tip="Click to sort by student last name.">Student</th>';
  items.forEach(gi => {
    const short = gi.name.length > 18 ? gi.name.substring(0, 17) + '\u2026' : gi.name;
    const dueTxt = gi.dueDate ? `Due: ${gi.dueDate.toLocaleDateString()}` : 'No due date';
    html += `<th title="${esc(gi.name)}\n${dueTxt}" data-tip="Grade status for this assignment. MISSING = past due + 7 days with no grade.">${esc(short)}</th>`;
  });
  html += '<th title="Total missing grades" data-tip="Total missing grades for this student. Click to sort.">Missing</th></tr></thead><tbody>';

  // Student rows
  students.forEach(s => {
    const mc = missingPerStudent[s.id];
    html += `<tr><td>${esc(s.name)}</td>`;
    items.forEach(gi => {
      const gv = studentGrades[s.id]?.[gi.id];
      const hasGrade = gv && (gv.points !== null && gv.points !== undefined);

      if (hasGrade) {
        // Show the grade
        const display = gv.displayed || (gv.points !== null ? `${gv.points}/${gi.maxPoints}` : '\u2014');
        html += `<td class="mg-graded" data-tip="Grade submitted.">${esc(String(display))}</td>`;
      } else if (gi.isPastGracePeriod) {
        // Missing — past due + 1 week
        html += '<td class="mg-missing" data-tip="Grade not submitted. Past due date + 7-day grace period.">MISSING</td>';
      } else if (itemHasAnyGrade[gi.id]) {
        // Column has some grades but this student hasn't been graded yet — red dot
        html += '<td class="mg-notdue-alert" data-tip="Other students have been graded for this item but this student has not."><span class="mg-red-dot">\u25CF</span></td>';
      } else {
        // Not yet due or within grace period and nothing graded yet — dash
        html += '<td class="mg-notdue" data-tip="Due date not yet reached or within grace period.">—</td>';
      }
    });
    // Missing count
    let pillCls = 'mg-count-ok';
    if (mc > 2) pillCls = 'mg-count-bad';
    else if (mc > 0) pillCls = 'mg-count-warn';
    html += `<td><span class="mg-count-pill ${pillCls}">${mc}</span></td></tr>`;
  });

  // Summary row — missing count per item
  html += '<tr class="mg-summary-row"><td>Missing Count</td>';
  items.forEach(gi => {
    const mc = missingPerItem[gi.id];
    let pillCls = 'mg-count-ok';
    if (mc > 2) pillCls = 'mg-count-bad';
    else if (mc > 0) pillCls = 'mg-count-warn';
    html += `<td><span class="mg-count-pill ${pillCls}">${mc}</span></td>`;
  });
  html += `<td><span class="mg-count-pill ${totalMissing > 2 ? 'mg-count-bad' : totalMissing > 0 ? 'mg-count-warn' : 'mg-count-ok'}">${totalMissing}</span></td></tr>`;

  html += '</tbody></table></div></div>';
  return html;
}
