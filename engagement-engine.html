/* ═══════════════════════════════════════════════════════════════
   ASSIGNMENT ENGAGEMENT TABS — shared dropbox loader + 3 views
   Status matrix · Ungraded queue · Assignment dates calendar
   EntityDropbox Status: 0 unsubmitted, 1 submitted, 2 draft, 3 published
   ═══════════════════════════════════════════════════════════════ */
window._asnBundle = null;
window._asnCalMonth = null;
window._asnUngradedItems = [];

function asnMarkUrl(folderId) {
  return `/d2l/lms/dropbox/admin/mark/folder_submissions_users.d2l?db=${folderId}&ou=${OU_ID}`;
}

function asnEntityUserId(entity) {
  const ent = entity?.Entity || {};
  return String(ent.EntityId || ent.Identifier || entity?.UserId || '');
}

function asnLatestSubmissionDate(entity) {
  const subs = entity?.Submissions;
  if (!Array.isArray(subs) || !subs.length) return null;
  let best = null;
  subs.forEach(s => {
    const d = s.SubmissionDate || s.DateSubmitted;
    if (!d) return;
    if (!best || new Date(d) > new Date(best)) best = d;
  });
  return best;
}

function asnFeedbackDate(entity) {
  const fb = entity?.Feedback;
  if (!fb) return null;
  return fb.GradedDate || fb.ScoreDate || entity.CompletionDate || null;
}

function buildDemoAssignmentBundle(classMembers) {
  const students = (classMembers || []).slice(0, 14);
  const folders = ['HW #1', 'HW #2', 'Essay Draft', 'Midterm Project', 'Reflection'].map((name, i) => ({
    id: 500 + i,
    name,
    dueDate: new Date(Date.now() - (14 - i * 5) * 86400000).toISOString(),
    endDate: null,
    gradeItemId: 600 + i
  }));
  const byFolder = {};
  const queue = [];
  const calendarEvents = [];
  folders.forEach((f, fi) => {
    byFolder[f.id] = {};
    if (f.dueDate) {
      calendarEvents.push({
        date: f.dueDate.split('T')[0], type: 'due',
        folderId: f.id, folderName: f.name, studentName: '', studentId: '',
        url: asnMarkUrl(f.id), label: f.name + ' due'
      });
    }
    students.forEach((m, si) => {
      const roll = (fi + si) % 5;
      const status = roll === 0 ? 0 : roll === 1 ? 1 : roll === 2 ? 2 : 3;
      const subDate = status > 0 ? new Date(Date.now() - (10 - si) * 86400000).toISOString() : null;
      const gradedDate = status === 3 ? new Date(Date.now() - (3) * 86400000).toISOString() : null;
      byFolder[f.id][m.id] = {
        status, studentId: m.id, studentName: m.name,
        submissionDate: subDate, feedbackDate: gradedDate,
        folderId: f.id, folderName: f.name
      };
      if (status === 1 || status === 2) {
        queue.push({
          status, studentId: m.id, studentName: m.name,
          folderId: f.id, folderName: f.name,
          submissionDate: subDate, url: asnMarkUrl(f.id),
          daysWaiting: subDate ? Math.max(0, Math.round((Date.now() - new Date(subDate).getTime()) / 86400000)) : 0
        });
      }
      if (subDate) {
        calendarEvents.push({
          date: subDate.split('T')[0], type: 'submission',
          folderId: f.id, folderName: f.name, studentName: m.name, studentId: m.id,
          url: asnMarkUrl(f.id), label: m.name + ' · ' + f.name
        });
      }
      if (gradedDate) {
        calendarEvents.push({
          date: gradedDate.split('T')[0], type: 'graded',
          folderId: f.id, folderName: f.name, studentName: m.name, studentId: m.id,
          url: asnMarkUrl(f.id), label: 'Graded · ' + f.name
        });
      }
    });
  });
  queue.sort((a, b) => (b.daysWaiting || 0) - (a.daysWaiting || 0));
  return { folders, students, byFolder, queue, calendarEvents, isDemo: true };
}

async function ensureAssignmentBundle(classMembers) {
  if (window._asnBundle) return window._asnBundle;

  if (_isDemoMode) {
    window._asnBundle = buildDemoAssignmentBundle(classMembers);
    return window._asnBundle;
  }

  let folders = [];
  try {
    folders = await dropboxFolders();
    if (!Array.isArray(folders)) folders = folders?.Objects || folders?.Items || [];
  } catch (e) {
    console.warn('[Assignments] dropboxFolders failed:', e.message || e);
    window._asnBundle = buildDemoAssignmentBundle(classMembers);
    return window._asnBundle;
  }

  folders = folders
    .filter(f => f && (f.Id || f.FolderId) && !f.IsHidden)
    .map(f => ({
      id: f.Id || f.FolderId,
      name: f.Name || ('Assignment ' + (f.Id || f.FolderId)),
      dueDate: f.DueDate || f.EndDate || null,
      endDate: f.EndDate || null,
      gradeItemId: f.GradeItemId || null,
      raw: f
    }))
    .sort((a, b) => {
      const da = a.dueDate ? new Date(a.dueDate).getTime() : Infinity;
      const db = b.dueDate ? new Date(b.dueDate).getTime() : Infinity;
      if (da !== db) return da - db;
      return a.name.localeCompare(b.name);
    });

  const studentMap = {};
  (classMembers || []).forEach(m => { studentMap[String(m.id)] = m.name; });
  const students = (classMembers || []).map(m => ({ id: String(m.id), name: m.name }));

  const byFolder = {};
  const queue = [];
  const calendarEvents = [];
  const now = Date.now();

  folders.forEach(f => {
    if (f.dueDate) {
      const dk = postDateKey(f.dueDate);
      if (dk) {
        calendarEvents.push({
          date: dk, type: 'due',
          folderId: f.id, folderName: f.name, studentName: '', studentId: '',
          url: asnMarkUrl(f.id), label: f.name + ' due'
        });
      }
    }
  });

  // Sequential folder fetches — same pattern as Feedback tab (stable under rate limits)
  for (let i = 0; i < folders.length; i++) {
    const f = folders[i];
    byFolder[f.id] = {};
    let entities = [];
    try {
      entities = await dropboxSubs(f.id);
      if (!Array.isArray(entities)) entities = entities?.Objects || entities?.Items || [];
    } catch (e) {
      console.warn('[Assignments] submissions failed for', f.name, e.message || e);
      continue;
    }

    entities.forEach(entity => {
      const uid = asnEntityUserId(entity);
      if (!uid || !studentMap[uid]) return;
      const status = entity.Status != null ? Number(entity.Status) : 0;
      const submissionDate = asnLatestSubmissionDate(entity);
      const feedbackDate = asnFeedbackDate(entity);
      const row = {
        status,
        studentId: uid,
        studentName: studentMap[uid],
        submissionDate,
        feedbackDate,
        folderId: f.id,
        folderName: f.name
      };
      byFolder[f.id][uid] = row;

      if (status === 1 || status === 2) {
        const daysWaiting = submissionDate
          ? Math.max(0, Math.round((now - new Date(submissionDate).getTime()) / 86400000))
          : 0;
        queue.push({
          status,
          studentId: uid,
          studentName: studentMap[uid],
          folderId: f.id,
          folderName: f.name,
          submissionDate,
          url: asnMarkUrl(f.id),
          daysWaiting
        });
      }

      if (submissionDate) {
        const dk = postDateKey(submissionDate);
        if (dk) {
          calendarEvents.push({
            date: dk, type: 'submission',
            folderId: f.id, folderName: f.name,
            studentName: studentMap[uid], studentId: uid,
            url: asnMarkUrl(f.id),
            label: studentMap[uid] + ' · ' + f.name
          });
        }
      }
      if (status === 3 && feedbackDate) {
        const dk = postDateKey(feedbackDate);
        if (dk) {
          calendarEvents.push({
            date: dk, type: 'graded',
            folderId: f.id, folderName: f.name,
            studentName: studentMap[uid], studentId: uid,
            url: asnMarkUrl(f.id),
            label: 'Graded · ' + f.name + ' · ' + studentMap[uid]
          });
        }
      }
    });

    // Fill missing students as status 0 for this folder
    students.forEach(s => {
      if (!byFolder[f.id][s.id]) {
        byFolder[f.id][s.id] = {
          status: 0, studentId: s.id, studentName: s.name,
          submissionDate: null, feedbackDate: null,
          folderId: f.id, folderName: f.name
        };
      }
    });
  }

  queue.sort((a, b) => (b.daysWaiting || 0) - (a.daysWaiting || 0) || a.folderName.localeCompare(b.folderName));

  window._asnBundle = { folders, students, byFolder, queue, calendarEvents, isDemo: false };
  console.log('[Assignments] Loaded', folders.length, 'folders,', queue.length, 'needing attention,', calendarEvents.length, 'calendar events');
  return window._asnBundle;
}

function renderAssignmentStatus(bundle) {
  const body = document.getElementById('asnStatusBody');
  const kpis = document.getElementById('asnStatusKpis');
  if (!body) return;

  const { folders, students, byFolder } = bundle;
  if (!folders.length) {
    body.innerHTML = '<p style="color:var(--lg);font-size:.86rem">No assignment folders found in this course.</p>';
    if (kpis) kpis.innerHTML = '';
    return;
  }

  let missing = 0, awaiting = 0, draft = 0, published = 0;
  folders.forEach(f => {
    students.forEach(s => {
      const st = byFolder[f.id]?.[s.id]?.status ?? 0;
      if (st === 0) missing++;
      else if (st === 1) awaiting++;
      else if (st === 2) draft++;
      else if (st === 3) published++;
    });
  });

  if (kpis) {
    kpis.innerHTML =
      `<div class="kc dark"><div class="kl">Assignments</div><div class="kv">${folders.length}</div></div>` +
      `<div class="kc" style="border-top-color:#EA0029"><div class="kl">Missing</div><div class="kv">${missing}</div></div>` +
      `<div class="kc gold"><div class="kl">Awaiting feedback</div><div class="kv">${awaiting}</div></div>` +
      `<div class="kc" style="border-top-color:#3CB4E5"><div class="kl">Draft</div><div class="kv">${draft}</div></div>` +
      `<div class="kc" style="border-top-color:#1B8C5A"><div class="kl">Published</div><div class="kv">${published}</div></div>`;
  }

  const statusDotClass = { 0: 'missing', 1: 'submitted', 2: 'draft', 3: 'published' };
  const statusTitle = { 0: 'Not submitted', 1: 'Submitted — awaiting feedback', 2: 'Draft feedback', 3: 'Feedback published' };

  let html = '<div class="fm-wrap"><table class="fm-table"><thead><tr><th class="fm-th-name" style="left:0">Student</th>';
  folders.forEach(f => {
    html += `<th title="${esc(f.name)}">${esc(abbreviateForumName(f.name))}</th>`;
  });
  html += '<th>Done</th></tr></thead><tbody>';

  students.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach(s => {
    let done = 0;
    html += `<tr><td class="fm-cell-name" style="left:0">${esc(s.name)}</td>`;
    folders.forEach(f => {
      const st = byFolder[f.id]?.[s.id]?.status ?? 0;
      if (st === 3) done++;
      const url = asnMarkUrl(f.id);
      const dotClass = statusDotClass[st] || 'missing';
      html += `<td class="asn-status-cell st-${st}">` +
        `<a href="${url}" target="_blank" rel="noopener" title="${statusTitle[st] || ''}">` +
        `<span class="asn-dot ${dotClass}" aria-label="${statusTitle[st] || ''}"></span></a></td>`;
    });
    html += `<td class="fm-cell-num">${done}/${folders.length}</td></tr>`;
  });

  // % published row
  html += '<tr class="fm-pct-row"><td class="fm-cell-name" style="left:0">% Published</td>';
  folders.forEach(f => {
    const pub = students.filter(s => (byFolder[f.id]?.[s.id]?.status ?? 0) === 3).length;
    const pct = students.length ? Math.round(pub / students.length * 100) : 0;
    let pctClass = 'fm-pct-mid';
    if (pct === 100) pctClass = 'fm-pct-100';
    else if (pct === 0) pctClass = 'fm-pct-0';
    html += `<td class="fm-cell-pct"><span class="fm-pct ${pctClass}">${pct}%</span></td>`;
  });
  html += '<td></td></tr></tbody></table></div>';
  body.innerHTML = html;
}

function renderAssignmentUngraded(bundle, filterVal, searchVal) {
  const body = document.getElementById('asnUngradedBody');
  const countEl = document.getElementById('asnUngradedCount');
  if (!body) return;

  let items = bundle.queue || [];
  const filter = filterVal != null ? filterVal : (document.getElementById('asnUngradedFilter')?.value || 'all');
  const search = (searchVal != null ? searchVal : (document.getElementById('asnUngradedSearch')?.value || '')).trim().toLowerCase();

  if (filter === '1' || filter === '2') {
    items = items.filter(it => String(it.status) === filter);
  }
  if (search) {
    items = items.filter(it =>
      (it.studentName || '').toLowerCase().includes(search) ||
      (it.folderName || '').toLowerCase().includes(search)
    );
  }

  window._asnUngradedItems = items;
  if (countEl) countEl.textContent = String(items.length);

  if (!items.length) {
    body.innerHTML = '<p style="color:var(--lg);font-size:.86rem;padding:12px 0">Nothing needs attention right now — nice work.</p>';
    return;
  }

  body.innerHTML = '<div class="asn-queue">' + items.map(it => {
    const badge = it.status === 2
      ? '<span class="asn-badge draft">Draft</span>'
      : '<span class="asn-badge wait">Awaiting</span>';
    const when = it.submissionDate
      ? relDate(it.submissionDate) + (it.daysWaiting != null ? ` · ${it.daysWaiting}d waiting` : '')
      : 'No submission date';
    return `<div class="asn-queue-item">
      ${badge}
      <div class="asn-q-main">
        <div class="asn-q-title">${esc(it.studentName)}</div>
        <div class="asn-q-meta">${esc(it.folderName)} · ${esc(when)}</div>
      </div>
      <a class="asn-q-link" href="${it.url}" target="_blank" rel="noopener">Evaluate</a>
    </div>`;
  }).join('') + '</div>';
}

function wireAssignmentUngradedControls(bundle) {
  const search = document.getElementById('asnUngradedSearch');
  const filter = document.getElementById('asnUngradedFilter');
  const rerender = () => renderAssignmentUngraded(bundle);
  if (search && !search._asnBound) {
    search._asnBound = true;
    search.addEventListener('input', rerender);
  }
  if (filter && !filter._asnBound) {
    filter._asnBound = true;
    filter.addEventListener('change', rerender);
  }
}

function getAsnCalendarEvents(bundle) {
  const showDue = document.getElementById('asnCalDue')?.checked !== false;
  const showSub = document.getElementById('asnCalSub')?.checked !== false;
  const showGraded = document.getElementById('asnCalGraded')?.checked !== false;
  return (bundle.calendarEvents || []).filter(e => {
    if (e.type === 'due') return showDue;
    if (e.type === 'submission') return showSub;
    if (e.type === 'graded') return showGraded;
    return false;
  });
}

function renderAssignmentCalendarDayDetail(bundle, dateStr) {
  const detail = document.getElementById('asnCalendarDayDetail');
  if (!detail) return;
  const events = getAsnCalendarEvents(bundle).filter(e => e.date === dateStr);
  if (!events.length) {
    detail.style.display = 'none';
    detail.innerHTML = '';
    return;
  }
  const label = new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
  });
  const typeBadge = {
    due: '<span class="asn-badge late">Due</span>',
    submission: '<span class="asn-badge wait">Submitted</span>',
    graded: '<span class="asn-badge draft" style="background:#E6F9F0;color:#1B8C5A">Graded</span>'
  };
  detail.style.display = 'block';
  detail.innerHTML = `<h4>${label} — ${events.length} item${events.length === 1 ? '' : 's'}</h4>` +
    events.map(e => {
      const link = e.url
        ? `<a href="${e.url}" target="_blank" rel="noopener">${esc(e.label || e.folderName)}</a>`
        : esc(e.label || e.folderName);
      return `<div class="dc-item">${typeBadge[e.type] || ''}<div>${link}<div class="dc-meta">${esc(e.folderName || '')}${e.studentName ? ' · ' + esc(e.studentName) : ''}</div></div></div>`;
    }).join('');
}

function renderAssignmentCalendar(bundle) {
  const gridEl = document.getElementById('asnCalendarGrid');
  const labelEl = document.getElementById('asnCalPeriodLabel');
  if (!gridEl) return;

  if (!window._asnCalMonth) window._asnCalMonth = new Date();
  const monthDate = new Date(window._asnCalMonth.getFullYear(), window._asnCalMonth.getMonth(), 1);
  if (labelEl) {
    labelEl.textContent = monthDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  }

  const events = getAsnCalendarEvents(bundle);
  const byDate = {};
  events.forEach(e => {
    if (!byDate[e.date]) byDate[e.date] = { due: 0, submission: 0, graded: 0 };
    if (byDate[e.date][e.type] != null) byDate[e.date][e.type]++;
  });

  const year = monthDate.getFullYear();
  const month = monthDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const startDate = new Date(firstDay);
  startDate.setDate(startDate.getDate() - firstDay.getDay());
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  let html = '<div class="cal-grid">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => { html += `<div class="cal-dow">${d}</div>`; });

  let current = new Date(startDate);
  for (let i = 0; i < 42; i++) {
    const dateStr = current.toISOString().split('T')[0];
    const other = current.getMonth() !== month ? ' other' : '';
    const isToday = current.getTime() === today.getTime() ? ' today' : '';
    const counts = byDate[dateStr];
    const has = counts && (counts.due || counts.submission || counts.graded);
    let pills = '';
    if (counts?.due) pills += `<span class="cal-pill asn-due">${counts.due} due</span>`;
    if (counts?.submission) pills += `<span class="cal-pill asn-sub">${counts.submission} sub</span>`;
    if (counts?.graded) pills += `<span class="cal-pill asn-graded">${counts.graded} graded</span>`;
    html += `<div class="cal-day${other}${isToday}${has ? ' has-dc' : ''}" data-asn-date="${dateStr}">` +
      `<div class="day-num">${current.getDate()}</div><div class="pills">${pills}</div></div>`;
    current.setDate(current.getDate() + 1);
  }
  html += '</div>';
  gridEl.innerHTML = html;

  gridEl.querySelectorAll('.cal-day.has-dc').forEach(cell => {
    cell.addEventListener('click', () => {
      renderAssignmentCalendarDayDetail(bundle, cell.getAttribute('data-asn-date'));
    });
  });
}

function wireAssignmentCalendarControls(bundle) {
  const prev = document.getElementById('asnCalPrev');
  const next = document.getElementById('asnCalNext');
  const clearDetail = () => {
    const detail = document.getElementById('asnCalendarDayDetail');
    if (detail) { detail.style.display = 'none'; detail.innerHTML = ''; }
  };
  const refresh = () => { renderAssignmentCalendar(bundle); clearDetail(); };
  if (prev && !prev._asnBound) {
    prev._asnBound = true;
    prev.addEventListener('click', () => {
      if (!window._asnCalMonth) window._asnCalMonth = new Date();
      window._asnCalMonth.setMonth(window._asnCalMonth.getMonth() - 1);
      refresh();
    });
  }
  if (next && !next._asnBound) {
    next._asnBound = true;
    next.addEventListener('click', () => {
      if (!window._asnCalMonth) window._asnCalMonth = new Date();
      window._asnCalMonth.setMonth(window._asnCalMonth.getMonth() + 1);
      refresh();
    });
  }
  ['asnCalDue', 'asnCalSub', 'asnCalGraded'].forEach(id => {
    const el = document.getElementById(id);
    if (el && !el._asnBound) {
      el._asnBound = true;
      el.addEventListener('change', refresh);
    }
  });
}

async function loadAssignmentEngagementTab(tabId, classMembers, isInst) {
  if (!isInst && !_isDemoMode) {
    const bodies = {
      'asn-status': 'asnStatusBody',
      'asn-ungraded': 'asnUngradedBody',
      'asn-calendar': 'asnCalendarGrid'
    };
    const el = document.getElementById(bodies[tabId]);
    if (el) {
      el.innerHTML = '<p style="color:var(--lg);font-size:.86rem">Assignment views require instructor permissions.</p>';
    }
    return;
  }

  const loadingTargets = {
    'asn-status': 'asnStatusBody',
    'asn-ungraded': 'asnUngradedBody',
    'asn-calendar': 'asnCalendarGrid'
  };
  const loadingEl = document.getElementById(loadingTargets[tabId]);
  if (loadingEl && !window._asnBundle) {
    loadingEl.innerHTML = '<div class="ldg"><div class="sp"></div><p>Loading assignment folders…</p></div>';
  }

  let bundle;
  try {
    bundle = await ensureAssignmentBundle(classMembers);
  } catch (e) {
    console.error('[Assignments] load failed:', e);
    if (loadingEl) {
      loadingEl.innerHTML = '<p style="color:var(--rd);font-size:.86rem">Could not load assignments: ' + esc(String(e.message || e)) + '</p>';
    }
    return;
  }

  if (tabId === 'asn-status') {
    renderAssignmentStatus(bundle);
    _tabGroupLoaded.asnStatus = true;
  } else if (tabId === 'asn-ungraded') {
    renderAssignmentUngraded(bundle);
    wireAssignmentUngradedControls(bundle);
    _tabGroupLoaded.asnUngraded = true;
  } else if (tabId === 'asn-calendar') {
    renderAssignmentCalendar(bundle);
    wireAssignmentCalendarControls(bundle);
    _tabGroupLoaded.asnCalendar = true;
  }
}

/* ═══════════════════════════════════════════════════════════════
   GRADE FEEDBACK PANEL — per-student counts of overall feedback +
   rubric-row comments on non-quiz grade items.
   Sources (both are checked; either counts):
     1. Gradebook Comments on /grades/{id}/values/ (manual items,
        discussion grades entered in the gradebook)
     2. Assignment (Dropbox) Feedback blocks on submissions — where
        most real assignment feedback + rubric comments actually live
   Quizzes are excluded. Renders a class chart + per-student table.
   ═══════════════════════════════════════════════════════════════ */
async function loadGradeFeedbackPanel(classMembers, isInst) {
  const body = document.getElementById('gfBody');
  const meta = document.getElementById('gfMeta');
  if (!body) return;

  if (!isInst) {
    body.innerHTML =
      '<p style="color:var(--lg);font-size:.86rem">' +
        'This view requires instructor permissions — it reads per-student feedback that students cannot see across each other.' +
      '</p>';
    return;
  }

  // Assignment-first: read Dropbox evaluation feedback (text, rubric
  // comments, feedback file attachments). Gradebook Comments are a
  // secondary source only — most instructors leave feedback on the
  // assignment evaluation, not in the gradebook comment field.
  body.innerHTML = '<div class="ldg"><div class="sp"></div><p>Loading assignment folders…</p></div>';

  let folders = [];
  try {
    folders = await dropboxFolders();
    if (!Array.isArray(folders)) folders = folders?.Objects || folders?.Items || [];
  } catch (e) {
    body.innerHTML = '<p style="color:var(--rd);font-size:.86rem">Could not load assignments: ' + esc(String(e && e.message || e)) + '</p>';
    return;
  }

  folders = folders
    .filter(f => f && (f.Id || f.FolderId) && !f.IsHidden)
    .map(f => ({
      id: f.Id || f.FolderId,
      name: f.Name || ('Assignment ' + (f.Id || f.FolderId)),
      dueDate: f.DueDate || f.EndDate || null,
      gradeItemId: f.GradeItemId || null
    }))
    .sort((a, b) => {
      const da = a.dueDate ? new Date(a.dueDate).getTime() : Infinity;
      const db = b.dueDate ? new Date(b.dueDate).getTime() : Infinity;
      if (da !== db) return da - db;
      return a.name.localeCompare(b.name);
    });

  if (!folders.length) {
    body.innerHTML = '<p style="color:var(--lg);font-size:.86rem">No assignment folders found in this course.</p>';
    if (meta) meta.textContent = '';
    return;
  }

  if (meta) meta.textContent = folders.length + ' assignment' + (folders.length === 1 ? '' : 's');

  const stats = {};
  classMembers.forEach(m => {
    stats[String(m.id)] = {
      id: m.id, name: m.name,
      overall: 0, rubric: 0, itemsWithFeedback: 0,
      perItem: new Array(folders.length).fill(0),
      _overallBits: new Array(folders.length).fill(false),
      _rubricBits: new Array(folders.length).fill(false)
    };
  });

  function applyFeedback(uid, itemIndex, hasOverall, hasRubric) {
    const s = stats[String(uid)];
    if (!s) return false;
    let changed = false;
    if (hasOverall && !s._overallBits[itemIndex]) {
      s._overallBits[itemIndex] = true;
      s.overall++;
      s.perItem[itemIndex]++;
      changed = true;
    }
    if (hasRubric && !s._rubricBits[itemIndex]) {
      s._rubricBits[itemIndex] = true;
      s.rubric++;
      s.perItem[itemIndex]++;
      changed = true;
    }
    return changed;
  }

  body.innerHTML = '<div class="ldg"><div class="sp"></div><p>Loading 0 of ' + folders.length + ' assignments…</p></div>';
  const progressP = body.querySelector('p');
  let dropboxHits = 0;
  let attachmentHits = 0;
  let unmatchedUsers = 0;
  let feedbackFetches = 0;
  let entitiesScanned = 0;
  let publishedSeen = 0;
  let firstLogged = false;

  for (let i = 0; i < folders.length; i++) {
    const folder = folders[i];
    let subs = [];
    try {
      subs = await dropboxSubs(folder.id);
      if (!Array.isArray(subs)) subs = subs?.Objects || subs?.Items || [];
    } catch (e) {
      console.warn('[GradeFeedback] submissions failed for', folder.name, e.message || e);
      if (progressP) progressP.textContent = 'Loaded ' + (i + 1) + ' of ' + folders.length + ' assignments…';
      continue;
    }

    for (const sub of subs) {
      entitiesScanned++;
      const uid = dropboxEntityUserId(sub);
      const st = dropboxStatusNum(sub);
      if (st === 2 || st === 3) publishedSeen++;

      if (!uid) continue;
      if (!stats[uid]) { unmatchedUsers++; continue; }

      let fbBlock = sub.Feedback;
      let scored = scoreDropboxFeedbackBlock(fbBlock);

      // List payload often has Status=Published but omits Feedback
      // detail — pull the dedicated evaluation record.
      if (!scored.hasOverall && !scored.hasRubric && (st === 2 || st === 3 || fbBlock == null)) {
        try {
          feedbackFetches++;
          fbBlock = await dropboxFeedback(folder.id, uid);
          scored = scoreDropboxFeedbackBlock(fbBlock);
        } catch (e) { /* 404 = none */ }
      }

      if (!firstLogged && (scored.hasOverall || scored.hasRubric || st === 3)) {
        console.log('[GradeFeedback] Sample folder:', folder.name, '| status:', st);
        console.log('[GradeFeedback] Sample Feedback JSON:', fbBlock ? JSON.stringify(fbBlock).slice(0, 900) : '(null)');
        firstLogged = true;
      }

      if (scored.hasAttachment) attachmentHits++;
      if (applyFeedback(uid, i, scored.hasOverall, scored.hasRubric)) dropboxHits++;
    }

    if (progressP) progressP.textContent = 'Loaded ' + (i + 1) + ' of ' + folders.length + ' assignments…';
  }

  // Secondary: gradebook Comments (rare — most feedback is on the assignment)
  let gradebookHits = 0;
  try {
    let rawItems = await gradeItems();
    if (!Array.isArray(rawItems)) rawItems = rawItems?.Objects || rawItems?.Items || [];
    const flat = flattenGradeItems(rawItems);
    const gbItems = flat.filter(g => {
      const gid = g.Id || g.GradeObjectId;
      if (!gid) return false;
      if (g.GradeObjectTypeName === 'Category' || g.GradeObjectTypeName === 'Calculated' || g.GradeObjectTypeName === 'Formula') return false;
      const at = g.AssociatedTool;
      if (at && typeof at === 'object') {
        const toolName = String(at.Name || at.ToolName || '').toLowerCase();
        if (toolName.includes('quiz')) return false;
      }
      // Skip items already covered by a dropbox folder with the same GradeItemId
      const gidStr = String(gid);
      if (folders.some(f => f.gradeItemId != null && String(f.gradeItemId) === gidStr)) return false;
      return true;
    }).slice(0, 40);

    for (const item of gbItems) {
      const goId = item.Id || item.GradeObjectId;
      try {
        let values = await pagedApi('/d2l/api/le/' + LE + '/' + OU_ID + '/grades/' + goId + '/values/');
        if (!Array.isArray(values)) values = values?.Objects || values?.Items || [];
        values.forEach(v => {
          const uid = String(v.User?.Identifier || v.User?.UserId || v.UserId || '');
          if (!uid || !stats[uid]) return;
          const gv = v.GradeValue || v;
          if (richTextPlain(gv.Comments)) {
            // Attribute to first folder column as informational only if name matches;
            // otherwise just bump overall without a column (use last col "other") — skip
            // column attribution for gradebook-only to keep matrix assignment-pure.
            stats[uid].overall++;
            gradebookHits++;
          }
        });
      } catch (e) {}
    }
  } catch (e) {
    console.warn('[GradeFeedback] gradebook secondary scan skipped:', e.message || e);
  }

  Object.values(stats).forEach(s => {
    s.itemsWithFeedback = s.perItem.filter(n => n > 0).length;
    delete s._overallBits;
    delete s._rubricBits;
  });

  console.log('[GradeFeedback] Assignment-first results — hits:', dropboxHits,
    '| attachments:', attachmentHits, '| gradebook comments:', gradebookHits,
    '| entities:', entitiesScanned, '| published/draft statuses:', publishedSeen,
    '| feedback API fetches:', feedbackFetches, '| unmatched users:', unmatchedUsers);

  const itemStats = folders.map((folder, i) => {
    let studentsWithComments = 0;
    let totalComments = 0;
    Object.values(stats).forEach(s => {
      if (s.perItem[i] > 0) studentsWithComments++;
      totalComments += s.perItem[i];
    });
    const avgComments = classMembers.length > 0 ? totalComments / classMembers.length : 0;
    return {
      name: folder.name,
      studentsWithComments,
      avgComments,
      totalComments,
    };
  });

  const maxStudents = Math.max(1, ...itemStats.map(s => s.studentsWithComments));
  const maxAvg = Math.max(0.01, ...itemStats.map(s => s.avgComments));

  function abbrevName(s) {
    if (!s) return '';
    const txt = String(s).trim();
    const lower = txt.toLowerCase();
    const patterns = [
      { rx: /week\s*0*(\d+)/, token: (n) => 'W' + n },
      { rx: /homework\s*#?\s*0*(\d+)/, token: (n) => 'HW' + n },
      { rx: /hw\s*#?\s*0*(\d+)/, token: (n) => 'HW' + n },
      { rx: /module\s*0*(\d+)/, token: (n) => 'M' + n },
      { rx: /assignment\s*0*(\d+)/, token: (n) => 'A' + n },
      { rx: /discussion\s*0*(\d+)/, token: (n) => 'D' + n },
    ];
    for (const p of patterns) {
      const m = lower.match(p.rx);
      if (m) return p.token(m[1]);
    }
    const tail = txt.match(/(\d+)\s*$/);
    if (tail) {
      const lead = txt.replace(/\d+\s*$/, '').trim().slice(0, 3);
      return (lead || '#') + tail[1];
    }
    return txt.length > 10 ? txt.slice(0, 9) + '…' : txt;
  }

  function fmtAvg(v) {
    if (v == null || v === 0) return '0';
    if (v % 1 === 0) return v.toFixed(0);
    return v.toFixed(1);
  }
  function chartCell(value, maxVal, fmt, baseColor) {
    const h = 32;
    const pct = maxVal > 0 ? Math.max(0, Math.min(1, value / maxVal)) : 0;
    const barH = Math.round(pct * h);
    const label = (fmt ? fmt(value) : String(value));
    const dimmed = value === 0 ? 'color:var(--lg)' : 'color:var(--dg)';
    return (
      '<td style="padding:2px 1px;text-align:center;vertical-align:bottom;border-top:1px solid var(--bd)">' +
        '<div style="height:' + h + 'px;width:100%;display:flex;align-items:flex-end;justify-content:center">' +
          '<div title="' + esc(label) + '" style="width:70%;max-width:14px;height:' + barH + 'px;background:' + baseColor + ';border-radius:2px 2px 0 0;min-height:' + (value > 0 ? 2 : 0) + 'px"></div>' +
        '</div>' +
        '<div style="font-size:.68rem;margin-top:1px;font-variant-numeric:tabular-nums;line-height:1.1;' + dimmed + '">' + label + '</div>' +
      '</td>'
    );
  }

  let classChartHtml =
    '<div style="border:1px solid var(--bd);border-radius:6px;margin-bottom:14px;overflow:hidden">' +
      '<table style="width:100%;border-collapse:collapse;font-size:.74rem;table-layout:fixed">' +
        '<colgroup><col style="width:140px">' + itemStats.map(() => '<col>').join('') + '</colgroup>' +
        '<thead style="background:var(--bg)"><tr>' +
          '<th style="padding:6px 8px;text-align:left;font-family:Oswald,sans-serif;font-weight:600;color:var(--db);font-size:.68rem;letter-spacing:.3px;text-transform:uppercase;border-bottom:2px solid var(--bd)">Assignment</th>' +
          itemStats.map(it =>
            '<th title="' + esc(it.name) + '" style="padding:4px 2px;text-align:center;font-family:Oswald,sans-serif;font-weight:600;color:var(--db);font-size:.66rem;border-bottom:2px solid var(--bd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
              esc(abbrevName(it.name)) + '</th>'
          ).join('') +
        '</tr></thead><tbody>' +
        '<tr><th scope="row" style="padding:4px 8px;text-align:left;border-top:1px solid var(--bd);font-family:Oswald,sans-serif;font-weight:600;color:#1F5582;font-size:.7rem;text-transform:uppercase">Students<br>w/ feedback</th>' +
          itemStats.map(s => chartCell(s.studentsWithComments, maxStudents, null, '#1F5582')).join('') +
        '</tr>' +
        '<tr><th scope="row" style="padding:4px 8px;text-align:left;border-top:1px solid var(--bd);font-family:Oswald,sans-serif;font-weight:600;color:#7E60BF;font-size:.7rem;text-transform:uppercase">Avg<br>feedback</th>' +
          itemStats.map(s => chartCell(s.avgComments, maxAvg, fmtAvg, '#7E60BF')).join('') +
        '</tr></tbody></table></div>';

  const rows = Object.values(stats).sort((a, b) => a.name.localeCompare(b.name));
  let html = classChartHtml +
    '<div style="overflow-x:auto;border:1px solid var(--bd);border-radius:6px">' +
      '<table class="gf-table" style="width:100%;border-collapse:collapse;font-size:.86rem">' +
        '<thead style="background:var(--bg)"><tr>' +
          '<th style="text-align:left;padding:8px 10px;font-family:Oswald,sans-serif;font-weight:600;color:var(--db);font-size:.78rem;text-transform:uppercase">Student</th>' +
          '<th style="text-align:center;padding:8px 10px;font-family:Oswald,sans-serif;font-weight:600;color:var(--db);font-size:.78rem;text-transform:uppercase">Assignments w/ feedback</th>' +
          '<th style="text-align:center;padding:8px 10px;font-family:Oswald,sans-serif;font-weight:600;color:var(--db);font-size:.78rem;text-transform:uppercase">Overall</th>' +
          '<th style="text-align:center;padding:8px 10px;font-family:Oswald,sans-serif;font-weight:600;color:var(--db);font-size:.78rem;text-transform:uppercase">Rubric</th>' +
        '</tr></thead><tbody>';

  rows.forEach(r => {
    const itemsLbl = r.itemsWithFeedback + ' / ' + folders.length;
    const cls = r.itemsWithFeedback === 0 ? 'color:var(--lg)' : '';
    html += '<tr>' +
      '<td style="padding:7px 10px;border-top:1px solid var(--bd)">' + esc(r.name) + '</td>' +
      '<td style="padding:7px 10px;border-top:1px solid var(--bd);text-align:center;' + cls + '">' + itemsLbl + '</td>' +
      '<td style="padding:7px 10px;border-top:1px solid var(--bd);text-align:center;' + cls + '">' + r.overall + '</td>' +
      '<td style="padding:7px 10px;border-top:1px solid var(--bd);text-align:center;' + cls + '">' + r.rubric + '</td>' +
    '</tr>';
  });
  html += '</tbody></table></div>';

  if (dropboxHits === 0) {
    html +=
      '<p style="font-size:.78rem;color:#b5880a;margin:10px 0 0;background:#fff8e1;border-left:3px solid #b5880a;padding:8px 12px;border-radius:6px">' +
        'Scanned ' + folders.length + ' assignment folder' + (folders.length === 1 ? '' : 's') +
        ' and ' + entitiesScanned + ' student submission record' + (entitiesScanned === 1 ? '' : 's') +
        ' (' + publishedSeen + ' draft/published). No written feedback text or feedback file attachments were found in the evaluation tool. ' +
        'A published <em>score</em> alone does not count. Open browser console for <code>[GradeFeedback]</code> sample JSON.' +
      '</p>';
  }

  html +=
    '<p style="font-size:.74rem;color:var(--lg);margin:10px 0 0">' +
      'This tab reads <strong>assignment evaluation feedback</strong> (the feedback box and attachments on each Dropbox/assignment), not the gradebook comment field. ' +
      'Overall = text or file in the feedback box; Rubric = criterion comments. Hover column headers for full assignment names.' +
    '</p>';

  body.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════════════
   GRADE TRENDS PANEL — class-wide grade distribution per assignment
   Rows = Highest / Median / Average / Lowest student grade.
   Columns = each numeric grade item in gradebook order, plus a
   sparkline column tracking the row's percentage trend.
   Hidden when fewer than three students are enrolled (stats would
   leak individual identity).
   ═══════════════════════════════════════════════════════════════ */
async function loadGradeTrendsPanel(classMembers, isInst) {
  const body = document.getElementById('gtBody');
  const meta = document.getElementById('gtMeta');
  if (!body) return;

  if (!isInst) {
    body.innerHTML =
      '<p style="color:var(--lg);font-size:.86rem">' +
        'This view requires instructor permissions — it reads class-wide grade data that students cannot see across each other.' +
      '</p>';
    return;
  }

  // Privacy / statistical floor: with one or two students, "highest"
  // and "lowest" identify specific people, and median/average become
  // meaningless. Surface the message and bail.
  if (!classMembers || classMembers.length < 3) {
    body.innerHTML =
      '<p style="color:var(--lg);font-size:.86rem">' +
        'There are fewer than three students in this course, so the class-wide grade distribution is not displayed. ' +
        'The Grade Trends view becomes available once at least three students are enrolled.' +
      '</p>';
    if (meta) meta.textContent = '';
    return;
  }

  body.innerHTML = '<div class="ldg"><div class="sp"></div><p>Fetching grade items…</p></div>';

  let allItems;
  try {
    allItems = await gradeItems();
  } catch (e) {
    body.innerHTML = '<p style="color:var(--rd);font-size:.86rem">Could not load grade items: ' + esc(String(e && e.message || e)) + '</p>';
    return;
  }
  const flat = flattenGradeItems(Array.isArray(allItems) ? allItems : (allItems?.Objects || allItems?.Items || []));

  // Keep any leaf grade item with a numeric capacity. We can't compute
  // highest/median/avg/lowest from text-only items. Categories are
  // also excluded — they have no values endpoint of their own.
  const items = flat.filter(g => {
    if (!g) return false;
    if (g.GradeType === 'Category') return false;
    const gid = g.Id || g.GradeObjectId;
    if (!gid) return false;
    // MaxPoints > 0 means a numeric scale is attached.
    const max = parseFloat(g.MaxPoints);
    return isFinite(max) && max > 0;
  });
  items.sort((a, b) => (a.SortOrder ?? 9999) - (b.SortOrder ?? 9999));

  if (!items.length) {
    body.innerHTML = '<p style="color:var(--lg);font-size:.86rem">No numeric grade items found in this course.</p>';
    if (meta) meta.textContent = '';
    return;
  }

  if (meta) meta.textContent = items.length + ' graded item' + (items.length === 1 ? '' : 's');

  // Pull all values for each item. Each per-item record collects the
  // raw percentages (0-100) and DisplayedGrade strings keyed by the
  // student who owns them, so we can later pick out the high/low
  // student's displayed grade.
  const perItem = []; // [{ name, max, pcts:[], byUser:{uid: {pct, disp}} }, ...]
  body.innerHTML = '<div class="ldg"><div class="sp"></div><p>Loaded 0 of ' + items.length + ' items…</p></div>';
  const progressP = body.querySelector('p');

  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    const goId = item.Id || item.GradeObjectId;
    const max = parseFloat(item.MaxPoints) || 0;
    let values = [];
    try {
      values = await pagedApi(`/d2l/api/le/${LE}/${OU_ID}/grades/${goId}/values/`);
    } catch (e) {
      console.warn('[GradeTrends] values fetch failed for', item.Name, '(' + goId + ')', e.message || e);
      perItem.push({ name: item.Name || ('Item ' + goId), max, pcts: [], byUser: {} });
      if (progressP) progressP.textContent = 'Loaded ' + (i + 1) + ' of ' + items.length + ' items…';
      continue;
    }
    if (!Array.isArray(values)) values = values?.Objects || values?.Items || [];

    const pcts = [];
    const byUser = {};
    // Constrain to enrolled students (don't count instructor self-grades).
    const memberIds = new Set(classMembers.map(m => String(m.id)));

    values.forEach(v => {
      const uid = String(v.User?.Identifier || v.UserId || '');
      if (!uid || !memberIds.has(uid)) return;
      const gv = v.GradeValue || v;
      const num = parseFloat(gv.PointsNumerator);
      const den = parseFloat(gv.PointsDenominator || max);
      if (!isFinite(num) || !isFinite(den) || den <= 0) return;
      const pct = Math.max(0, Math.min(100, (num / den) * 100));
      pcts.push(pct);
      byUser[uid] = { pct, disp: gv.DisplayedGrade || (num + '/' + den) };
    });

    perItem.push({ name: item.Name || ('Item ' + goId), max, pcts, byUser });
    if (progressP) progressP.textContent = 'Loaded ' + (i + 1) + ' of ' + items.length + ' items…';
  }

  // Update the header meta now that we have completion data. Average
  // is taken across items that received at least one grade (so empty
  // items don't drag the number down) and reflects the typical student
  // turnout per assignment.
  if (meta) {
    const itemsLabel = items.length + ' graded item' + (items.length === 1 ? '' : 's');
    const scoredForAvg = perItem.filter(it => it.pcts.length > 0);
    if (scoredForAvg.length) {
      const totalSubs  = scoredForAvg.reduce((a, it) => a + it.pcts.length, 0);
      const avgCompletes = totalSubs / scoredForAvg.length;
      const avgLabel = (avgCompletes % 1 === 0 ? avgCompletes.toFixed(0) : avgCompletes.toFixed(1));
      meta.textContent = itemsLabel + ' · avg ' + avgLabel + ' student' + (avgCompletes === 1 ? '' : 's') + ' completing per item';
    } else {
      meta.textContent = itemsLabel + ' · no completions yet';
    }
  }

  // Coverage gate for the XLSX export: every item must have at least
  // half of enrolled students graded. Until that bar is met, the export
  // would just publish a half-built picture, so we keep the button
  // disabled with an explanatory tooltip.
  const classSize = classMembers.length;
  const halfClass = classSize / 2;
  const underCovered = perItem.filter(it => it.pcts.length < halfClass);
  const exportReady  = underCovered.length === 0;
  const exportBtn = document.getElementById('gtExportBtn');
  if (exportBtn) {
    if (exportReady) {
      exportBtn.disabled = false;
      exportBtn.style.opacity = '';
      exportBtn.style.cursor = '';
      exportBtn.setAttribute('data-tip', 'Download the Grade Trends table as an Excel spreadsheet.');
    } else {
      exportBtn.disabled = true;
      exportBtn.style.opacity = '.5';
      exportBtn.style.cursor = 'not-allowed';
      const tip = 'Available once every grade item has been graded for at least half the class. ' +
                  underCovered.length + ' of ' + items.length + ' item' + (items.length === 1 ? '' : 's') +
                  ' still need' + (underCovered.length === 1 ? 's' : '') + ' more grading.';
      exportBtn.setAttribute('data-tip', tip);
      exportBtn.title = tip;
    }
  }

  // Compute per-item stat values + the displayed-grade label for
  // highest and lowest (the actual top/bottom student's displayed grade
  // on that item — matches what the instructor sees in the gradebook).
  function median(arr) {
    if (!arr.length) return null;
    const s = arr.slice().sort((a, b) => a - b);
    const m = Math.floor(s.length / 2);
    return s.length % 2 === 0 ? (s[m - 1] + s[m]) / 2 : s[m];
  }
  function mean(arr) {
    if (!arr.length) return null;
    return arr.reduce((a, b) => a + b, 0) / arr.length;
  }
  function topUserDisplay(byUser, comparator) {
    let bestUid = null, bestPct = null;
    Object.keys(byUser).forEach(uid => {
      const v = byUser[uid];
      if (bestUid === null) { bestUid = uid; bestPct = v.pct; return; }
      if (comparator(v.pct, bestPct)) { bestUid = uid; bestPct = v.pct; }
    });
    return bestUid ? byUser[bestUid] : null;
  }

  // Per-stat parallel arrays: one slot per grade item.
  //   highest         — top student's displayed grade
  //   median          — middle of all percentages
  //   average         — mean of all percentages
  //   lowest          — bottom student's displayed grade (includes zeros)
  //   lowestNZ        — bottom non-zero student's displayed grade
  //                     (filters out missing / true-zero submissions)
  //   varHighLow      — (highest - lowest)   / highest  (% of top)
  //   varHighAvg      — (highest - average)  / highest  (% of top)
  //   trueVariance    — (highest - lowestNZ) / highest  (% of top)
  //                     The "real" spread among students who actually
  //                     attempted the assignment.
  // All variances clamp to 0 when highest is 0 to avoid divide-by-zero.
  const stats = {
    highest:      { label: 'Highest',             pcts: [], cells: [] },
    median:       { label: 'Median',              pcts: [], cells: [] },
    average:      { label: 'Average',             pcts: [], cells: [] },
    lowest:       { label: 'Lowest',              pcts: [], cells: [] },
    lowestNZ:     { label: 'Lowest non-zero',     pcts: [], cells: [] },
    varHighLow:   { label: 'Variance High–Low',   pcts: [], cells: [] },
    varHighAvg:   { label: 'Variance High–Avg',   pcts: [], cells: [] },
    trueVariance: { label: 'True variance',       pcts: [], cells: [] },
  };
  const fmtPct = (p) => (p == null) ? '—' : (p % 1 === 0 ? p.toFixed(0) : p.toFixed(1)) + '%';

  perItem.forEach(it => {
    if (!it.pcts.length) {
      stats.highest.pcts.push(null);      stats.highest.cells.push('—');
      stats.median.pcts.push(null);       stats.median.cells.push('—');
      stats.average.pcts.push(null);      stats.average.cells.push('—');
      stats.lowest.pcts.push(null);       stats.lowest.cells.push('—');
      stats.lowestNZ.pcts.push(null);     stats.lowestNZ.cells.push('—');
      stats.varHighLow.pcts.push(null);   stats.varHighLow.cells.push('—');
      stats.varHighAvg.pcts.push(null);   stats.varHighAvg.cells.push('—');
      stats.trueVariance.pcts.push(null); stats.trueVariance.cells.push('—');
      return;
    }
    const hi = topUserDisplay(it.byUser, (a, b) => a > b);
    const lo = topUserDisplay(it.byUser, (a, b) => a < b);

    // Lowest non-zero: filter the byUser map to students whose percentage
    // is strictly above zero. If everyone got a real zero, we surface
    // a blank cell (no non-zero score to report).
    const nzByUser = {};
    Object.keys(it.byUser).forEach(uid => {
      if (it.byUser[uid].pct > 0) nzByUser[uid] = it.byUser[uid];
    });
    const nzLo = Object.keys(nzByUser).length ? topUserDisplay(nzByUser, (a, b) => a < b) : null;

    const med = median(it.pcts);
    const avg = mean(it.pcts);
    const vHL = (hi.pct > 0) ? ((hi.pct - lo.pct) / hi.pct) * 100 : 0;
    const vHA = (hi.pct > 0) ? ((hi.pct - avg)   / hi.pct) * 100 : 0;
    const tV  = (hi.pct > 0 && nzLo) ? ((hi.pct - nzLo.pct) / hi.pct) * 100 : null;

    stats.highest.pcts.push(hi.pct);    stats.highest.cells.push(hi.disp || fmtPct(hi.pct));
    stats.median.pcts.push(med);        stats.median.cells.push(fmtPct(med));
    stats.average.pcts.push(avg);       stats.average.cells.push(fmtPct(avg));
    stats.lowest.pcts.push(lo.pct);     stats.lowest.cells.push(lo.disp || fmtPct(lo.pct));
    stats.lowestNZ.pcts.push(nzLo ? nzLo.pct : null);
    stats.lowestNZ.cells.push(nzLo ? (nzLo.disp || fmtPct(nzLo.pct)) : '—');
    stats.varHighLow.pcts.push(vHL);    stats.varHighLow.cells.push(fmtPct(vHL));
    stats.varHighAvg.pcts.push(vHA);    stats.varHighAvg.cells.push(fmtPct(vHA));
    stats.trueVariance.pcts.push(tV);   stats.trueVariance.cells.push(tV == null ? '—' : fmtPct(tV));
  });

  // Full-width sparkline. The SVG spans the assignment columns via
  // colspan'd <td>; data points are positioned at column centers so a
  // sparkline peak/dip lines up vertically with the data cell below it.
  // Y range is fixed:
  //   - 0-100 for grade rows (so all four are visually comparable)
  //   - 0-{max observed} for variance rows (small spreads still readable)
  function sparkline(pcts, strokeColor, yMax) {
    const w = 1000, h = 36, padY = 4, padX = 0;
    const N = pcts.length;
    if (N < 1) return '<svg width="100%" height="' + h + '" aria-hidden="true"></svg>';
    const colW = (w - 2 * padX) / N;
    const valid = pcts.map((v, i) => ({ v, i })).filter(p => p.v != null);
    const span = yMax || 100;
    function xFor(i) { return padX + (i + 0.5) * colW; }
    function yFor(v) { return h - padY - (v / span) * (h - 2 * padY); }
    if (valid.length < 1) {
      return '<svg width="100%" height="' + h + '" aria-hidden="true"></svg>';
    }
    if (valid.length < 2) {
      const p = valid[0];
      const cx = xFor(p.i).toFixed(1), cy = yFor(p.v).toFixed(1);
      return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="width:100%;height:' + h + 'px;display:block" role="img" aria-label="Grade trend">' +
        '<circle cx="' + cx + '" cy="' + cy + '" r="3" fill="' + strokeColor + '"/>' +
      '</svg>';
    }
    const pts = valid.map(p => xFor(p.i).toFixed(1) + ',' + yFor(p.v).toFixed(1));
    const dots = valid.map(p => '<circle cx="' + xFor(p.i).toFixed(1) + '" cy="' + yFor(p.v).toFixed(1) + '" r="2.6" fill="' + strokeColor + '"/>').join('');
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="width:100%;height:' + h + 'px;display:block" role="img" aria-label="Grade trend">' +
        '<line x1="' + padX + '" y1="' + (h - padY) + '" x2="' + (w - padX) + '" y2="' + (h - padY) +
          '" stroke="var(--bd)" stroke-width="0.6"/>' +
        '<polyline fill="none" stroke="' + strokeColor + '" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" points="' + pts.join(' ') + '"/>' +
        dots +
      '</svg>';
  }

  // Color per stat row so the trends are quickly distinguishable.
  const rowColors = {
    highest:      '#1B8C5A',
    median:       '#1F5582',
    average:      '#7E60BF',
    lowest:       '#C8412A',
    lowestNZ:     '#A0522D',
    varHighLow:   '#D27A1A',
    varHighAvg:   '#0F8FA9',
    trueVariance: '#8B0000',
  };

  // Grade-inflation detection — flag items where every graded student
  // landed inside a tight band (effectively the same grade). We require
  // at least three submitted grades (under three, "uniformity" is just
  // statistical noise), and define "uniform" as a max-minus-min spread
  // of <= 1 percentage point. That's tight enough to catch "everyone
  // got 100%" or "everyone got an A" while still allowing the normal
  // 1-point measurement noise that comes from rounding.
  const flagged = perItem.map((it, idx) => {
    if (it.pcts.length < 3) return null;
    const spread = Math.max(...it.pcts) - Math.min(...it.pcts);
    if (spread > 1) return null;
    const meanPct = it.pcts.reduce((a, b) => a + b, 0) / it.pcts.length;
    return { idx, name: it.name, n: it.pcts.length, meanPct };
  }).filter(Boolean);
  const flaggedSet = new Set(flagged.map(f => f.idx));

  // Variance health score — share of scored items that actually
  // differentiated student performance. Denominator is items where
  // at least one student received a grade; numerator is items where
  // the max-minus-min spread exceeds 1 percentage point. Three tiers:
  //   90-100% → positive (healthy differentiation)
  //   70-89%  → neutral  (mixed)
  //   ≤ 69%   → negative (likely systemic inflation / rubric issue)
  const scoredItems  = perItem.filter(it => it.pcts.length > 0);
  const variantItems = scoredItems.filter(it =>
    (Math.max(...it.pcts) - Math.min(...it.pcts)) > 1);
  const variancePct  = scoredItems.length
    ? (variantItems.length / scoredItems.length) * 100
    : null;

  let outcomeBanner = '';
  if (variancePct != null) {
    let tier, bg, border, leftBorder, headerColor, icon, headline, lead;
    if (variancePct >= 90) {
      tier = 'positive';
      bg = '#E7F5EC'; border = '#B7E0C6'; leftBorder = '#1B8C5A';
      headerColor = '#1B8C5A'; icon = '✓';
      headline = 'Healthy grade variance';
      lead = 'Most of your scored items produced a meaningful spread in student grades — your assessments are differentiating performance.';
    } else if (variancePct >= 70) {
      tier = 'neutral';
      bg = '#FFF7E0'; border = '#F2DDA0'; leftBorder = '#C79100';
      headerColor = '#8A6A00'; icon = '◐';
      headline = 'Moderate grade variance';
      lead = 'A meaningful share of your scored items produced spread in grades, but a chunk did not. Some items may need a sharper rubric or harder ceiling.';
    } else {
      tier = 'negative';
      bg = '#FDECEA'; border = '#F5C2BC'; leftBorder = '#C8412A';
      headerColor = '#C8412A'; icon = '✗';
      headline = 'Low grade variance';
      lead = 'A majority of your scored items produced little or no spread in student grades. That often signals rubric thresholds set too low, assessments that are too easy, or grading shortcuts.';
    }
    const ratio = variantItems.length + ' of ' + scoredItems.length + ' scored item' + (scoredItems.length === 1 ? '' : 's');
    const pctLabel = (variancePct % 1 === 0 ? variancePct.toFixed(0) : variancePct.toFixed(1)) + '%';
    outcomeBanner =
      '<div role="status" data-outcome="' + tier + '" ' +
        'style="background:' + bg + ';border:1px solid ' + border + ';border-left:4px solid ' + leftBorder + ';' +
                'border-radius:6px;padding:12px 16px;margin:0 0 12px;display:flex;gap:14px;align-items:flex-start">' +
        '<div aria-hidden="true" style="font-size:1.6rem;line-height:1;color:' + leftBorder + ';font-weight:700">' + icon + '</div>' +
        '<div style="flex:1">' +
          '<div style="font-family:Oswald,sans-serif;font-weight:600;color:' + headerColor + ';font-size:.92rem;letter-spacing:.3px;text-transform:uppercase;margin-bottom:4px">' +
            esc(headline) + ' — ' + pctLabel + ' of scored items showed variance' +
          '</div>' +
          '<p style="font-size:.82rem;color:var(--dg);margin:0">' + esc(lead) + '</p>' +
          '<p style="font-size:.74rem;color:var(--lg);margin:4px 0 0">' +
            'Counted ' + ratio + ' where the grade spread exceeded 1 percentage point. Items with zero scored students are excluded from both sides of the ratio.' +
          '</p>' +
        '</div>' +
      '</div>';
  }

  // Render -----------------------------------------------------------
  // Sticky-left header column + horizontal scroll for everything else.
  const headerCells = perItem.map((it, idx) => {
    const isFlagged = flaggedSet.has(idx);
    const flagMark = isFlagged
      ? '<span title="Grade inflation flag — every student received essentially the same grade on this item" style="display:inline-block;margin-left:4px;color:#C8412A;font-weight:700" aria-label="Grade inflation flag">⚑</span>'
      : '';
    const bg = isFlagged ? 'background:#FDECEA;' : '';
    return '<th style="text-align:center;padding:6px 8px;font-family:Oswald,sans-serif;font-weight:600;color:var(--db);font-size:.72rem;letter-spacing:.3px;text-transform:uppercase;border-bottom:2px solid var(--bd);white-space:nowrap;' + bg + '" title="' + esc(it.name) + (isFlagged ? ' — flagged for uniform grading' : '') + '">' +
      esc(it.name.length > 28 ? (it.name.slice(0, 25) + '…') : it.name) +
      flagMark +
    '</th>';
  }).join('');

  // Two-tr block: sparkline above, data below. The sparkline cell
  // spans the assignment columns via colspan so its x-axis aligns with
  // the data cells underneath. Every row uses a fixed 0-100% y-axis
  // (including variance rows) so the curves are visually comparable
  // across the whole table.
  function rowBlock(key) {
    const s = stats[key];
    const isVariance = key === 'varHighLow' || key === 'varHighAvg' || key === 'trueVariance';
    const yMax = 100;
    const sparkRowBg = isVariance ? '#FAF7F1' : '#F7FAFD';
    const sparkRow =
      '<tr class="gt-spark-row">' +
        '<td style="padding:0;background:var(--bg);position:sticky;left:0;border-top:1px solid var(--bd)"></td>' +
        '<td colspan="' + perItem.length + '" style="padding:0;line-height:0;border-top:1px solid var(--bd);background:' + sparkRowBg + '">' +
          sparkline(s.pcts, rowColors[key], yMax) +
        '</td>' +
      '</tr>';
    const cellHtml = s.cells.map(c =>
      '<td style="padding:6px 8px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums">' + esc(c) + '</td>'
    ).join('');
    const dataRow =
      '<tr>' +
        '<th scope="row" style="padding:6px 10px;text-align:left;background:var(--bg);position:sticky;left:0;font-family:Oswald,sans-serif;font-weight:600;color:' + rowColors[key] + ';font-size:.78rem;letter-spacing:.3px;text-transform:uppercase">' +
          s.label +
        '</th>' +
        cellHtml +
      '</tr>';
    return sparkRow + dataRow;
  }

  // Optional grade-inflation banner. Lists every flagged item with its
  // student count and uniform percentage so the instructor can decide
  // whether a tougher rubric, more challenging prompt, or recalibration
  // is warranted. Items are sorted by gradebook position for findability.
  let inflationBanner = '';
  if (flagged.length) {
    const lis = flagged.map(f =>
      '<li style="margin:2px 0">' +
        '<strong>' + esc(f.name) + '</strong> — everyone scored ' +
        (f.meanPct % 1 === 0 ? f.meanPct.toFixed(0) : f.meanPct.toFixed(1)) + '% ' +
        '<span style="color:var(--lg)">(' + f.n + ' student' + (f.n === 1 ? '' : 's') + ' graded)</span>' +
      '</li>'
    ).join('');
    inflationBanner =
      '<div role="alert" style="background:#FDECEA;border:1px solid #F5C2BC;border-left:4px solid #C8412A;border-radius:6px;padding:10px 14px;margin:0 0 12px">' +
        '<div style="font-family:Oswald,sans-serif;font-weight:600;color:#C8412A;font-size:.86rem;letter-spacing:.3px;text-transform:uppercase;margin-bottom:4px">' +
          '⚑ Possible grade inflation — ' + flagged.length + ' item' + (flagged.length === 1 ? '' : 's') + ' with no grade variation' +
        '</div>' +
        '<p style="font-size:.78rem;color:var(--dg);margin:0 0 6px">' +
          'On the items below, every graded student received essentially the same grade. That can indicate a rubric that does not differentiate performance, a missing rubric, an assessment that is too easy, a grading shortcut, or an assignment that should be pass-fail, as completing it gets you full points. Worth a look:' +
        '</p>' +
        '<ul style="margin:0;padding-left:20px;font-size:.82rem;color:var(--dg)">' + lis + '</ul>' +
      '</div>';
  }

  // Stash render-time data for the XLSX exporter. The export reads from
  // this snapshot so the spreadsheet always matches what's on screen,
  // even after additional renders or filter changes elsewhere.
  window._gtExportData = {
    items: perItem,
    stats,
    flagged,
    outcome: variancePct != null ? {
      pct: variancePct,
      tier: variancePct >= 90 ? 'positive' : (variancePct >= 70 ? 'neutral' : 'negative'),
      scored: scoredItems.length,
      variant: variantItems.length,
    } : null,
    classSize,
    avgCompletes: (perItem.filter(it => it.pcts.length > 0).reduce((a, it) => a + it.pcts.length, 0) /
                    Math.max(1, perItem.filter(it => it.pcts.length > 0).length)),
    capturedAt: new Date(),
    ready: exportReady,
  };

  body.innerHTML =
    outcomeBanner +
    inflationBanner +
    '<div style="overflow-x:auto;border:1px solid var(--bd);border-radius:6px">' +
      '<table class="gt-table" style="width:100%;border-collapse:collapse;font-size:.86rem;table-layout:auto">' +
        '<thead style="background:var(--bg)">' +
          '<tr>' +
            '<th style="padding:8px 10px;text-align:left;background:var(--bg);position:sticky;left:0;font-family:Oswald,sans-serif;font-weight:600;color:var(--db);font-size:.72rem;letter-spacing:.3px;text-transform:uppercase;border-bottom:2px solid var(--bd)">Statistic</th>' +
            headerCells +
          '</tr>' +
        '</thead>' +
        '<tbody>' +
          rowBlock('highest') +
          rowBlock('median') +
          rowBlock('average') +
          rowBlock('lowest') +
          rowBlock('lowestNZ') +
          rowBlock('varHighLow') +
          rowBlock('varHighAvg') +
          rowBlock('trueVariance') +
        '</tbody>' +
      '</table>' +
    '</div>' +
    '<p style="font-size:.74rem;color:var(--lg);margin:10px 0 0">' +
      'Each statistic row has its sparkline directly above it; the sparkline x-axis aligns with the assignment columns below, so a peak in the curve sits over the same item in the data row. ' +
      '<strong>Highest</strong> and <strong>Lowest</strong> show the actual displayed grade of the top/bottom student on each item. <strong>Lowest non-zero</strong> ignores students who scored zero (missed submissions or true zeros) and reports the lowest grade among students who actually attempted the work. ' +
      '<strong>Median</strong> and <strong>Average</strong> are class-wide percentages. ' +
      '<strong>Variance High&ndash;Low</strong> and <strong>Variance High&ndash;Avg</strong> are calculated as (high &minus; other) / high, expressed as a percentage of the top grade. ' +
      '<strong>True variance</strong> uses Lowest non-zero in place of Lowest, so missing submissions don\'t inflate the spread. ' +
      'Columns marked with <span style="color:#C8412A">⚑</span> flag items where every graded student received the same grade.' +
    '</p>';
}

/* Grading Helper Panel Loader */
async function loadGradingHelperPanel(data, classMembers) {
  const panel = document.getElementById('p-grading-helper');
  if (!panel) return;

  const userId = String(_currentUserId);
  const isInst = _isInstructor;
  const isDemo = _isDemoMode;
  const classList = classMembers || [];

  panel.innerHTML = '<div class="ldg"><div class="sp"></div><div class="lt">' +
    _loadMsgs[Math.floor(Math.random()*_loadMsgs.length)] + '</div></div>';

  try {
    let postingData, asnData, feedbackCache, mgData;

    if (isDemo) {
      postingData = samplePostingDays ? samplePostingDays() : {};
      asnData = sampleAssignmentData ? sampleAssignmentData() : null;
      feedbackCache = sampleFeedbackCache ? sampleFeedbackCache() : {};
      mgData = sampleMissingGradesData ? sampleMissingGradesData() : [];
    } else {
      // Live data
      postingData = await analyzePostingDays(userId);
      asnData = await collectAssignmentData();
      mgData = await collectMissingGradesData(classList, userId);
      feedbackCache = null; // loaded on demand per student
    }

    // Sort students for the dropdown
    // classMembers has { id, name } — normalize access
    const students = classList
      .filter(s => String(s.Identifier || s.id) !== userId)
      .map(s => {
        const sid = String(s.Identifier || s.id);
        // name may be "First Last" or have firstName/lastName separately
        const fn = s.FirstName || (s.name ? s.name.split(' ')[0] : '');

        <div class="cd">
          <h3>Assignment Feedback Summary</h3>
          <div class="stu-sel">
            <label for="ghFbStudentSelect">Student:</label>
            <select id="ghFbStudentSelect" data-tip="Select a student to view their rubric scores and instructor feedback across assignments.">${stuOptions}</select>
            <span id="ghFbLoadingIndicator" style="display:none;color:var(--lg);font-size:clamp(.7rem,1vw,.85rem)">
              <span class="ldg" style="display:inline;padding:0"><span class="sp" style="width:16px;height:16px;margin:0 6px 0 0;border-width:2px;vertical-align:middle;display:inline-block"></span></span>Loading feedback\u2026
            </span>
          </div>
          <div id="ghFbTableContainer">
            <div class="fb-nodata">Select a student to view their feedback across all assignments.</div>
          </div>
        </div>
      </div>

      <div class="gh-panel" id="gh-missing">
        ${(isInst || isDemo || (mgData && mgData.items && mgData.items.length)) ? renderMissingGrades(mgData, classList, userId)
                 : '<div class="cd"><p style="color:var(--lg);padding:12px">No missing grades data available. This may require instructor-level access.</p></div>'}
      </div>
    `;

    // Attach scroll hints to missing grades and any other scrollable tables
    try { panel.querySelectorAll('.mg-wrap').forEach(el => initScrollHint(el)); }
    catch(sh) { console.warn('Scroll hint error (missing grades):', sh.message); }

    // Wire up grading helper sub-tabs
    panel.querySelectorAll('.gh-tab').forEach(t => {
      t.addEventListener('click', () => {
        panel.querySelectorAll('.gh-tab').forEach(x => x.classList.remove('active'));
        panel.querySelectorAll('.gh-panel').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        document.getElementById(t.dataset.ghTab)?.classList.add('active');
      });
    });

    // Wire up student selector for feedback
    const selEl = document.getElementById('ghFbStudentSelect');
    const containerEl = document.getElementById('ghFbTableContainer');
    const loadingEl = document.getElementById('ghFbLoadingIndicator');

    if (selEl && asnData) {
      selEl.addEventListener('change', async () => {
        const studentId = selEl.value;
        if (!studentId) {
          containerEl.innerHTML = '<div class="fb-nodata">Select a student to view their feedback across all assignments.</div>';
          return;
        }
        loadingEl.style.display = 'inline';
        containerEl.innerHTML = '<div class="fb-nodata">Loading feedback data\u2026</div>';
        try {
          let studentFb;
          if (feedbackCache && feedbackCache[studentId]) {
            studentFb = feedbackCache[studentId];
          } else {
            studentFb = await loadStudentFeedback(studentId, asnData.assignments, asnData.rubricCache);
          }
          containerEl.innerHTML = renderFeedbackTable(studentFb, asnData.assignments, asnData.rubricCache);
        } catch(e) {
          console.error('Failed to load feedback:', e);
          containerEl.innerHTML = '<div class="fb-nodata">Error loading feedback: ' + esc(e.message) + '</div>';
        }
        loadingEl.style.display = 'none';
      });
    }

    // Tooltips handled automatically via document-level event delegation
  } catch (err) {
    console.error('Grading helper load error:', err);
    panel.innerHTML = '<div class="cd" style="padding:20px;color:var(--lg)">Error loading grading helper: ' + esc(err.message) + '</div>';
  }
}

/* ═══════════════════════════════════════════════════════════════
