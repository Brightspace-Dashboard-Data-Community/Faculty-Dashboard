<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Faculty Dashboard - My Courses and semester overview">
    <title>My Courses - Faculty Dashboard</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="nav-placeholder"></div>

    <main id="main-content" class="main-content" role="main">
        <div class="page-header">
            <div class="page-header-content">
                <div>
                    <h1 class="page-title">My Courses</h1>
                    <p class="page-subtitle">Semester overview metrics, then your course offerings and pinned Brightspace courses</p>
                </div>
                <div class="page-header-right">
                    <span class="semester-label" data-fd-semester-banner="active"></span>
                </div>
            </div>
        </div>

        <!-- Summary Metrics (moved from Home) -->
        <div class="mb-32">
            <div id="summary-row-1" class="summary-row-1">
                <div id="welcome-box" class="summary-box"></div>
                <div id="summary-metrics-1" class="summary-box"></div>
                <div id="summary-metrics-2" class="summary-box"></div>
                <div id="summary-metrics-3" class="summary-box"></div>
            </div>

            <div class="course-filter-section">
                <div class="course-filter-container">
                    <label for="course-filter-select" class="course-filter-label">Filter by Course:</label>
                    <select id="course-filter-select" class="course-filter-select" aria-label="Select course">
                        <option value="all">All Courses</option>
                    </select>
                </div>
            </div>
            <div id="summary-row-2-container"></div>
        </div>

        <!-- Course list -->
        <div class="widget-container mb-32">
            <div id="mycourses-widget"></div>
        </div>

        <!-- Quick Tools keep the same destination URLs used elsewhere in D2L -->
        <div id="quick-tools-section" class="quick-tools-section mb-32"></div>
    </main>

    <script src="js/semester-config.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/summary-metrics.js"></script>
    <script src="js/mycourses.js"></script>
    <script src="js/quick-tools.js"></script>
</body>
</html>
